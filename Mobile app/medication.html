<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HearO - My Medication</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="font-scale.js"></script>
</head>
<body>

  <div class="phone-frame">
    <div class="status-bar">
      <span class="status-time">9:27</span>
      <div class="status-icons">
        <svg width="18" height="12" viewBox="0 0 18 12" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="8" width="3" height="4" rx="0.5" fill="black"/><rect x="4.5" y="6" width="3" height="6" rx="0.5" fill="black"/><rect x="9" y="3" width="3" height="9" rx="0.5" fill="black"/><rect x="13.5" y="0" width="3" height="12" rx="0.5" fill="black"/></svg>
        <svg width="16" height="12" viewBox="0 0 16 12" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M8 10.5C8.6 10.5 9.1 10 9.1 9.4C9.1 8.8 8.6 8.3 8 8.3C7.4 8.3 6.9 8.8 6.9 9.4C6.9 10 7.4 10.5 8 10.5Z" fill="black"/><path d="M8 6.5C9 6.5 9.9 6.9 10.6 7.6L11.6 6.6C10.6 5.6 9.4 5 8 5C6.6 5 5.4 5.6 4.4 6.6L5.4 7.6C6.1 6.9 7 6.5 8 6.5Z" fill="black"/><path d="M8 2.5C10.1 2.5 12 3.3 13.5 4.8L14.5 3.8C12.7 2 10.5 1 8 1C5.5 1 3.3 2 1.5 3.8L2.5 4.8C4 3.3 5.9 2.5 8 2.5Z" fill="black"/></svg>
        <svg width="25" height="12" viewBox="0 0 25 12" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="0.5" y="0.5" width="20" height="11" rx="2.5" stroke="black"/><rect x="2" y="2" width="17" height="8" rx="1.5" fill="black"/><rect x="22" y="4" width="2" height="4" rx="1" fill="black"/></svg>
      </div>
    </div>

    <div class="bp-header">
      <button type="button" class="back-btn" onclick="window.location.href='home.html'">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M12.5 4L6.5 10L12.5 16" stroke="#2b2b2b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <h1>My Medication</h1>
    </div>

    <div class="med-body">

      <div class="med-date-nav">
        <button type="button" class="med-date-nav-btn" id="medPrevDay" aria-label="Previous day">
          <svg width="8" height="13" viewBox="0 0 9 15" fill="none"><path d="M7.5 1.5L1.5 7.5L7.5 13.5" stroke="#2b2b2b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="med-date-nav-label">
          <span class="med-date-nav-day" id="medDateDay">Today</span>
          <span class="med-date-nav-full" id="medDateFull"></span>
        </div>
        <button type="button" class="med-date-today-btn" id="medTodayBtn" hidden>Today</button>
        <button type="button" class="med-date-nav-btn" id="medNextDay" aria-label="Next day">
          <svg width="8" height="13" viewBox="0 0 9 15" fill="none"><path d="M1.5 1.5L7.5 7.5L1.5 13.5" stroke="#2b2b2b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>

      <div class="med-progress-card">
        <div class="med-progress-text" id="medProgressText">0/5 medications taken</div>
        <div class="med-progress-track" id="medProgressTrack"></div>
      </div>

      <div class="med-action-legend">
        <span class="med-action-legend-item">
          <span class="med-action-legend-icon">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12L9 17L20 6"/></svg>
          </span>
          Mark taken
        </span>
        <span class="med-action-legend-item">
          <span class="med-action-legend-icon med-action-legend-icon-nottaken">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6L18 18M6 18L18 6"/></svg>
          </span>
          Mark not taken
        </span>
      </div>

      <button type="button" class="med-update-banner" id="medUpdateBanner" onclick="window.location.href='medication-update.html'">
        <span class="med-update-banner-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#b3781a" stroke-width="1.8"><path d="M12 9V13" stroke-linecap="round"/><circle cx="12" cy="16.5" r="1" fill="#b3781a" stroke="none"/><path d="M10.3 3.9L2.6 17.5C2.1 18.4 2.8 19.5 3.8 19.5H19.2C20.2 19.5 20.9 18.4 20.4 17.5L12.7 3.9C12.2 3 10.8 3 10.3 3.9Z" stroke-linejoin="round"/></svg>
        </span>
        <span class="med-update-banner-text">
          <div class="med-update-banner-title">Furosemide was updated</div>
          <div class="med-update-banner-sub">Tap to review and acknowledge</div>
        </span>
        <svg class="med-update-banner-chevron" width="9" height="15" viewBox="0 0 9 15" fill="none"><path d="M1.5 1.5L7.5 7.5L1.5 13.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>

      <div id="medTimeGroups"></div>

      <div class="med-note">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#444" stroke-width="1.7"><circle cx="12" cy="12" r="9"/><path d="M12 8V13" stroke-linecap="round"/><circle cx="12" cy="16" r="1" fill="#444" stroke="none"/></svg>
        <span>Only your care team can add or change your medication list. If something here looks wrong, please let them know.</span>
      </div>

    </div>

    <!-- Medication detail popup: a bottom-sheet modal over the current screen,
         opened by tapping a dose row, closed via its X or the dimmed backdrop. -->
    <div class="med-detail-overlay" id="medDetailOverlay" hidden>
      <div class="med-detail-sheet">
        <div class="med-detail-sheet-head">
          <h2>Medication details</h2>
          <button type="button" class="med-detail-close-btn" id="medDetailBackBtn" aria-label="Close">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#2b2b2b" stroke-width="2.4" stroke-linecap="round"><path d="M6 6L18 18M6 18L18 6"/></svg>
          </button>
        </div>

        <div class="med-detail-body">

          <div class="med-detail-title-row">
            <span class="med-detail-title-icon">
              <svg width="21" height="21" viewBox="0 0 24 24" fill="none"><path d="M8.5 15.5L15.5 8.5" stroke="#6b4fd6" stroke-width="1.7" stroke-linecap="round"/><rect x="4" y="12.5" width="7.1" height="14" rx="3.5" transform="rotate(-45 4 12.5)" stroke="#6b4fd6" stroke-width="1.7"/><rect x="8.9" y="4.5" width="7.1" height="7.5" rx="3.5" transform="rotate(-45 8.9 4.5)" stroke="#6b4fd6" stroke-width="1.7"/></svg>
            </span>
            <div>
              <div class="med-detail-title-name" id="medDetailName"></div>
              <div class="med-detail-title-sub" id="medDetailDoseSub"></div>
            </div>
          </div>

          <div class="med-detail-info-card">
            <span class="med-detail-info-icon">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8V13" stroke-linecap="round"/><circle cx="12" cy="16" r="1" fill="currentColor" stroke="none"/></svg>
            </span>
            <div>
              <div class="med-detail-info-title" id="medDetailClass"></div>
              <div class="med-detail-info-desc" id="medDetailClassDesc"></div>
            </div>
          </div>

          <div class="med-detail-row">
            <span class="med-detail-row-icon">
              <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
            </span>
            <div>
              <div class="med-detail-row-label">When to take</div>
              <div class="med-detail-row-value" id="medDetailTime"></div>
              <div class="med-detail-row-note" id="medDetailPeriod"></div>
            </div>
          </div>

          <div class="med-detail-row">
            <span class="med-detail-row-icon">
              <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9H21"/><path d="M8 2v4"/><path d="M16 2v4"/></svg>
            </span>
            <div>
              <div class="med-detail-row-label" id="medDetailStatusLabel">Status for today</div>
              <div class="med-detail-row-status" id="medDetailStatusValue"></div>
            </div>
          </div>

        </div>

        <div class="med-detail-footer" id="medDetailFooter"></div>
      </div>
    </div>
  </div>

<script>

  const checkIcon = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12L9 17L20 6"/></svg>`;
  const xIcon = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6L18 18M6 18L18 6"/></svg>`;
  const sunIcon = `<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>`;
  const moonIcon = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 14.5A8.5 8.5 0 1 1 11.5 3a7 7 0 0 0 9 11.5z"/></svg>`;

  // Morning / Afternoon / Night, in that fixed order — each dose falls into
  // whichever bucket its scheduled hour lands in, so the screen always reads
  // as one continuous list instead of three separate hand-off screens.
  const PERIODS = [
    { key: "morning", label: "Morning", icon: sunIcon, night: false, from: 0, to: 720 },
    { key: "afternoon", label: "Afternoon", icon: sunIcon, night: false, from: 720, to: 1020 },
    { key: "night", label: "Night", icon: moonIcon, night: true, from: 1020, to: 1440 },
  ];
  function periodFor(sortKey) {
    return PERIODS.find((p) => sortKey >= p.from && sortKey < p.to) || PERIODS[PERIODS.length - 1];
  }

  // Fixed "today" anchor, matching the mock date medication-history.html
  // already uses, so the two screens agree on what "today" means.
  const TODAY = new Date(2026, 7, 18);
  const startOfDay = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const addDays = (d, delta) => { const n = new Date(d); n.setDate(n.getDate() + delta); return n; };
  const dateKey = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;

  let selectedDate = startOfDay(TODAY);
  const isSelectedToday = () => selectedDate.getTime() === startOfDay(TODAY).getTime();

  function currentPeriodKey() {
    const mins = new Date().getHours() * 60 + new Date().getMinutes();
    return periodFor(mins).key;
  }

  // The medications themselves don't change day to day — only whether each
  // one was taken/not taken on a given day does, so that's kept separately
  // in dayStatus rather than duplicating this list per date.
  const DOSES = [
    { id: 1, med: "furosemide", name: "Furosemide", dose: "40 mg", time: "8:00 AM", sortKey: 480, lockable: true },
    { id: 2, med: "carvedilol", name: "Carvedilol", dose: "12.5 mg", time: "8:00 AM", sortKey: 480 },
    { id: 3, med: "spironolactone", name: "Spironolactone", dose: "25 mg", time: "8:00 AM", sortKey: 480 },
    { id: 4, med: "carvedilol", name: "Carvedilol", dose: "12.5 mg", time: "8:00 PM", sortKey: 1200 },
    { id: 5, med: "atorvastatin", name: "Atorvastatin", dose: "", time: "9:00 PM", sortKey: 1260 },
  ];

  // dayStatus[dateKey][doseId] = "taken" | "not-taken"; a dose with no entry
  // for that day is simply pending. A couple of past days are pre-seeded so
  // stepping back doesn't land on an empty screen.
  const dayStatus = {
    [dateKey(addDays(TODAY, -1))]: { 1: "taken", 2: "taken", 3: "not-taken", 4: "taken", 5: "taken" },
    [dateKey(addDays(TODAY, -2))]: { 1: "taken", 2: "taken", 3: "taken", 4: "taken", 5: "taken" },
  };

  function statusFor(doseId) {
    const day = dayStatus[dateKey(selectedDate)];
    return day ? day[doseId] : undefined;
  }

  function setStatus(doseId, status) {
    const key = dateKey(selectedDate);
    if (!dayStatus[key]) dayStatus[key] = {};
    if (status) dayStatus[key][doseId] = status;
    else delete dayStatus[key][doseId];
  }

  // Class + patient-facing purpose shown in the medication detail popup's
  // info card, keyed by the same med slug used everywhere else on this page.
  const MED_INFO = {
    furosemide: { class: "Diuretic", desc: "Helps your body get rid of extra fluid." },
    carvedilol: { class: "Beta blocker", desc: "Helps control heart rate and blood pressure." },
    spironolactone: { class: "Diuretic", desc: "Helps balance fluid and potassium levels." },
    atorvastatin: { class: "Statin", desc: "Helps lower cholesterol levels." },
  };

  // Acknowledging the Furosemide dose change (on medication-update-detail.html)
  // sends the patient back here with ?ack=furosemide, which unlocks its row.
  // This is about the medication itself, not any one day, so it applies no
  // matter which day is being viewed.
  const params = new URLSearchParams(window.location.search);
  const acknowledgedMed = params.get("ack") || (localStorage.getItem("med_ack_furosemide") ? "furosemide" : null);
  const furosemideAcknowledged = acknowledgedMed === "furosemide";

  const medUpdateBanner = document.getElementById("medUpdateBanner");
  if (furosemideAcknowledged) medUpdateBanner.style.display = "none";

  function isLocked(dose) {
    return !!dose.lockable && !furosemideAcknowledged;
  }

  function formatDayLabel(date) {
    const diff = Math.round((date - startOfDay(TODAY)) / 86400000);
    if (diff === 0) return "Today";
    if (diff === -1) return "Yesterday";
    if (diff === 1) return "Tomorrow";
    return date.toLocaleDateString("en-US", { weekday: "long" });
  }

  function renderDateNav() {
    document.getElementById("medDateDay").textContent = formatDayLabel(selectedDate);
    document.getElementById("medDateFull").textContent = selectedDate.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" });
    document.getElementById("medTodayBtn").hidden = isSelectedToday();
  }

  function updateProgress() {
    const total = DOSES.length;
    const takenCount = DOSES.filter((d) => statusFor(d.id) === "taken").length;
    document.getElementById("medProgressText").textContent = `${takenCount}/${total} medications taken`;
    document.getElementById("medProgressTrack").innerHTML = DOSES
      .map((d) => {
        const s = statusFor(d.id);
        const cls = s === "taken" ? "filled" : s === "not-taken" ? "not-taken" : "";
        return `<span class="med-progress-seg ${cls}"></span>`;
      })
      .join("");
  }

  function renderDoseAction(dose) {
    if (isLocked(dose)) {
      return `<span class="med-locked-tag">Awaiting review</span>`;
    }
    const status = statusFor(dose.id);
    if (status === "taken") {
      return `<button type="button" class="med-status med-status-taken" data-id="${dose.id}" data-reset="1">${checkIcon} Taken</button>`;
    }
    if (status === "not-taken") {
      return `<button type="button" class="med-status med-status-nottaken" data-id="${dose.id}" data-reset="1">${xIcon} Not taken</button>`;
    }
    return `
      <div class="med-dose-item-choice">
        <button type="button" class="med-icon-btn" data-id="${dose.id}" data-action="taken" aria-label="Mark ${dose.name} taken">${checkIcon}</button>
        <button type="button" class="med-icon-btn med-icon-btn-nottaken" data-id="${dose.id}" data-action="not-taken" aria-label="Mark ${dose.name} not taken">${xIcon}</button>
      </div>`;
  }

  function renderTimeGroups() {
    const now = isSelectedToday() ? currentPeriodKey() : null;

    document.getElementById("medTimeGroups").innerHTML = PERIODS
      .map((period) => {
        const group = DOSES.filter((d) => periodFor(d.sortKey).key === period.key);
        if (!group.length) return "";

        const takenCount = group.filter((d) => statusFor(d.id) === "taken").length;
        const notTakenCount = group.filter((d) => statusFor(d.id) === "not-taken").length;
        const total = group.length;
        const pending = group.filter((d) => !isLocked(d) && !statusFor(d.id));

        const distinctTimes = [...new Set(group.map((d) => d.time))];
        const timeSub = distinctTimes.length > 1 ? `${distinctTimes[0]} &ndash; ${distinctTimes[distinctTimes.length - 1]}` : distinctTimes[0];
        const missedNote = notTakenCount ? ` &middot; ${notTakenCount} not taken` : "";

        const rows = group
          .map(
            (dose) => `
          <div class="med-dose-item ${isLocked(dose) ? "med-dose-item-locked" : ""}" data-med="${dose.med}" data-dose-id="${dose.id}">
            <div class="med-dose-info">
              <div class="med-dose-item-name">
                ${dose.name}
                <svg class="med-dose-item-chevron" width="7" height="12" viewBox="0 0 9 15" fill="none"><path d="M1.5 1.5L7.5 7.5L1.5 13.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </div>
              <div class="med-dose-item-sub">${dose.dose ? `${dose.dose} &middot; ` : ""}Take 1 pill</div>
            </div>
            <div class="med-dose-item-action">${renderDoseAction(dose)}</div>
          </div>`
          )
          .join("");

        const groupClass = period.key === now ? (period.night ? "med-time-group-now-night" : "med-time-group-now-day") : "";

        return `
        <div class="med-time-group ${groupClass}">
          <div class="med-time-head">
            <span class="med-time-icon ${period.night ? "med-time-icon-night" : ""}">${period.icon}</span>
            <span class="med-time-head-text">
              <span class="med-time-label">${period.label}</span>
              <span class="med-time-sub">${timeSub}${missedNote}</span>
            </span>
            <span class="med-time-count ${takenCount === total ? "med-time-count-done" : ""}">${takenCount} of ${total} taken</span>
          </div>
          <div class="med-time-card">${rows}</div>
          ${pending.length ? `<button type="button" class="med-mark-all-btn" data-mark-all="${period.key}">Mark all ${pending.length} as taken</button>` : ""}
        </div>`;
      })
      .join("");

    updateProgress();
  }

  function renderAll() {
    renderDateNav();
    renderTimeGroups();
  }

  renderAll();

  /* ---------------- Medication detail popup ---------------- */
  let openDoseId = null;

  function renderDetailStatus(dose) {
    document.getElementById("medDetailStatusLabel").textContent = `Status for ${formatDayLabel(selectedDate)}`;

    const status = statusFor(dose.id);
    const valueEl = document.getElementById("medDetailStatusValue");
    if (status === "taken") {
      valueEl.className = "med-detail-row-status taken";
      valueEl.innerHTML = `<span class="med-detail-row-status-dot">${checkIcon}</span> Taken`;
    } else if (status === "not-taken") {
      valueEl.className = "med-detail-row-status nottaken";
      valueEl.innerHTML = `<span class="med-detail-row-status-dot">${xIcon}</span> Not taken`;
    } else {
      valueEl.className = "med-detail-row-status pending";
      valueEl.innerHTML = `<span class="med-detail-row-status-dot"></span> Not marked yet`;
    }
  }

  function renderDetailFooter(dose) {
    const footer = document.getElementById("medDetailFooter");
    if (isLocked(dose)) {
      footer.innerHTML = `<div class="med-detail-locked-note">This dose was recently updated. Acknowledge the change from the medication list before marking it.</div>`;
      return;
    }
    const status = statusFor(dose.id);
    if (status === "taken") {
      footer.innerHTML = `
        <button type="button" class="med-detail-cta med-detail-cta-undo" data-detail-action="reset">Undo mark</button>
        <button type="button" class="med-detail-link" data-detail-action="not-taken">Mark as not taken instead</button>`;
    } else if (status === "not-taken") {
      footer.innerHTML = `
        <button type="button" class="med-detail-cta" data-detail-action="taken">${checkIcon} Mark as taken</button>
        <button type="button" class="med-detail-link med-detail-link-muted" data-detail-action="reset">Undo mark</button>`;
    } else {
      footer.innerHTML = `
        <button type="button" class="med-detail-cta" data-detail-action="taken">${checkIcon} Mark as taken</button>
        <button type="button" class="med-detail-link" data-detail-action="not-taken">Mark as not taken instead</button>`;
    }
  }

  function renderMedDetail(dose) {
    document.getElementById("medDetailName").textContent = dose.name;
    document.getElementById("medDetailDoseSub").textContent = `${dose.dose ? `${dose.dose} · ` : ""}1 pill`;

    const info = MED_INFO[dose.med] || { class: "Medication", desc: "Ask your care team for more information about this medication." };
    document.getElementById("medDetailClass").textContent = info.class;
    document.getElementById("medDetailClassDesc").textContent = info.desc;

    document.getElementById("medDetailTime").textContent = dose.time;
    document.getElementById("medDetailPeriod").textContent = periodFor(dose.sortKey).label;

    renderDetailStatus(dose);
    renderDetailFooter(dose);
  }

  const medDetailOverlay = document.getElementById("medDetailOverlay");

  function openMedDetail(doseId) {
    const dose = DOSES.find((d) => d.id === doseId);
    if (!dose) return;
    openDoseId = doseId;
    renderMedDetail(dose);
    medDetailOverlay.hidden = false;
  }

  function closeMedDetail() {
    openDoseId = null;
    medDetailOverlay.hidden = true;
  }

  document.getElementById("medDetailBackBtn").addEventListener("click", closeMedDetail);
  medDetailOverlay.addEventListener("click", (e) => { if (e.target === medDetailOverlay) closeMedDetail(); });

  document.getElementById("medDetailFooter").addEventListener("click", (e) => {
    const btn = e.target.closest("[data-detail-action]");
    if (!btn || openDoseId == null) return;
    setStatus(openDoseId, btn.dataset.detailAction === "reset" ? null : btn.dataset.detailAction);
    renderMedDetail(DOSES.find((d) => d.id === openDoseId));
    renderTimeGroups();
  });

  document.getElementById("medPrevDay").addEventListener("click", () => { selectedDate = addDays(selectedDate, -1); renderAll(); });
  document.getElementById("medNextDay").addEventListener("click", () => { selectedDate = addDays(selectedDate, 1); renderAll(); });
  document.getElementById("medTodayBtn").addEventListener("click", () => { selectedDate = startOfDay(TODAY); renderAll(); });

  document.getElementById("medTimeGroups").addEventListener("click", (e) => {
    const markAllBtn = e.target.closest("[data-mark-all]");
    if (markAllBtn) {
      const periodKey = markAllBtn.dataset.markAll;
      DOSES.filter((d) => periodFor(d.sortKey).key === periodKey && !isLocked(d) && !statusFor(d.id)).forEach((d) => setStatus(d.id, "taken"));
      renderTimeGroups();
      return;
    }

    const actionBtn = e.target.closest("[data-action]");
    if (actionBtn) {
      setStatus(Number(actionBtn.dataset.id), actionBtn.dataset.action);
      renderTimeGroups();
      return;
    }

    const resetBtn = e.target.closest("[data-reset]");
    if (resetBtn) {
      setStatus(Number(resetBtn.dataset.id), null);
      renderTimeGroups();
      return;
    }

    // Tapping a dose row (outside its action buttons) opens its detail popup.
    const row = e.target.closest(".med-dose-item");
    if (row && !row.classList.contains("med-dose-item-locked")) {
      openMedDetail(Number(row.dataset.doseId));
    }
  });
</script>
</body>
</html>
