<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HearO - My Medication</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/Mobile%20app/style.css?v=17">
<script src="/Mobile%20app/font-scale.js?v=17"></script>
</head>
<body>

  <div class="phone-frame">
    <div class="status-bar">
      <span class="status-time">9:27</span>
      <div class="status-icons">
        <svg width="18" height="12" viewBox="0 0 18 12" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="8" width="3" height="4" rx="0.5" fill="black"/><rect x="4.5" y="6" width="3" height="6" rx="0.5" fill="black"/><rect x="9" y="3" width="3" height="9" rx="0.5" fill="black"/><rect x="13.5" y="0" width="3" height="12" rx="0.5" fill="black"/></svg>
        <svg width="16" height="12" viewBox="0 0 16 12" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M8 10.5C8.6 10.5 9.1 10 9.1 9.4C9.1 8.8 8.6 8.3 8 8.3C7.4 8.3 6.9 8.8 6.9 9.4C6.9 10 7.4 10.5 8 10.5Z" fill="black"/><path d="M8 6.5C9 6.5 9.9 6.9 10.6 7.6L11.6 6.6C10.6 5.6 9.4 5 8 5C6.6 5 5.4 5.6 4.4 6.6L5.4 7.6C6.1 6.9 7 6.5 8 6.5Z" fill="black"/><path d="M8 2.5C10.1 2.5 12 3.3 13.5 4.8L14.5 3.8C12.7 2 10.5 1 8 1C5.5 1 3.3 2 1.5 3.8L2.5 4.8C4 3.3 5.9 2.5 8 2.5Z" fill="black"/></svg>
        <svg width="25" height="12" viewBox="0 0 25 12" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="0.5" y="0.5" width="20" height="11" rx="2.5" stroke="black"/><rect x="2" y="2" width="17" height="8" rx="1.5" fill="black"/><rect x="22" y="4" width="2" height="4" rx="1" fill="black"/></svg>
      </div>
    </div>

    <div class="bp-header">
      <button type="button" class="back-btn" onclick="window.location.href='/Mobile%20app/home.html'">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M12.5 4L6.5 10L12.5 16" stroke="#252424" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <h1>My medication</h1>
    </div>

    <div class="med-body">

      <div class="med-date-nav">
        <button type="button" class="med-date-nav-btn" id="medPrevDay" aria-label="Previous day">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M15 4.5L7 12L15 19.5" stroke="#252424" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="med-date-nav-label">
          <span class="med-date-nav-day" id="medDateDay">Today</span>
          <span class="med-date-nav-full" id="medDateFull"></span>
        </div>
        <button type="button" class="med-date-today-btn" id="medTodayBtn" hidden>Today</button>
        <button type="button" class="med-date-nav-btn" id="medNextDay" aria-label="Next day">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M9 4.5L17 12L9 19.5" stroke="#252424" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>

      <div id="medTimeGroups"></div>

    </div>
  </div>

<script>

  const checkIcon = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12L9 17L20 6"/></svg>`;
  const xIcon = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6L18 18M6 18L18 6"/></svg>`;
  const sunIcon = `<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>`;
  const moonIcon = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 14.5A8.5 8.5 0 1 1 11.5 3a7 7 0 0 0 9 11.5z"/></svg>`;

  // Morning / Afternoon / Night, in that fixed order — each dose falls into
  // whichever bucket its scheduled hour lands in, so the screen always reads
  // as one continuous list instead of three separate hand-off screens.
  const PERIODS = [
    { key: "morning", label: "Morning", icon: sunIcon, night: false, from: 0, to: 720 },
    { key: "afternoon", label: "Afternoon", icon: sunIcon, night: false, from: 720, to: 1020 },
    { key: "night", label: "Night", icon: moonIcon, night: true, from: 1020, to: 1440 },
  ];
  function periodFor(sortKey) {
    return PERIODS.find((p) => sortKey >= p.from && sortKey < p.to) || PERIODS[PERIODS.length - 1];
  }

  // Fixed "today" anchor, matching the mock date medication-history.html
  // already uses, so the two screens agree on what "today" means.
  const TODAY = new Date(2026, 7, 18);
  const startOfDay = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const addDays = (d, delta) => { const n = new Date(d); n.setDate(n.getDate() + delta); return n; };
  const dateKey = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;

  let selectedDate = startOfDay(TODAY);
  const isSelectedToday = () => selectedDate.getTime() === startOfDay(TODAY).getTime();

  function currentPeriodKey() {
    const mins = new Date().getHours() * 60 + new Date().getMinutes();
    return periodFor(mins).key;
  }

  // The medications themselves don't change day to day — only whether each
  // one was taken/not taken on a given day does, so that's kept separately
  // in dayStatus rather than duplicating this list per date.
  const DOSES = [
    { id: 2, med: "carvedilol", name: "Carvedilol", dose: "12.5 mg", time: "8:00 AM", sortKey: 480 },
    { id: 3, med: "spironolactone", name: "Spironolactone", dose: "25 mg", time: "8:00 AM", sortKey: 480 },
    { id: 4, med: "carvedilol", name: "Carvedilol", dose: "12.5 mg", time: "8:00 PM", sortKey: 1200 },
    { id: 5, med: "atorvastatin", name: "Atorvastatin", dose: "", time: "9:00 PM", sortKey: 1260 },
  ];

  // dayStatus[dateKey][doseId] = "taken" | "not-taken"; a dose with no entry
  // for that day is simply pending. A couple of past days are pre-seeded so
  // stepping back doesn't land on an empty screen.
  const dayStatus = {
    [dateKey(addDays(TODAY, -1))]: { 2: "taken", 3: "not-taken", 4: "taken", 5: "taken" },
    [dateKey(addDays(TODAY, -2))]: { 2: "taken", 3: "taken", 4: "taken", 5: "taken" },
  };

  function statusFor(doseId) {
    const day = dayStatus[dateKey(selectedDate)];
    return day ? day[doseId] : undefined;
  }

  function setStatus(doseId, status) {
    const key = dateKey(selectedDate);
    if (!dayStatus[key]) dayStatus[key] = {};
    if (status) dayStatus[key][doseId] = status;
    else delete dayStatus[key][doseId];
  }

  // Class + patient-facing purpose shown in the medication detail popup's
  // info card, keyed by the same med slug used everywhere else on this page.
  const MED_INFO = {
    carvedilol: { class: "Beta blocker", desc: "Helps control heart rate and blood pressure." },
    spironolactone: { class: "Diuretic", desc: "Helps balance fluid and potassium levels." },
    atorvastatin: { class: "Statin", desc: "Helps lower cholesterol levels." },
  };

  function formatDayLabel(date) {
    const diff = Math.round((date - startOfDay(TODAY)) / 86400000);
    if (diff === 0) return "Today";
    if (diff === -1) return "Yesterday";
    if (diff === 1) return "Tomorrow";
    return date.toLocaleDateString("en-US", { weekday: "long" });
  }

  function renderDateNav() {
    document.getElementById("medDateDay").textContent = formatDayLabel(selectedDate);
    document.getElementById("medDateFull").textContent = selectedDate.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" });
    document.getElementById("medTodayBtn").hidden = isSelectedToday();
  }

  function renderDoseAction(dose) {
    const status = statusFor(dose.id);
    if (status === "taken" || status === "not-taken") {
      const label = status === "taken" ? "Taken" : "Skipped";
      const icon = status === "taken" ? checkIcon : xIcon;
      return `<span class="med-action-status med-action-status-${status === "taken" ? "taken" : "nottaken"}">${icon} ${label}</span>`;
    }
    return `
      <button type="button" class="med-action-btn" data-id="${dose.id}" data-action="taken">${checkIcon} Take</button>
      <button type="button" class="med-action-btn med-action-btn-nottaken" data-id="${dose.id}" data-action="not-taken">${xIcon} Skip</button>`;
  }

  function renderTimeGroups() {
    const now = isSelectedToday() ? currentPeriodKey() : null;

    document.getElementById("medTimeGroups").innerHTML = PERIODS
      .map((period) => {
        const group = DOSES.filter((d) => periodFor(d.sortKey).key === period.key);
        if (!group.length) return "";

        const takenCount = group.filter((d) => statusFor(d.id) === "taken").length;
        const notTakenCount = group.filter((d) => statusFor(d.id) === "not-taken").length;
        const total = group.length;
        const pending = group.filter((d) => !statusFor(d.id));

        const distinctTimes = [...new Set(group.map((d) => d.time))];
        const timeSub = distinctTimes.length > 1 ? `${distinctTimes[0]} &ndash; ${distinctTimes[distinctTimes.length - 1]}` : distinctTimes[0];
        const missedNote = notTakenCount ? ` &middot; ${notTakenCount} not taken` : "";

        const rows = group
          .map(
            (dose) => `
          <div class="med-dose-card" data-med="${dose.med}" data-dose-id="${dose.id}">
            <div class="med-dose-card-info">
              <div class="med-dose-card-name">
                ${dose.name}
                <svg class="med-dose-card-chevron" width="7" height="12" viewBox="0 0 9 15" fill="none"><path d="M1.5 1.5L7.5 7.5L1.5 13.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </div>
              <div class="med-dose-card-sub">${dose.dose ? `${dose.dose} &middot; ` : ""}Take 1 pill</div>
            </div>
            <div class="med-dose-card-actions">${renderDoseAction(dose)}</div>
          </div>`
          )
          .join("");

        const groupClass = period.key === now ? (period.night ? "med-time-group-now-night" : "med-time-group-now-day") : "";

        return `
        <div class="med-time-group ${groupClass}">
          <div class="med-time-head">
            <span class="med-time-icon ${period.night ? "med-time-icon-night" : ""}">${period.icon}</span>
            <span class="med-time-head-text">
              <span class="med-time-label">${period.label}</span>
              <span class="med-time-sub">${timeSub}${missedNote}</span>
            </span>
            <span class="med-time-count ${takenCount === total ? "med-time-count-done" : ""}">${takenCount} of ${total} taken</span>
          </div>
          <div class="med-time-card">${rows}</div>
          ${pending.length ? `<button type="button" class="med-mark-all-btn" data-mark-all="${period.key}">Mark all ${pending.length} as taken</button>` : ""}
        </div>`;
      })
      .join("");
  }

  function renderAll() {
    renderDateNav();
    renderTimeGroups();
  }

  renderAll();

  document.getElementById("medPrevDay").addEventListener("click", () => { selectedDate = addDays(selectedDate, -1); renderAll(); });
  document.getElementById("medNextDay").addEventListener("click", () => { selectedDate = addDays(selectedDate, 1); renderAll(); });
  document.getElementById("medTodayBtn").addEventListener("click", () => { selectedDate = startOfDay(TODAY); renderAll(); });

  document.getElementById("medTimeGroups").addEventListener("click", (e) => {
    const markAllBtn = e.target.closest("[data-mark-all]");
    if (markAllBtn) {
      const periodKey = markAllBtn.dataset.markAll;
      DOSES.filter((d) => periodFor(d.sortKey).key === periodKey && !statusFor(d.id)).forEach((d) => setStatus(d.id, "taken"));
      renderTimeGroups();
      return;
    }

    const actionBtn = e.target.closest("[data-action]");
    if (actionBtn) {
      setStatus(Number(actionBtn.dataset.id), actionBtn.dataset.action);
      renderTimeGroups();
      return;
    }

    const resetBtn = e.target.closest("[data-reset]");
    if (resetBtn) {
      setStatus(Number(resetBtn.dataset.id), null);
      renderTimeGroups();
      return;
    }

    // Tapping a dose card (outside its action buttons) opens that medication's history.
    const row = e.target.closest(".med-dose-card");
    if (row) {
      window.location.href = `/Mobile%20app/medication-history.html?med=${row.dataset.med}`;
    }
  });
</script>
</body>
</html>
