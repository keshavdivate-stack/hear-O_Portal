<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HearO - Medications</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/Mobile%20app/style.css?v=34">
<script src="/Mobile%20app/font-scale.js?v=29"></script>
</head>
<body>

  <div class="phone-frame">
    <div class="status-bar">
      <span class="status-time">9:27</span>
      <div class="status-icons">
        <svg width="18" height="12" viewBox="0 0 18 12" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="8" width="3" height="4" rx="0.5" fill="black"/><rect x="4.5" y="6" width="3" height="6" rx="0.5" fill="black"/><rect x="9" y="3" width="3" height="9" rx="0.5" fill="black"/><rect x="13.5" y="0" width="3" height="12" rx="0.5" fill="black"/></svg>
        <svg width="16" height="12" viewBox="0 0 16 12" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M8 10.5C8.6 10.5 9.1 10 9.1 9.4C9.1 8.8 8.6 8.3 8 8.3C7.4 8.3 6.9 8.8 6.9 9.4C6.9 10 7.4 10.5 8 10.5Z" fill="black"/><path d="M8 6.5C9 6.5 9.9 6.9 10.6 7.6L11.6 6.6C10.6 5.6 9.4 5 8 5C6.6 5 5.4 5.6 4.4 6.6L5.4 7.6C6.1 6.9 7 6.5 8 6.5Z" fill="black"/><path d="M8 2.5C10.1 2.5 12 3.3 13.5 4.8L14.5 3.8C12.7 2 10.5 1 8 1C5.5 1 3.3 2 1.5 3.8L2.5 4.8C4 3.3 5.9 2.5 8 2.5Z" fill="black"/></svg>
        <svg width="25" height="12" viewBox="0 0 25 12" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="0.5" y="0.5" width="20" height="11" rx="2.5" stroke="black"/><rect x="2" y="2" width="17" height="8" rx="1.5" fill="black"/><rect x="22" y="4" width="2" height="4" rx="1" fill="black"/></svg>
      </div>
    </div>

    <div class="mx-header">
      <button type="button" class="back-btn" onclick="window.location.href='/Mobile%20app/home.html'">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M12.5 4L6.5 10L12.5 16" stroke="#252424" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <h1>Medications</h1>
    </div>

    <div class="mx-body">

      <div class="mx-tabs" id="medTabs">
        <button type="button" class="mx-tab" data-tab="clinic">Clinic Prescribed</button>
        <button type="button" class="mx-tab" data-tab="mine">My Medications</button>
      </div>

      <div class="mx-date-nav">
        <button type="button" class="mx-circle-btn" id="medPrevDay" aria-label="Previous day">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M15 4.5L7 12L15 19.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="mx-date-label">
          <span class="mx-date-day" id="medDateDay">Today</span>
          <span class="mx-date-full" id="medDateFull"></span>
        </div>
        <button type="button" class="mx-circle-btn" id="medNextDay" aria-label="Next day">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M9 4.5L17 12L9 19.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>

      <div id="medTimeGroups"></div>

    </div>

    <div class="mx-footer-nav" id="medFooterNav">
      <button type="button" class="mx-footer-nav-item" id="historyNavBtn" aria-label="History">
        <span class="mx-footer-nav-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#186DCE" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 2.6-6.35"/><path d="M3 4.5V9h4.5"/><path d="M12 8v4.5l3.5 2"/></svg>
        </span>
        <span>History</span>
      </button>
      <button type="button" class="mx-footer-nav-item" id="updatesNavBtn" onclick="window.location.href='/Mobile%20app/history.html'" aria-label="Medication updates">
        <span class="mx-footer-nav-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#186DCE" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        </span>
        <span>Medication Updates</span>
      </button>
    </div>

    <button type="button" class="fab-add-btn fab-add-btn--above-footer" id="addFab" aria-label="Add medication" onclick="window.location.href='/Mobile%20app/add-medication.html'">+</button>
  </div>

<script>
  const checkIcon = `<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12L9 17L20 6"/></svg>`;
  const xIcon = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6L18 18M6 18L18 6"/></svg>`;
  const sunIcon = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>`;
  const foodIcon = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 2v8a2 2 0 1 1-4 0V2"/><path d="M5 10v12"/><path d="M11 2c2 0 3 2.2 3 5s-1 5-3 5"/><path d="M14 12v10"/></svg>`;
  const FOOD_LABEL = { before: "Before food", after: "After food", with: "With food" };

  // Fixed "today" anchor, matching the mock date the history screen uses.
  const TODAY = new Date(2026, 7, 18);
  const startOfDay = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const addDays = (d, delta) => { const n = new Date(d); n.setDate(n.getDate() + delta); return n; };
  const dateKey = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;

  // Each tab keeps its own doses, dose history and "selected day" --
  // switching tabs never mixes clinic-prescribed and self-tracked doses.
  const TABS = {
    clinic: {
      label: "Clinic Prescribed",
      historyUrl: "/Mobile%20app/clinic-history.html",
      showUpdates: true,
      showAddFab: false,
      emptyMessage: null,
      doses: [
        { id: 1, name: "Spironolactone", dose: "40 mg", time: "8:00 AM", sortKey: 480, food: "with" },
        { id: 2, name: "Carvedilol", dose: "40 mg", time: "8:00 AM", sortKey: 480, food: "with" },
        { id: 4, name: "Furosemide", dose: "40 mg", time: "8:00 AM", sortKey: 480, food: "before" },
        { id: 3, name: "Spironolactone", dose: "40 mg", time: "2:00 PM", sortKey: 840, food: "with" },
        { id: 5, name: "Carvedilol", dose: "40 mg", time: "8:00 PM", sortKey: 1200, food: "with" },
        { id: 6, name: "Furosemide", dose: "40 mg", time: "8:00 PM", sortKey: 1200, food: "before" },
        { id: 7, name: "Atorvastatin", dose: "40 mg", time: "9:00 PM", sortKey: 1260, food: "after" },
      ],
      selectedDate: startOfDay(TODAY),
      dayStatus: {
        [dateKey(TODAY)]: { 1: "taken" },
        [dateKey(addDays(TODAY, -1))]: { 1: "taken", 2: "skipped", 3: "taken", 4: "taken", 5: "taken", 6: "taken", 7: "taken" },
        [dateKey(addDays(TODAY, -2))]: { 1: "taken", 2: "taken", 3: "taken", 4: "taken", 5: "taken", 6: "taken", 7: "taken" },
      },
    },
    mine: {
      label: "My Medications",
      historyUrl: "/Mobile%20app/my-medications-history.html",
      showUpdates: false,
      showAddFab: true,
      emptyMessage: `No medications yet. Tap + to track one you take on your own.`,
      doses: [
        { id: 1, name: "Vitamin D3", dose: "1000 IU", time: "8:00 AM", sortKey: 480, food: "after" },
        { id: 2, name: "Calcium", dose: "600 mg", time: "8:00 PM", sortKey: 1200, food: "with" },
      ],
      selectedDate: startOfDay(TODAY),
      dayStatus: {
        [dateKey(TODAY)]: {},
        [dateKey(addDays(TODAY, -1))]: { 1: "taken", 2: "taken" },
        [dateKey(addDays(TODAY, -2))]: { 1: "skipped", 2: "taken" },
      },
    },
  };

  let activeTab = new URLSearchParams(window.location.search).get("tab") === "mine" ? "mine" : "clinic";

  const statusFor = (tab, id) => (tab.dayStatus[dateKey(tab.selectedDate)] || {})[id];
  function setStatus(tab, id, status) {
    const key = dateKey(tab.selectedDate);
    if (!tab.dayStatus[key]) tab.dayStatus[key] = {};
    tab.dayStatus[key][id] = status;
  }

  function formatDayLabel(date) {
    const diff = Math.round((date - startOfDay(TODAY)) / 86400000);
    if (diff === 0) return "Today";
    if (diff === -1) return "Yesterday";
    if (diff === 1) return "Tomorrow";
    return date.toLocaleDateString("en-US", { weekday: "long" });
  }

  function renderDoseAction(tab, dose) {
    const status = statusFor(tab, dose.id);
    if (status === "taken") return `<div class="mx-dose-status mx-dose-status--taken">${checkIcon} Taken</div>`;
    if (status === "skipped") return `<div class="mx-dose-status mx-dose-status--skipped">${xIcon} Skipped</div>`;
    return `
      <div class="mx-dose-actions">
        <button type="button" class="mx-btn mx-btn--skip" data-id="${dose.id}" data-action="skipped">${xIcon} Skip</button>
        <button type="button" class="mx-btn mx-btn--take" data-id="${dose.id}" data-action="taken">${checkIcon} Take</button>
      </div>`;
  }

  function renderAll() {
    const tab = TABS[activeTab];

    document.querySelectorAll("#medTabs .mx-tab").forEach((btn) => {
      btn.classList.toggle("active", btn.dataset.tab === activeTab);
    });
    document.getElementById("historyNavBtn").onclick = () => { window.location.href = tab.historyUrl; };
    document.getElementById("updatesNavBtn").style.display = tab.showUpdates ? "" : "none";
    document.getElementById("addFab").style.display = tab.showAddFab ? "" : "none";

    document.getElementById("medDateDay").textContent = formatDayLabel(tab.selectedDate);
    document.getElementById("medDateFull").textContent = tab.selectedDate.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" });

    if (tab.doses.length === 0) {
      document.getElementById("medTimeGroups").innerHTML = `<p style="text-align:center;color:#6f6f6f;padding:24px 0;">${tab.emptyMessage}</p>`;
      return;
    }

    const times = [...new Set(tab.doses.map((d) => d.time))];
    document.getElementById("medTimeGroups").innerHTML = times
      .map((time) => {
        const group = tab.doses.filter((d) => d.time === time);
        const pm = group[0].sortKey >= 720;
        const rows = group
          .map(
            (dose) => `
          <div class="mx-dose">
            <div class="mx-dose-name">
              <span>${dose.name}</span>
              ${dose.food ? `<span class="mx-food-tag">${foodIcon} ${FOOD_LABEL[dose.food]}</span>` : ""}
            </div>
            <div class="mx-dose-sub">${dose.dose} &middot; Take 1 pill</div>
            ${renderDoseAction(tab, dose)}
          </div>`
          )
          .join("");
        return `
        <div class="mx-time-group">
          <div class="mx-time-head">
            <span class="mx-time-icon ${pm ? "mx-time-icon--pm" : ""}">${sunIcon}</span>
            <span class="mx-time-label">${time}</span>
            <button type="button" class="mx-mark-all" data-mark-all="${time}">Mark all as taken</button>
          </div>
          <div class="mx-card">${rows}</div>
        </div>`;
      })
      .join("");
  }
  renderAll();

  document.getElementById("medTabs").addEventListener("click", (e) => {
    const btn = e.target.closest("[data-tab]");
    if (!btn || btn.dataset.tab === activeTab) return;
    activeTab = btn.dataset.tab;
    renderAll();
  });

  document.getElementById("medPrevDay").addEventListener("click", () => { TABS[activeTab].selectedDate = addDays(TABS[activeTab].selectedDate, -1); renderAll(); });
  document.getElementById("medNextDay").addEventListener("click", () => { TABS[activeTab].selectedDate = addDays(TABS[activeTab].selectedDate, 1); renderAll(); });

  document.getElementById("medTimeGroups").addEventListener("click", (e) => {
    const tab = TABS[activeTab];
    const markAll = e.target.closest("[data-mark-all]");
    if (markAll) {
      tab.doses.filter((d) => d.time === markAll.dataset.markAll && !statusFor(tab, d.id)).forEach((d) => setStatus(tab, d.id, "taken"));
      renderAll();
      return;
    }
    const action = e.target.closest("[data-action]");
    if (action) {
      setStatus(tab, Number(action.dataset.id), action.dataset.action);
      renderAll();
    }
  });
</script>
</body>
</html>
