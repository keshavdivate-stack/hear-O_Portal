<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HearO - My Measurements</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/Mobile%20app/style.css?v=11">
<script src="/Mobile%20app/font-scale.js?v=11"></script>
</head>
<body>

  <div class="phone-frame">
    <div class="status-bar">
      <span class="status-time">9:27</span>
      <div class="status-icons">
        <svg width="18" height="12" viewBox="0 0 18 12" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="8" width="3" height="4" rx="0.5" fill="black"/><rect x="4.5" y="6" width="3" height="6" rx="0.5" fill="black"/><rect x="9" y="3" width="3" height="9" rx="0.5" fill="black"/><rect x="13.5" y="0" width="3" height="12" rx="0.5" fill="black"/></svg>
        <svg width="16" height="12" viewBox="0 0 16 12" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M8 10.5C8.6 10.5 9.1 10 9.1 9.4C9.1 8.8 8.6 8.3 8 8.3C7.4 8.3 6.9 8.8 6.9 9.4C6.9 10 7.4 10.5 8 10.5Z" fill="black"/><path d="M8 6.5C9 6.5 9.9 6.9 10.6 7.6L11.6 6.6C10.6 5.6 9.4 5 8 5C6.6 5 5.4 5.6 4.4 6.6L5.4 7.6C6.1 6.9 7 6.5 8 6.5Z" fill="black"/><path d="M8 2.5C10.1 2.5 12 3.3 13.5 4.8L14.5 3.8C12.7 2 10.5 1 8 1C5.5 1 3.3 2 1.5 3.8L2.5 4.8C4 3.3 5.9 2.5 8 2.5Z" fill="black"/></svg>
        <svg width="25" height="12" viewBox="0 0 25 12" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="0.5" y="0.5" width="20" height="11" rx="2.5" stroke="black"/><rect x="2" y="2" width="17" height="8" rx="1.5" fill="black"/><rect x="22" y="4" width="2" height="4" rx="1" fill="black"/></svg>
      </div>
    </div>

    <div class="bp-header">
      <button type="button" class="back-btn" onclick="window.location.href='/Mobile%20app/home.html'">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M12.5 4L6.5 10L12.5 16" stroke="#252424" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <h1>My Measurements</h1>
    </div>

    <div class="measure-body">

      <div class="measure-section">
        <div class="measure-head">
          <div class="measure-icon measure-icon--blue">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><rect x="4" y="3" width="16" height="18" rx="2" stroke="#3B82F6" stroke-width="1.8"/><path d="M8 8h8M8 12h5" stroke="#3B82F6" stroke-width="1.8" stroke-linecap="round"/></svg>
          </div>
          <span class="measure-title">Weight</span>
          <div class="measure-unit-toggle">
            <span class="measure-unit-active">KG</span>
            <span>lbs</span>
          </div>
        </div>

        <div class="measure-date-nav">
          <button type="button" class="measure-nav-btn" aria-label="Previous week">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M10 3L5 8L10 13" stroke="#252424" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <span class="measure-date-range">17-23 Apr</span>
          <button type="button" class="measure-nav-btn" aria-label="Next week">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M6 3L11 8L6 13" stroke="#252424" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>

        <div class="measure-chart">
          <div class="measure-chart-yaxis">
            <span>80</span><span>75</span><span>70</span><span>65</span>
          </div>
          <div class="measure-chart-svg-wrap">
            <svg viewBox="0 0 301 130" preserveAspectRatio="none" class="measure-chart-svg">
              <line x1="0" y1="10" x2="301" y2="10" stroke="#EBEDF0" stroke-width="1"/>
              <line x1="0" y1="43" x2="301" y2="43" stroke="#EBEDF0" stroke-width="1"/>
              <line x1="0" y1="76" x2="301" y2="76" stroke="#EBEDF0" stroke-width="1"/>
              <line x1="0" y1="109" x2="301" y2="109" stroke="#EBEDF0" stroke-width="1"/>
              <polyline points="17,80 60,88 103,72 146,90 189,97 232,89 275,58" fill="none" stroke="#3B82F6" stroke-width="2"/>
              <circle cx="17" cy="80" r="5" fill="#3B82F6"/>
              <circle cx="60" cy="88" r="5" fill="#3B82F6"/>
              <circle cx="103" cy="72" r="5" fill="#3B82F6"/>
              <circle cx="146" cy="90" r="5" fill="#3B82F6"/>
              <circle cx="189" cy="97" r="5" fill="#3B82F6"/>
              <circle cx="232" cy="89" r="5" fill="#3B82F6"/>
              <circle cx="275" cy="58" r="7" fill="#3B82F6" stroke="#fff" stroke-width="2"/>
            </svg>
          </div>
        </div>
        <div class="measure-chart-xaxis">
          <span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span><span>Mon</span><span>Tue</span><span class="measure-xaxis-active">Wed</span>
        </div>

        <button type="button" class="measure-add-btn measure-add-btn--blue" onclick="window.location.href='/Mobile%20app/weight.html'">+ Add weight</button>
      </div>

      <div class="measure-section">
        <div class="measure-head">
          <div class="measure-icon measure-icon--purple">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M12 21s-7-4.5-9.3-9.2C1.2 8.8 2.6 5.5 5.6 4.6c2-.6 4 .2 5.1 1.9C11.9 4.8 13.9 4 15.9 4.6c3 .9 4.4 4.2 2.9 7.2C16.4 16.5 12 21 12 21z" stroke="#935CFC" stroke-width="1.6" stroke-linejoin="round"/><path d="M6 12h2l1.2-2.4L11 14l1.2-2.4L13 12h5" stroke="#935CFC" stroke-width="1.4" stroke-linejoin="round"/></svg>
          </div>
          <span class="measure-title">Blood Pressure</span>
        </div>

        <div class="measure-date-nav">
          <button type="button" class="measure-nav-btn" aria-label="Previous week">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M10 3L5 8L10 13" stroke="#252424" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <span class="measure-date-range">17-23 Apr</span>
          <button type="button" class="measure-nav-btn" aria-label="Next week">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M6 3L11 8L6 13" stroke="#252424" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>

        <div class="measure-legend">
          <span class="measure-legend-item"><span class="measure-legend-dot" style="background:#935CFC;"></span>Systolic</span>
          <span class="measure-legend-item"><span class="measure-legend-dot" style="background:#501CB3;"></span>Diastolic</span>
        </div>

        <div class="measure-chart">
          <div class="measure-chart-yaxis">
            <span>200</span><span>150</span><span>100</span><span>50</span>
          </div>
          <div class="measure-chart-svg-wrap">
            <svg viewBox="0 0 301 130" preserveAspectRatio="none" class="measure-chart-svg">
              <line x1="0" y1="10" x2="301" y2="10" stroke="#EBEDF0" stroke-width="1"/>
              <line x1="0" y1="43" x2="301" y2="43" stroke="#EBEDF0" stroke-width="1"/>
              <line x1="0" y1="76" x2="301" y2="76" stroke="#EBEDF0" stroke-width="1"/>
              <line x1="0" y1="109" x2="301" y2="109" stroke="#EBEDF0" stroke-width="1"/>
              <polyline points="17,53 60,46 103,58 146,42 189,50 232,44 275,25" fill="none" stroke="#935CFC" stroke-width="2"/>
              <circle cx="17" cy="53" r="5" fill="#935CFC"/><circle cx="60" cy="46" r="5" fill="#935CFC"/><circle cx="103" cy="58" r="5" fill="#935CFC"/><circle cx="146" cy="42" r="5" fill="#935CFC"/><circle cx="189" cy="50" r="5" fill="#935CFC"/><circle cx="232" cy="44" r="5" fill="#935CFC"/><circle cx="275" cy="25" r="7" fill="#935CFC" stroke="#fff" stroke-width="2"/>
              <polyline points="17,88 60,92 103,86 146,96 189,98 232,97 275,68" fill="none" stroke="#501CB3" stroke-width="2"/>
              <circle cx="17" cy="88" r="5" fill="#501CB3"/><circle cx="60" cy="92" r="5" fill="#501CB3"/><circle cx="103" cy="86" r="5" fill="#501CB3"/><circle cx="146" cy="96" r="5" fill="#501CB3"/><circle cx="189" cy="98" r="5" fill="#501CB3"/><circle cx="232" cy="97" r="5" fill="#501CB3"/><circle cx="275" cy="68" r="7" fill="#501CB3" stroke="#fff" stroke-width="2"/>
            </svg>
          </div>
        </div>
        <div class="measure-chart-xaxis">
          <span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span><span>Mon</span><span>Tue</span><span class="measure-xaxis-active">Wed</span>
        </div>

        <button type="button" class="measure-add-btn measure-add-btn--purple" onclick="window.location.href='/Mobile%20app/blood-pressure.html'">+ Add blood pressure</button>
      </div>

      <div class="measure-section">
        <div class="measure-head">
          <div class="measure-icon measure-icon--green">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M12 21s-7-4.5-9.3-9.2C1.2 8.8 2.6 5.5 5.6 4.6c2-.6 4 .2 5.1 1.9C11.9 4.8 13.9 4 15.9 4.6c3 .9 4.4 4.2 2.9 7.2C16.4 16.5 12 21 12 21z" stroke="#2AC19E" stroke-width="1.8" stroke-linejoin="round"/></svg>
          </div>
          <span class="measure-title">Heart Rate</span>
        </div>

        <div class="measure-date-nav">
          <button type="button" class="measure-nav-btn" aria-label="Previous week">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M10 3L5 8L10 13" stroke="#252424" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <span class="measure-date-range">17-23 Apr</span>
          <button type="button" class="measure-nav-btn" aria-label="Next week">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M6 3L11 8L6 13" stroke="#252424" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>

        <div class="measure-chart">
          <div class="measure-chart-yaxis">
            <span>160</span><span>130</span><span>90</span><span>50</span>
          </div>
          <div class="measure-chart-svg-wrap">
            <svg viewBox="0 0 301 130" preserveAspectRatio="none" class="measure-chart-svg">
              <line x1="0" y1="10" x2="301" y2="10" stroke="#EBEDF0" stroke-width="1"/>
              <line x1="0" y1="43" x2="301" y2="43" stroke="#EBEDF0" stroke-width="1"/>
              <line x1="0" y1="76" x2="301" y2="76" stroke="#EBEDF0" stroke-width="1"/>
              <line x1="0" y1="109" x2="301" y2="109" stroke="#EBEDF0" stroke-width="1"/>
              <polyline points="17,72 60,68 103,73 146,70 189,66 232,72 275,40" fill="none" stroke="#2AC19E" stroke-width="2"/>
              <circle cx="17" cy="72" r="5" fill="#2AC19E"/><circle cx="60" cy="68" r="5" fill="#2AC19E"/><circle cx="103" cy="73" r="5" fill="#2AC19E"/><circle cx="146" cy="70" r="5" fill="#2AC19E"/><circle cx="189" cy="66" r="5" fill="#2AC19E"/><circle cx="232" cy="72" r="5" fill="#2AC19E"/><circle cx="275" cy="40" r="7" fill="#2AC19E" stroke="#fff" stroke-width="2"/>
            </svg>
          </div>
        </div>
        <div class="measure-chart-xaxis">
          <span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span><span>Mon</span><span>Tue</span><span class="measure-xaxis-active">Wed</span>
        </div>

        <button type="button" class="measure-add-btn measure-add-btn--green" onclick="window.location.href='/Mobile%20app/measurements.html'">+ Add heart rate</button>
      </div>

      <div class="measure-section">
        <div class="measure-head">
          <div class="measure-icon measure-icon--orange">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11Z" stroke="#F98B00" stroke-width="1.8" stroke-linejoin="round"/></svg>
          </div>
          <span class="measure-title">Blood Oxygen (SpO&#8322;)</span>
        </div>

        <div class="measure-date-nav">
          <button type="button" class="measure-nav-btn" aria-label="Previous week">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M10 3L5 8L10 13" stroke="#252424" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <span class="measure-date-range">17-23 Apr</span>
          <button type="button" class="measure-nav-btn" aria-label="Next week">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M6 3L11 8L6 13" stroke="#252424" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>

        <div class="measure-chart">
          <div class="measure-chart-yaxis">
            <span>100</span><span>99</span><span>98</span><span>97</span>
          </div>
          <div class="measure-chart-svg-wrap">
            <svg viewBox="0 0 301 130" preserveAspectRatio="none" class="measure-chart-svg">
              <line x1="0" y1="10" x2="301" y2="10" stroke="#EBEDF0" stroke-width="1"/>
              <line x1="0" y1="43" x2="301" y2="43" stroke="#EBEDF0" stroke-width="1"/>
              <line x1="0" y1="76" x2="301" y2="76" stroke="#EBEDF0" stroke-width="1"/>
              <line x1="0" y1="109" x2="301" y2="109" stroke="#EBEDF0" stroke-width="1"/>
              <polyline points="17,97 60,92 103,90 146,98 189,68 232,63 275,80" fill="none" stroke="#F98B00" stroke-width="2"/>
              <circle cx="17" cy="97" r="5" fill="#F98B00"/><circle cx="60" cy="92" r="5" fill="#F98B00"/><circle cx="103" cy="90" r="5" fill="#F98B00"/><circle cx="146" cy="98" r="5" fill="#F98B00"/><circle cx="189" cy="68" r="5" fill="#F98B00"/><circle cx="232" cy="63" r="5" fill="#F98B00"/><circle cx="275" cy="80" r="7" fill="#F98B00" stroke="#fff" stroke-width="2"/>
            </svg>
          </div>
        </div>
        <div class="measure-chart-xaxis">
          <span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span><span>Mon</span><span>Tue</span><span class="measure-xaxis-active">Wed</span>
        </div>

        <button type="button" class="measure-add-btn measure-add-btn--orange" onclick="window.location.href='/Mobile%20app/measurements.html'">+ Add blood oxygen</button>
      </div>

    </div>
  </div>

</body>
</html>
