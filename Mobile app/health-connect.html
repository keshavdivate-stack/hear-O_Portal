<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HearO - Health Connection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/Mobile%20app/style.css?v=6">
<script src="/Mobile%20app/font-scale.js?v=6"></script>
</head>
<body>

  <div class="phone-frame">
    <div class="status-bar">
      <span class="status-time">1:47</span>
      <div class="status-icons">
        <svg width="18" height="12" viewBox="0 0 18 12" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="8" width="3" height="4" rx="0.5" fill="black"/><rect x="4.5" y="6" width="3" height="6" rx="0.5" fill="black"/><rect x="9" y="3" width="3" height="9" rx="0.5" fill="black"/><rect x="13.5" y="0" width="3" height="12" rx="0.5" fill="black"/></svg>
        <svg width="16" height="12" viewBox="0 0 16 12" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M8 10.5C8.6 10.5 9.1 10 9.1 9.4C9.1 8.8 8.6 8.3 8 8.3C7.4 8.3 6.9 8.8 6.9 9.4C6.9 10 7.4 10.5 8 10.5Z" fill="black"/><path d="M8 6.5C9 6.5 9.9 6.9 10.6 7.6L11.6 6.6C10.6 5.6 9.4 5 8 5C6.6 5 5.4 5.6 4.4 6.6L5.4 7.6C6.1 6.9 7 6.5 8 6.5Z" fill="black"/><path d="M8 2.5C10.1 2.5 12 3.3 13.5 4.8L14.5 3.8C12.7 2 10.5 1 8 1C5.5 1 3.3 2 1.5 3.8L2.5 4.8C4 3.3 5.9 2.5 8 2.5Z" fill="black"/></svg>
        <svg width="25" height="12" viewBox="0 0 25 12" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="0.5" y="0.5" width="20" height="11" rx="2.5" stroke="black"/><rect x="2" y="2" width="17" height="8" rx="1.5" fill="black"/><rect x="22" y="4" width="2" height="4" rx="1" fill="black"/></svg>
      </div>
    </div>

    <div class="locked-content">
      <div class="health-icon-outer">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 19C12 19 4.5 14.2 4.5 9C4.5 6.2 6.7 4 9.5 4C10.9 4 12 4.7 12 5.5C12 4.7 13.1 4 14.5 4C17.3 4 19.5 6.2 19.5 9C19.5 14.2 12 19 12 19Z" stroke="#186DCE" stroke-width="1.8" stroke-linejoin="round"/>
          <circle cx="17.5" cy="6.5" r="2.6" fill="#186DCE"/>
          <path d="M17.5 5.2V6.5L18.3 7.2" stroke="#fff" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>

      <h1 class="locked-title" id="hcTitle">Complete your health connection</h1>
      <p class="locked-desc" id="hcDesc">You can grant additional access from the app Menu anytime</p>

      <div class="locked-footer" style="width:100%; display:flex; flex-direction:column; align-items:center; gap:16px;">
        <button type="button" class="login-btn" style="margin-top:0;" onclick="window.location.href='/Mobile%20app/menu.html'">Continue</button>
        <button type="button" class="skip-link" id="hcCancel" hidden onclick="window.location.href='/Mobile%20app/menu.html'">Cancel</button>
      </div>
    </div>
  </div>

<script>
  const STATE = new URLSearchParams(window.location.search).get("state") || "granted";
  const CONTENT = {
    granted: {
      title: "Complete your health connection",
      desc: "You can grant additional access from the app Menu anytime",
      cancel: false,
    },
    revoke: {
      title: "Revoke all permissions",
      desc: "These will revoke all health connect permissions which will stop us from monitoring your health data",
      cancel: true,
    },
    connect: {
      title: "Connect your health data",
      desc: "Allow HearO to access your Health data to improve monitoring.<br><br>Follow these steps:<br><strong>Settings &rsaquo; Apps &rsaquo; Health &rsaquo; Data Access &amp; Devices &rsaquo; HearO</strong>",
      cancel: false,
    },
    missing: {
      title: "Complete your health connection",
      desc: "A few Health permissions are still missing.<br><br>Follow these steps:<br><strong>Settings &rsaquo; Apps &rsaquo; Health &rsaquo; Data Access &amp; Devices &rsaquo; HearO</strong>",
      cancel: false,
    },
  };

  const data = CONTENT[STATE] || CONTENT.granted;
  document.getElementById("hcTitle").textContent = data.title;
  document.getElementById("hcDesc").innerHTML = data.desc;
  document.getElementById("hcCancel").hidden = !data.cancel;
</script>
</body>
</html>
