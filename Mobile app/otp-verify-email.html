<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HearO - Check Your Email</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/Mobile%20app/style.css?v=5">
<script src="/Mobile%20app/font-scale.js?v=5"></script>
</head>
<body>

  <div class="phone-frame">
    <div class="status-bar">
      <span class="status-time">9:27</span>
      <div class="status-icons">
        <svg width="18" height="12" viewBox="0 0 18 12" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="8" width="3" height="4" rx="0.5" fill="black"/><rect x="4.5" y="6" width="3" height="6" rx="0.5" fill="black"/><rect x="9" y="3" width="3" height="9" rx="0.5" fill="black"/><rect x="13.5" y="0" width="3" height="12" rx="0.5" fill="black"/></svg>
        <svg width="16" height="12" viewBox="0 0 16 12" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M8 10.5C8.6 10.5 9.1 10 9.1 9.4C9.1 8.8 8.6 8.3 8 8.3C7.4 8.3 6.9 8.8 6.9 9.4C6.9 10 7.4 10.5 8 10.5Z" fill="black"/><path d="M8 6.5C9 6.5 9.9 6.9 10.6 7.6L11.6 6.6C10.6 5.6 9.4 5 8 5C6.6 5 5.4 5.6 4.4 6.6L5.4 7.6C6.1 6.9 7 6.5 8 6.5Z" fill="black"/><path d="M8 2.5C10.1 2.5 12 3.3 13.5 4.8L14.5 3.8C12.7 2 10.5 1 8 1C5.5 1 3.3 2 1.5 3.8L2.5 4.8C4 3.3 5.9 2.5 8 2.5Z" fill="black"/></svg>
        <svg width="25" height="12" viewBox="0 0 25 12" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="0.5" y="0.5" width="20" height="11" rx="2.5" stroke="black"/><rect x="2" y="2" width="17" height="8" rx="1.5" fill="black"/><rect x="22" y="4" width="2" height="4" rx="1" fill="black"/></svg>
      </div>
    </div>

    <div class="otp-header">
      <button type="button" class="back-btn" onclick="window.location.href='/Mobile%20app/otp-verify.html'" aria-label="Back">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M15 5L8 12L15 19" stroke="#252424" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <div class="logo">
        <img class="logo-img" src="https://web.dev3.cordiomed.com/assets/icons/logo.svg" alt="HearO">
      </div>
    </div>

    <div class="otp-content">
      <h1 class="otp-title">Enter your code</h1>
      <p class="otp-subtitle">We sent a 6-digit code to your email address</p>

      <div class="otp-boxes" id="otpBoxes">
        <input type="text" inputmode="numeric" maxlength="1" class="otp-box" autofocus>
        <input type="text" inputmode="numeric" maxlength="1" class="otp-box">
        <input type="text" inputmode="numeric" maxlength="1" class="otp-box">
        <input type="text" inputmode="numeric" maxlength="1" class="otp-box">
        <input type="text" inputmode="numeric" maxlength="1" class="otp-box">
        <input type="text" inputmode="numeric" maxlength="1" class="otp-box">
      </div>

      <p class="otp-error" id="otpError" hidden>Incorrect code. Please try again.</p>

      <button type="button" class="otp-resend-btn">Resend code</button>

      <div class="otp-footer">
        <button type="button" class="otp-email-btn" onclick="window.location.href='/Mobile%20app/otp-verify.html'">Send code by SMS</button>
        <p class="otp-help">Need help? <a href="/Mobile%20app/contact-us.html" class="otp-help-link">Contact us</a></p>
      </div>
    </div>
  </div>

<script>
  document.addEventListener("DOMContentLoaded", () => {
    const boxes = Array.from(document.querySelectorAll(".otp-box"));
    const errorMsg = document.getElementById("otpError");
    const WRONG_CODE = "000000";

    const MAX_ATTEMPTS = 3;
    let attempts = 0;

    function clearError() {
      errorMsg.hidden = true;
      boxes.forEach((b) => b.classList.remove("error"));
    }

    function goNext() {
      if (localStorage.getItem("hearo_privacy_accepted")) {
        window.location.href = "/Mobile%20app/index.html";
      } else {
        window.location.href = "/Mobile%20app/privacy.html";
      }
    }

    boxes.forEach((box, i) => {
      box.addEventListener("input", () => {
        box.value = box.value.replace(/[^0-9]/g, "");
        clearError();
        if (box.value && i < boxes.length - 1) {
          boxes[i + 1].focus();
        }
        if (boxes.every((b) => b.value)) {
          const code = boxes.map((b) => b.value).join("");
          if (code === WRONG_CODE) {
            attempts += 1;
            if (attempts >= MAX_ATTEMPTS) {
              localStorage.setItem("hearo_lock_until", Date.now() + 30 * 60 * 1000);
              window.location.href = "/Mobile%20app/app-locked.html";
              return;
            }
            errorMsg.hidden = false;
            boxes.forEach((b) => b.classList.add("error"));
          } else {
            goNext();
          }
        }
      });

      box.addEventListener("keydown", (e) => {
        if (e.key === "Backspace" && !box.value && i > 0) {
          boxes[i - 1].focus();
        }
      });
    });
  });
</script>
</body>
</html>
