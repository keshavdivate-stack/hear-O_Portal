<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HearO - Raise an Issue</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="phone-frame">
    <div class="status-bar">
      <span class="status-time">9:27</span>
      <div class="status-icons">
        <svg width="18" height="12" viewBox="0 0 18 12" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="8" width="3" height="4" rx="0.5" fill="black"/><rect x="4.5" y="6" width="3" height="6" rx="0.5" fill="black"/><rect x="9" y="3" width="3" height="9" rx="0.5" fill="black"/><rect x="13.5" y="0" width="3" height="12" rx="0.5" fill="black"/></svg>
        <svg width="16" height="12" viewBox="0 0 16 12" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M8 10.5C8.6 10.5 9.1 10 9.1 9.4C9.1 8.8 8.6 8.3 8 8.3C7.4 8.3 6.9 8.8 6.9 9.4C6.9 10 7.4 10.5 8 10.5Z" fill="black"/><path d="M8 6.5C9 6.5 9.9 6.9 10.6 7.6L11.6 6.6C10.6 5.6 9.4 5 8 5C6.6 5 5.4 5.6 4.4 6.6L5.4 7.6C6.1 6.9 7 6.5 8 6.5Z" fill="black"/><path d="M8 2.5C10.1 2.5 12 3.3 13.5 4.8L14.5 3.8C12.7 2 10.5 1 8 1C5.5 1 3.3 2 1.5 3.8L2.5 4.8C4 3.3 5.9 2.5 8 2.5Z" fill="black"/></svg>
        <svg width="25" height="12" viewBox="0 0 25 12" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="0.5" y="0.5" width="20" height="11" rx="2.5" stroke="black"/><rect x="2" y="2" width="17" height="8" rx="1.5" fill="black"/><rect x="22" y="4" width="2" height="4" rx="1" fill="black"/></svg>
      </div>
    </div>

    <div class="bp-header">
      <button type="button" class="back-btn" onclick="window.location.href='contact-us.html'">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M12.5 4L6.5 10L12.5 16" stroke="#2b2b2b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <h1>Raise an Issue</h1>
    </div>

    <div class="issue-body">
      <p class="issue-label">What's the problem?</p>

      <button type="button" class="issue-option" data-value="App not working">
        <span class="radio-circle"></span>
        <span>App is not working</span>
      </button>
      <button type="button" class="issue-option" data-value="Recording problem">
        <span class="radio-circle"></span>
        <span>Trouble recording or uploading</span>
      </button>
      <button type="button" class="issue-option" data-value="Login or account issue">
        <span class="radio-circle"></span>
        <span>Login or account issue</span>
      </button>
      <button type="button" class="issue-option" data-value="Device problem">
        <span class="radio-circle"></span>
        <span>Device problem</span>
      </button>
      <button type="button" class="issue-option" data-value="Something else">
        <span class="radio-circle"></span>
        <span>Something else</span>
      </button>

      <p class="issue-details-label">Add details (optional)</p>
      <textarea class="issue-textarea" id="issueDetails" placeholder="Tell us a bit more..."></textarea>

      <div class="issue-submit-wrap">
        <button type="button" class="bp-save-btn" id="submitBtn" onclick="handleSubmit()">Submit Issue</button>
      </div>
    </div>

    <div class="modal-overlay" id="submittedModal" style="display:none">
      <div class="modal-card">
        <div class="check-circle" style="margin:0 auto 18px;">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M4 12.5L9.5 18L20 6" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <p class="modal-text">Your issue has been submitted. Our support team will get back to you soon.</p>
        <button type="button" class="login-btn" id="modalOkBtn">OK</button>
      </div>
    </div>
  </div>

<script>
  let selectedIssue = null;
  const options = document.querySelectorAll(".issue-option");
  const submitBtn = document.getElementById("submitBtn");

  options.forEach((opt) => {
    opt.addEventListener("click", () => {
      options.forEach((o) => o.classList.remove("selected"));
      opt.classList.add("selected");
      selectedIssue = opt.dataset.value;
      submitBtn.classList.toggle("enabled", !!selectedIssue);
    });
  });

  function handleSubmit() {
    if (!selectedIssue) return;
    document.getElementById("submittedModal").style.display = "flex";
  }

  document.getElementById("modalOkBtn").addEventListener("click", () => {
    window.location.href = "contact-us.html";
  });
</script>
</body>
</html>
