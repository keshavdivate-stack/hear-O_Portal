<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HearO - Raise an Issue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/Mobile%20app/style.css?v=34">
<script src="/Mobile%20app/font-scale.js?v=29"></script>
</head>
<body>

  <div class="phone-frame">
    <div class="status-bar">
      <span class="status-time">9:27</span>
      <div class="status-icons">
        <svg width="18" height="12" viewBox="0 0 18 12" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="8" width="3" height="4" rx="0.5" fill="black"/><rect x="4.5" y="6" width="3" height="6" rx="0.5" fill="black"/><rect x="9" y="3" width="3" height="9" rx="0.5" fill="black"/><rect x="13.5" y="0" width="3" height="12" rx="0.5" fill="black"/></svg>
        <svg width="16" height="12" viewBox="0 0 16 12" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M8 10.5C8.6 10.5 9.1 10 9.1 9.4C9.1 8.8 8.6 8.3 8 8.3C7.4 8.3 6.9 8.8 6.9 9.4C6.9 10 7.4 10.5 8 10.5Z" fill="black"/><path d="M8 6.5C9 6.5 9.9 6.9 10.6 7.6L11.6 6.6C10.6 5.6 9.4 5 8 5C6.6 5 5.4 5.6 4.4 6.6L5.4 7.6C6.1 6.9 7 6.5 8 6.5Z" fill="black"/><path d="M8 2.5C10.1 2.5 12 3.3 13.5 4.8L14.5 3.8C12.7 2 10.5 1 8 1C5.5 1 3.3 2 1.5 3.8L2.5 4.8C4 3.3 5.9 2.5 8 2.5Z" fill="black"/></svg>
        <svg width="25" height="12" viewBox="0 0 25 12" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="0.5" y="0.5" width="20" height="11" rx="2.5" stroke="black"/><rect x="2" y="2" width="17" height="8" rx="1.5" fill="black"/><rect x="22" y="4" width="2" height="4" rx="1" fill="black"/></svg>
      </div>
    </div>

    <div class="bp-header ri-header" id="issueHeader">
      <button type="button" class="back-btn" id="issueBackBtn">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M12.5 4L6.5 10L12.5 16" stroke="#252424" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <h1>Select an issue</h1>
    </div>

    <!-- One screen: pick the area, describe it, submit -->
    <div class="issue-body" id="issueStep">
      <p class="issue-label">Where did the problem happen?</p>
      <div id="areaList">
        <button type="button" class="issue-option" data-area="Recordings"><span class="radio-circle"></span><span>Recordings</span></button>
        <button type="button" class="issue-option" data-area="Measurements"><span class="radio-circle"></span><span>Measurements</span></button>
        <button type="button" class="issue-option" data-area="Medications"><span class="radio-circle"></span><span>Medications</span></button>
        <button type="button" class="issue-option" data-area="Chat"><span class="radio-circle"></span><span>Chat</span></button>
        <button type="button" class="issue-option" data-area="Something else"><span class="radio-circle"></span><span>Something else</span></button>
      </div>
      <p class="issue-details-label">Tell us briefly what happened</p>
      <textarea class="issue-textarea" id="issueDetails" placeholder="Tell us a bit more..."></textarea>
      <div class="issue-submit-wrap">
        <button type="button" class="login-btn" id="submitBtn" disabled>Submit Issue</button>
      </div>
    </div>

    <!-- RESULT: sent -->
    <div class="ri-result" id="successStep" hidden>
      <div class="ri-result-icon ri-result-icon--ok">
        <svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="#1f9d7a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.5l5 5 10-11"/></svg>
      </div>
      <h2 class="ri-result-title">Issue Sent<br>Successfully</h2>
      <p class="ri-result-text">Your issue has been successfully submitted to the clinic.</p>
      <div class="ri-result-footer"><button type="button" class="login-btn" id="continueBtn">Continue</button></div>
    </div>

    <!-- RESULT: not sent -->
    <div class="ri-result" id="errorStep" hidden>
      <div class="ri-result-icon ri-result-icon--warn">
        <svg width="34" height="60" viewBox="0 0 20 36" fill="#EA580C"><path d="M2.5 2.5C2.5 1.4 3.4.5 4.5.5h11c1.1 0 2 .9 2 2 0 .4-.1.8-.2 1.100L11.800 22.500c-.3.9-1.100 1.500-2 1.500s-1.700-.6-2-1.500L2.700 3.600C2.600 3.300 2.500 2.900 2.500 2.500z"/><circle cx="10" cy="31.300" r="3.400"/></svg>
      </div>
      <h2 class="ri-result-title">Issue Not Sent</h2>
      <p class="ri-result-text">Something went wrong while sending your issue. Please try again.</p>
      <div class="ri-result-footer"><button type="button" class="login-btn" id="tryAgainBtn">Try Again</button></div>
    </div>
  </div>

<script>
  const $ = (id) => document.getElementById(id);
  const steps = ["issueStep", "successStep", "errorStep"];
  let selectedArea = "";

  // Result screens are full screens (no header), like the Figma.
  function show(step) {
    steps.forEach((s) => { $(s).hidden = s !== step; });
    $("issueHeader").hidden = step === "successStep" || step === "errorStep";
  }

  // Submit waits for both an area and a short description.
  function updateSubmit() {
    $("submitBtn").disabled = !selectedArea || !$("issueDetails").value.trim();
  }

  const areaButtons = document.querySelectorAll("#areaList .issue-option");
  areaButtons.forEach((btn) => {
    btn.addEventListener("click", () => {
      selectedArea = btn.dataset.area;
      areaButtons.forEach((b) => b.classList.toggle("selected", b === btn));
      updateSubmit();
    });
  });
  $("issueDetails").addEventListener("input", updateSubmit);

  $("issueBackBtn").addEventListener("click", () => { window.location.href = "/Mobile%20app/my-issues.html"; });

  // Saved to the same list Raised Issues reads from.
  function saveIssue() {
    const KEY = "hearo_raised_issues";
    let issues = [];
    try { issues = JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) {}
    issues.unshift({
      area: selectedArea,
      detail: $("issueDetails").value.trim(),
      date: new Date().toLocaleString("en-US", { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }),
    });
    localStorage.setItem(KEY, JSON.stringify(issues));
  }

  // Sending can only fail when the phone is offline; that shows Issue Not Sent.
  $("submitBtn").addEventListener("click", () => {
    if (navigator.onLine === false) { show("errorStep"); return; }
    saveIssue();
    show("successStep");
  });
  $("tryAgainBtn").addEventListener("click", () => show("issueStep"));
  $("continueBtn").addEventListener("click", () => { window.location.href = "/Mobile%20app/raised-issues.html"; });
</script>
</body>
</html>
