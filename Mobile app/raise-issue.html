<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HearO - Raise an Issue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="phone-frame">
    <div class="status-bar">
      <span class="status-time">9:27</span>
      <div class="status-icons">
        <svg width="18" height="12" viewBox="0 0 18 12" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="8" width="3" height="4" rx="0.5" fill="black"/><rect x="4.5" y="6" width="3" height="6" rx="0.5" fill="black"/><rect x="9" y="3" width="3" height="9" rx="0.5" fill="black"/><rect x="13.5" y="0" width="3" height="12" rx="0.5" fill="black"/></svg>
        <svg width="16" height="12" viewBox="0 0 16 12" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M8 10.5C8.6 10.5 9.1 10 9.1 9.4C9.1 8.8 8.6 8.3 8 8.3C7.4 8.3 6.9 8.8 6.9 9.4C6.9 10 7.4 10.5 8 10.5Z" fill="black"/><path d="M8 6.5C9 6.5 9.9 6.9 10.6 7.6L11.6 6.6C10.6 5.6 9.4 5 8 5C6.6 5 5.4 5.6 4.4 6.6L5.4 7.6C6.1 6.9 7 6.5 8 6.5Z" fill="black"/><path d="M8 2.5C10.1 2.5 12 3.3 13.5 4.8L14.5 3.8C12.7 2 10.5 1 8 1C5.5 1 3.3 2 1.5 3.8L2.5 4.8C4 3.3 5.9 2.5 8 2.5Z" fill="black"/></svg>
        <svg width="25" height="12" viewBox="0 0 25 12" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="0.5" y="0.5" width="20" height="11" rx="2.5" stroke="black"/><rect x="2" y="2" width="17" height="8" rx="1.5" fill="black"/><rect x="22" y="4" width="2" height="4" rx="1" fill="black"/></svg>
      </div>
    </div>

    <div class="bp-header">
      <button type="button" class="back-btn" id="issueBackBtn">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M12.5 4L6.5 10L12.5 16" stroke="#2b2b2b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <h1 id="issueHeaderTitle">Select a Category</h1>
    </div>

    <!-- STEP 1: Category selection -->
    <div class="issue-body" id="categoryStep">
      <div id="categoryList"></div>
    </div>

    <!-- STEP 2: Specific issue selection + details -->
    <div class="issue-body" id="issueStep" style="display:none">
      <p class="issue-label">What seems to be the problem?</p>
      <div id="issueList"></div>

      <div id="detailsSection" style="display:none">
        <p class="issue-details-label">Add details (optional)</p>
        <textarea class="issue-textarea" id="issueDetails" placeholder="Tell us a bit more..."></textarea>

        <div class="issue-submit-wrap">
          <button type="button" class="bp-save-btn" id="submitBtn" onclick="handleSubmit()">Submit Issue</button>
        </div>
      </div>
    </div>

    <div class="modal-overlay" id="submittedModal" style="display:none">
      <div class="modal-card">
        <div class="check-circle" style="margin:0 auto 18px;">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M4 12.5L9.5 18L20 6" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <p class="modal-text">Your issue has been submitted. Our support team will get back to you soon.</p>
        <button type="button" class="login-btn" id="modalOkBtn">OK</button>
      </div>
    </div>
  </div>

<script>
  // Category -> the 4 category-specific issues. "Something else" is appended to every category.
  const ISSUE_CATEGORIES = [
    {
      id: "app-not-working",
      label: "App is not working",
      issues: [
        "App is not opening",
        "App is not working as expected",
        "App is not loading properly",
        "App configuration seems incorrect"
      ]
    },
    {
      id: "recording-uploading",
      label: "Recording or uploading",
      issues: [
        "Trouble recording",
        "Recording stopped unexpectedly",
        "Recording was not uploaded",
        "Recording/upload is not working"
      ]
    },
    {
      id: "recording-results",
      label: "Recording results",
      issues: [
        "Recording results are missing",
        "Recording results are incomplete",
        "Breath results are missing",
        "Recording analysis is not showing"
      ]
    },
    {
      id: "sensors-measurements",
      label: "Sensors or measurements",
      issues: [
        "Sensors are not uploading",
        "Measurements are missing",
        "I can't enter my measurements",
        "Sensor/measurement data is not updating"
      ]
    },
    {
      id: "medication",
      label: "Medication",
      issues: [
        "I can't enter my medication",
        "My medication entry is missing",
        "My medication information is incorrect",
        "Medication tracking is not working"
      ]
    },
    {
      id: "clinical-questions",
      label: "Clinical questions",
      issues: [
        "I can't answer the clinical questions",
        "Clinical questions are not showing",
        "My answers are not being saved",
        "Clinical questions are not working correctly"
      ]
    },
    {
      id: "language",
      label: "Language",
      issues: [
        "I can't change the language",
        "The wrong language is showing",
        "Some content is in the wrong language",
        "Language is not working correctly"
      ]
    },
    {
      id: "progress-stuck",
      label: "My progress is stuck",
      issues: [
        "I'm stuck in the current step",
        "My progress is not updating",
        "My status is not changing",
        "I can't move to the next step"
      ]
    }
  ];
  const SOMETHING_ELSE = "Something else";

  const categoryStep = document.getElementById("categoryStep");
  const issueStep = document.getElementById("issueStep");
  const categoryListEl = document.getElementById("categoryList");
  const issueListEl = document.getElementById("issueList");
  const detailsSection = document.getElementById("detailsSection");
  const issueBackBtn = document.getElementById("issueBackBtn");
  const submitBtn = document.getElementById("submitBtn");
  const issueHeaderTitle = document.getElementById("issueHeaderTitle");

  let selectedCategory = null;
  let selectedIssue = null;

  // Step 1 rows navigate to a sub-list rather than finalize a value, so they
  // use a chevron (like a settings/menu row) instead of a radio circle.
  function makeCategoryRow(cat) {
    const row = document.createElement("button");
    row.type = "button";
    row.className = "issue-category-row";
    row.dataset.value = cat.id;
    row.innerHTML =
      '<span class="issue-category-row-label"></span>' +
      '<svg class="issue-category-row-chevron" width="9" height="15" viewBox="0 0 9 15" fill="none"><path d="M1.5 1.5L7.5 7.5L1.5 13.5" stroke="#9aa0a8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    row.querySelector(".issue-category-row-label").textContent = cat.label;
    return row;
  }

  // Step 2 rows finalize a single value, so they keep the original
  // bordered-card radio-button interaction.
  function makeIssueOption(label) {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "issue-option";
    btn.dataset.value = label;
    btn.innerHTML = '<span class="radio-circle"></span><span></span>';
    btn.querySelector("span:last-child").textContent = label;
    return btn;
  }

  function renderCategories() {
    categoryListEl.innerHTML = "";
    ISSUE_CATEGORIES.forEach((cat) => {
      const row = makeCategoryRow(cat);
      row.addEventListener("click", () => selectCategory(cat));
      categoryListEl.appendChild(row);
    });
  }

  function selectCategory(cat) {
    selectedCategory = cat;
    selectedIssue = null;
    renderIssues(cat);
    categoryStep.style.display = "none";
    issueStep.style.display = "block";
    detailsSection.style.display = "none";
    submitBtn.classList.remove("enabled");
    issueHeaderTitle.textContent = "Select an Issue";
  }

  function renderIssues(cat) {
    issueListEl.innerHTML = "";
    const options = [...cat.issues, SOMETHING_ELSE];
    options.forEach((label) => {
      const opt = makeIssueOption(label);
      opt.addEventListener("click", () => selectIssue(opt, label));
      issueListEl.appendChild(opt);
    });
  }

  function selectIssue(optEl, label) {
    issueListEl.querySelectorAll(".issue-option").forEach((o) => o.classList.remove("selected"));
    optEl.classList.add("selected");
    selectedIssue = label;
    detailsSection.style.display = "block";
    submitBtn.classList.add("enabled");
  }

  issueBackBtn.addEventListener("click", () => {
    if (issueStep.style.display !== "none") {
      // Back from Step 2 -> Step 1
      issueStep.style.display = "none";
      categoryStep.style.display = "block";
      selectedCategory = null;
      selectedIssue = null;
      issueHeaderTitle.textContent = "Select a Category";
    } else {
      window.location.href = "contact-us.html";
    }
  });

  function handleSubmit() {
    if (!selectedIssue) return;
    document.getElementById("submittedModal").style.display = "flex";
  }

  document.getElementById("modalOkBtn").addEventListener("click", () => {
    window.location.href = "contact-us.html";
  });

  renderCategories();
</script>
</body>
</html>
