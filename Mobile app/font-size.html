<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HearO - Font Size</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="font-scale.js"></script>
</head>
<body>

  <div class="phone-frame">
    <div class="status-bar">
      <span class="status-time">9:27</span>
      <div class="status-icons">
        <svg width="18" height="12" viewBox="0 0 18 12" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="8" width="3" height="4" rx="0.5" fill="black"/><rect x="4.5" y="6" width="3" height="6" rx="0.5" fill="black"/><rect x="9" y="3" width="3" height="9" rx="0.5" fill="black"/><rect x="13.5" y="0" width="3" height="12" rx="0.5" fill="black"/></svg>
        <svg width="16" height="12" viewBox="0 0 16 12" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M8 10.5C8.6 10.5 9.1 10 9.1 9.4C9.1 8.8 8.6 8.3 8 8.3C7.4 8.3 6.9 8.8 6.9 9.4C6.9 10 7.4 10.5 8 10.5Z" fill="black"/><path d="M8 6.5C9 6.5 9.9 6.9 10.6 7.6L11.6 6.6C10.6 5.6 9.4 5 8 5C6.6 5 5.4 5.6 4.4 6.6L5.4 7.6C6.1 6.9 7 6.5 8 6.5Z" fill="black"/><path d="M8 2.5C10.1 2.5 12 3.3 13.5 4.8L14.5 3.8C12.7 2 10.5 1 8 1C5.5 1 3.3 2 1.5 3.8L2.5 4.8C4 3.3 5.9 2.5 8 2.5Z" fill="black"/></svg>
        <svg width="25" height="12" viewBox="0 0 25 12" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="0.5" y="0.5" width="20" height="11" rx="2.5" stroke="black"/><rect x="2" y="2" width="17" height="8" rx="1.5" fill="black"/><rect x="22" y="4" width="2" height="4" rx="1" fill="black"/></svg>
      </div>
    </div>

    <div class="bp-header">
      <button type="button" class="back-btn" onclick="window.location.href='menu.html'">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M12.5 4L6.5 10L12.5 16" stroke="#2b2b2b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <h1>Font Size</h1>
    </div>

    <div class="fontsize-body">
      <p class="fontsize-intro">Choose a text size that's comfortable to read. This applies across the whole app.</p>

      <div class="fontsize-preview">
        <p class="fontsize-preview-text" id="previewText">Cook the food</p>
      </div>

      <div class="fontsize-options" id="options"></div>
    </div>
  </div>

<script>
  const SIZES = [
    { value: "0.9", label: "Small", sample: 14 },
    { value: "1", label: "Medium", sample: 16 },
    { value: "1.15", label: "Large", sample: 18 },
    { value: "1.3", label: "Extra Large", sample: 20 },
  ];

  const optionsEl = document.getElementById("options");
  const previewEl = document.getElementById("previewText");

  function currentScale() {
    return localStorage.getItem("hearo_font_scale") || "1";
  }

  function render() {
    const active = currentScale();
    optionsEl.innerHTML = SIZES.map(
      (s) => `
        <button type="button" class="fontsize-option${s.value === active ? " selected" : ""}" onclick="selectSize('${s.value}')">
          <span class="fontsize-option-label">${s.label}</span>
          <span class="fontsize-option-sample" style="font-size:${s.sample}px;">Aa</span>
          <span class="fontsize-option-check">
            ${s.value === active ? '<svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M4 12.5L9.5 18L20 6" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>' : ""}
          </span>
        </button>`
    ).join("");
  }

  function selectSize(value) {
    localStorage.setItem("hearo_font_scale", value);
    document.documentElement.style.setProperty("--font-scale", value);
    render();
  }

  render();
</script>
</body>
</html>
