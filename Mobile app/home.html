<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HearO - Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="phone-frame">
    <div class="status-bar">
      <span class="status-time">9:27</span>
      <div class="status-icons">
        <svg width="18" height="12" viewBox="0 0 18 12" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="8" width="3" height="4" rx="0.5" fill="black"/><rect x="4.5" y="6" width="3" height="6" rx="0.5" fill="black"/><rect x="9" y="3" width="3" height="9" rx="0.5" fill="black"/><rect x="13.5" y="0" width="3" height="12" rx="0.5" fill="black"/></svg>
        <svg width="16" height="12" viewBox="0 0 16 12" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M8 10.5C8.6 10.5 9.1 10 9.1 9.4C9.1 8.8 8.6 8.3 8 8.3C7.4 8.3 6.9 8.8 6.9 9.4C6.9 10 7.4 10.5 8 10.5Z" fill="black"/><path d="M8 6.5C9 6.5 9.9 6.9 10.6 7.6L11.6 6.6C10.6 5.6 9.4 5 8 5C6.6 5 5.4 5.6 4.4 6.6L5.4 7.6C6.1 6.9 7 6.5 8 6.5Z" fill="black"/><path d="M8 2.5C10.1 2.5 12 3.3 13.5 4.8L14.5 3.8C12.7 2 10.5 1 8 1C5.5 1 3.3 2 1.5 3.8L2.5 4.8C4 3.3 5.9 2.5 8 2.5Z" fill="black"/></svg>
        <svg width="25" height="12" viewBox="0 0 25 12" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="0.5" y="0.5" width="20" height="11" rx="2.5" stroke="black"/><rect x="2" y="2" width="17" height="8" rx="1.5" fill="black"/><rect x="22" y="4" width="2" height="4" rx="1" fill="black"/></svg>
      </div>
    </div>

    <div class="home-header">
      <div class="logo" style="margin-bottom:0;font-size:26px;">
        <img class="logo-img" src="https://web.dev3.cordiomed.com/assets/icons/logo.svg" alt="HearO">
      </div>
      <button type="button" class="menu-btn" onclick="window.location.href='menu.html'">
        <svg width="26" height="20" viewBox="0 0 26 20" fill="none" xmlns="http://www.w3.org/2000/svg">
          <line x1="0" y1="2" x2="26" y2="2" stroke="#2f6fed" stroke-width="2.4" stroke-linecap="round"/>
          <line x1="0" y1="10" x2="26" y2="10" stroke="#2f6fed" stroke-width="2.4" stroke-linecap="round"/>
          <line x1="0" y1="18" x2="26" y2="18" stroke="#2f6fed" stroke-width="2.4" stroke-linecap="round"/>
        </svg>
      </button>
    </div>

    <div class="home-body">
      <h1 class="home-greeting">Good Morning</h1>

      <div class="session-card" id="sessionCard">
        <div class="session-mic-icon">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="9" y="2" width="6" height="12" rx="3" stroke="#2f6fed" stroke-width="1.8"/>
            <path d="M5 11a7 7 0 0 0 14 0" stroke="#2f6fed" stroke-width="1.8" stroke-linecap="round"/>
            <line x1="12" y1="18" x2="12" y2="22" stroke="#2f6fed" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </div>
        <p class="session-text">Please record in a quiet place</p>
        <button type="button" class="login-btn" onclick="window.location.href='record-prompt.html?mode=daily'">Start session</button>
      </div>
      <p class="session-last" id="lastRecording">Last recording: Yesterday, 8:48 AM</p>

      <div class="nav-item-card" style="margin-top:22px;cursor:pointer;" onclick="window.location.href='measurements.html'">
        <div class="nav-item-left">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M20 8.5C20 13 12 19 12 19C12 19 4 13 4 8.5C4 5.5 6.5 3.5 9 3.5C10.5 3.5 11.5 4.2 12 5C12.5 4.2 13.5 3.5 15 3.5C17.5 3.5 20 5.5 20 8.5Z" stroke="#2f6fed" stroke-width="1.6"/><path d="M6 10H9L10.5 7L13 13L14.5 10H18" stroke="#2f6fed" stroke-width="1.4" stroke-linejoin="round"/></svg>
          My Measurements
        </div>
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M6 3L11 8L6 13" stroke="#9a9fa8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div class="nav-item-card" style="cursor:pointer;" onclick="window.location.href='recordings.html'">
        <div class="nav-item-left">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><rect x="3.5" y="4.5" width="17" height="16" rx="2" stroke="#c99a4a" stroke-width="1.6"/><line x1="3.5" y1="9" x2="20.5" y2="9" stroke="#c99a4a" stroke-width="1.6"/><line x1="7" y1="2.5" x2="7" y2="6.5" stroke="#c99a4a" stroke-width="1.6" stroke-linecap="round"/><line x1="17" y1="2.5" x2="17" y2="6.5" stroke="#c99a4a" stroke-width="1.6" stroke-linecap="round"/></svg>
          My Recordings
        </div>
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M6 3L11 8L6 13" stroke="#9a9fa8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div class="nav-item-card" style="cursor:pointer;" onclick="window.location.href='medication.html'">
        <div class="nav-item-left">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><rect x="2.5" y="9.5" width="19" height="7" rx="3.5" transform="rotate(-45 2.5 9.5)" stroke="#2f9e73" stroke-width="1.6"/><path d="M8.5 13.5L11.5 10.5" stroke="#2f9e73" stroke-width="1.6" stroke-linecap="round"/><line x1="7" y1="17" x2="17" y2="7" stroke="#2f9e73" stroke-width="1.6"/></svg>
          My Medication
        </div>
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M6 3L11 8L6 13" stroke="#9a9fa8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
    </div>

    <div class="home-footer">
      <button type="button" class="chat-nav-item" onclick="window.location.href='chat.html'">
        <span class="chat-badge">1</span>
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 5.5C4 4.4 4.9 3.5 6 3.5H18C19.1 3.5 20 4.4 20 5.5V14C20 15.1 19.1 16 18 16H9L5 19.5V16H6C4.9 16 4 15.1 4 14V5.5Z" stroke="#2f6fed" stroke-width="1.8" stroke-linejoin="round"/>
        </svg>
        <span>Chat</span>
      </button>
    </div>
  </div>

<script>
  const recorded = new URLSearchParams(window.location.search).get("recorded");
  if (recorded === "1") {
    const now = new Date();
    let hours = now.getHours();
    const minutes = String(now.getMinutes()).padStart(2, "0");
    const ampm = hours >= 12 ? "PM" : "AM";
    hours = hours % 12 || 12;
    const timeStr = `${hours}:${minutes} ${ampm}`;

    document.getElementById("sessionCard").innerHTML = `
      <div class="session-check-icon">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 12.5L9.5 18L20 6" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <p class="session-title-complete">Recording complete</p>
      <p class="session-time-complete">Completed at ${timeStr}</p>
    `;
    document.getElementById("sessionCard").classList.add("complete");
    document.getElementById("sessionCard").insertAdjacentHTML(
      "afterend",
      `<button type="button" class="record-again-btn" onclick="window.location.href='record-prompt.html?mode=daily'">Record again</button>`
    );
    document.getElementById("lastRecording").textContent = `Last recording: Today, ${timeStr}`;
  }
</script>
</body>
</html>
