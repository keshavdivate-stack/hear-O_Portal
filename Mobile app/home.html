<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HearO - Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  /* Home-screen tour: runs on this screen after the patient's first recorded
     session -- each step highlights one real card/button and explains it in
     the same tooltip used across the app. */
  .tour-blocker { position: absolute; inset: 0; z-index: 45; }
  .tour-target { position: relative; z-index: 46; pointer-events: none; border-radius: 16px; box-shadow: 0 0 0 3px #186DCE, 0 10px 24px rgba(0, 0, 0, 0.18); }
  .chat-nav-item.tour-target { box-shadow: none; outline: 3px solid #186DCE; outline-offset: 6px; border-radius: 14px; }
  .tooltip-popover.tour-tip { z-index: 50; }
  .tooltip-popover.tour-tip::after { left: var(--tour-arrow-x, 40px); }
  .tooltip-popover.tour-tip.arrow-up::after { top: -10px; bottom: auto; }
  .tour-tip .tour-skip { display: block; width: 100%; margin-top: 8px; padding: 6px 0; font-size: calc(18px * var(--font-scale, 1)); }
</style>
</head>
<body>

  <div class="phone-frame">

        <svg width="16" height="12" viewBox="0 0 16 12" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M8 10.5C8.6 10.5 9.1 10 9.1 9.4C9.1 8.8 8.6 8.3 8 8.3C7.4 8.3 6.9 8.8 6.9 9.4C6.9 10 7.4 10.5 8 10.5Z" fill="black"/><path d="M8 6.5C9 6.5 9.9 6.9 10.6 7.6L11.6 6.6C10.6 5.6 9.4 5 8 5C6.6 5 5.4 5.6 4.4 6.6L5.4 7.6C6.1 6.9 7 6.5 8 6.5Z" fill="black"/><path d="M8 2.5C10.1 2.5 12 3.3 13.5 4.8L14.5 3.8C12.7 2 10.5 1 8 1C5.5 1 3.3 2 1.5 3.8L2.5 4.8C4 3.3 5.9 2.5 8 2.5Z" fill="black"/></svg>
        <svg width="25" height="12" viewBox="0 0 25 12" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="0.5" y="0.5" width="20" height="11" rx="2.5" stroke="black"/><rect x="2" y="2" width="17" height="8" rx="1.5" fill="black"/><rect x="22" y="4" width="2" height="4" rx="1" fill="black"/></svg>

    <div class="home-header">

      <button type="button" class="menu-btn" onclick="window.location.href='/Mobile%20app/menu.html'">
        <svg width="40" height="40" viewBox="0 0 26 20" fill="none" xmlns="http://www.w3.org/2000/svg">

    <div class="home-body">

        </div>

            My Measurements
          </div>
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M6 3L11 8L6 13" stroke="#A9A8A8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div class="nav-item-card nav-item-card--rose" style="cursor:pointer;" onclick="window.location.href='/Mobile%20app/recordings.html'">
          <div class="nav-item-left">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><rect x="3.5" y="4.5" width="17" height="16" rx="2" stroke="#EA580C" stroke-width="1.6"/><line x1="3.5" y1="9" x2="20.5" y2="9" stroke="#EA580C" stroke-width="1.6"/><line x1="7" y1="2.5" x2="7" y2="6.5" stroke="#EA580C" stroke-width="1.6" stroke-linecap="round"/><line x1="17" y1="2.5" x2="17" y2="6.5" stroke="#EA580C" stroke-width="1.6" stroke-linecap="round"/></svg>
            My Recordings
          </div>
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M6 3L11 8L6 13" stroke="#A9A8A8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>

    <div class="home-footer">
      <button type="button" class="chat-nav-item" onclick="window.location.href='/Mobile%20app/chat-consent.html'">
        <span class="chat-nav-icon">
          <span class="chat-badge">1</span>
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M4 5.5C4 4.4 4.9 3.5 6 3.5H18C19.1 3.5 20 4.4 20 5.5V14C20 15.1 19.1 16 18 16H9L5 19.5V16H6C4.9 16 4 15.1 4 14V5.5Z" stroke="#186DCE" stroke-width="1.8" stroke-linejoin="round"/>
          </svg>
        </span>
        <span>Chat</span>
      </button>
    </div>
  </div>

<script>
  // The "recording complete" state has to survive navigating away and back
  // (Medications, Chat, the nav cards, etc.), so it is not just driven by the
  // one-time ?recorded=1 redirect from record-saved.html -- it is saved for
  // this visit (sessionStorage), keyed to today's date. A new visit always
  // starts on "Start session", whichever page it arrives from.
  localStorage.removeItem("hearo_recorded_date"); // older builds kept it across visits
  localStorage.removeItem("hearo_recorded_time");
  function todayKey() {
    return new Date().toDateString();
  }

  function showRecordingComplete(timeStr) {
    document.getElementById("sessionCardBody").innerHTML = `
      <div class="session-check-icon">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 12.5L9.5 18L20 6" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <p class="session-title-complete">Recording complete</p>
      <p class="session-time-complete">Completed at ${timeStr}</p>
    `;
    document.getElementById("sessionCard").classList.add("complete");
    document.getElementById("lastRecording").hidden = true;
    if (!document.querySelector(".record-again-btn")) {
      document.getElementById("sessionCard").insertAdjacentHTML(
        "afterend",
        `<button type="button" class="record-again-btn" onclick="window.location.href='/Mobile%20app/record-prompt.html?mode=daily'">Record again</button>`
      );
    }
    document.getElementById("homeNavCards").hidden = false;
  }

  const recorded = new URLSearchParams(window.location.search).get("recorded");
  if (recorded === "1") {
    const now = new Date();
    let hours = now.getHours();
    const minutes = String(now.getMinutes()).padStart(2, "0");
    const ampm = hours >= 12 ? "PM" : "AM";
    hours = hours % 12 || 12;
    const timeStr = `${hours}:${minutes} ${ampm}`;

    sessionStorage.setItem("hearo_recorded_date", todayKey());
    sessionStorage.setItem("hearo_recorded_time", timeStr);
    showRecordingComplete(timeStr);

    // Drop ?recorded=1 from the URL so a plain refresh of this page re-reads
    // the saved state above instead of re-running this one-time branch.
    window.history.replaceState({}, "", "/Mobile%20app/home.html");
  } else if (sessionStorage.getItem("hearo_recorded_date") === todayKey()) {
    showRecordingComplete(sessionStorage.getItem("hearo_recorded_time"));
  }
</script>
<script>sessionStorage.removeItem("hearo_auth_next");</script>
<script>
  // ---- Home-screen tour, once, after the patient's first recorded session ----
  (function () {
    const recordedToday = document.getElementById("sessionCard").classList.contains("complete");
    if (!recordedToday || localStorage.getItem("hearo_home_tutorial_done")) return;

    const frame = document.querySelector(".phone-frame");
    const body = document.querySelector(".home-body");
    const navCards = [...document.querySelectorAll("#homeNavCards .nav-item-card")];
    const chatBtn = document.querySelector(".home-footer .chat-nav-item");
    const STEPS = [
      { target: navCards[0], title: "My medications", text: "See your medications and mark each dose as taken", icon: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#186DCE" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 3.5 3.5 10.5a4.95 4.95 0 0 0 7 7l7-7a4.95 4.95 0 0 0-7-7z"/><path d="M7 7l7 7"/></svg>` },
      { target: navCards[1], title: "My measurements", text: "Add measurements and track your health trends", icon: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#186DCE" stroke-width="1.8" stroke-linejoin="round"><path d="M12 21s-7-4.5-9.3-9.2C1.2 8.8 2.6 5.5 5.6 4.6c2-.6 4 .2 5.1 1.9C11.9 4.8 13.9 4 15.9 4.6c3 .9 4.4 4.2 2.9 7.2C16.4 16.5 12 21 12 21z"/></svg>` },
      { target: navCards[2], title: "My recordings", text: "View your daily recordings", icon: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#186DCE" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="4.5" width="18" height="16" rx="2"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg>` },
      { target: chatBtn, title: "Chat", text: "Connect with your clinic", icon: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#186DCE" stroke-width="1.8" stroke-linejoin="round"><path d="M4 5.5C4 4.4 4.9 3.5 6 3.5H18C19.1 3.5 20 4.4 20 5.5V14C20 15.1 19.1 16 18 16H9L5 19.5V16H6C4.9 16 4 15.1 4 14V5.5Z"/></svg>` },
    ];
    // Everything except the current step's target is dimmed.
    const dimmable = [document.querySelector(".home-header"), document.querySelector(".home-greeting"), document.getElementById("sessionCard"), document.querySelector(".record-again-btn"), ...navCards, chatBtn].filter(Boolean);

    const blocker = document.createElement("div");
    blocker.className = "tour-blocker";
    const tip = document.createElement("div");
    tip.className = "tooltip-popover tour-tip";
    frame.append(blocker, tip);

    // The phone mockup may be scaled to fit the window: on-screen distances
    // are divided by that scale to get positions inside the frame.
    const scale = () => frame.getBoundingClientRect().width / frame.offsetWidth || 1;
    const inFrame = (el) => {
      const f = frame.getBoundingClientRect(), r = el.getBoundingClientRect(), s = scale();
      return { top: (r.top - f.top) / s, bottom: (r.bottom - f.top) / s, centerX: (r.left + r.width / 2 - f.left) / s };
    };

    let step = 0;
    function show() {
      const { target, title, text, icon } = STEPS[step];
      dimmable.forEach((el) => el.classList.toggle("tour-dim", el !== target));
      dimmable.forEach((el) => el.classList.toggle("tour-target", el === target));
      // Bring cards below the fold into view before pointing at them.
      if (body.contains(target)) {
        const b = inFrame(body), t = inFrame(target);
        if (t.bottom > b.bottom - 12 || t.top < b.top) body.scrollTop += t.bottom - b.bottom + 24;
      }
      const last = step === STEPS.length - 1;
      tip.innerHTML = `
        <div class="tooltip-heading">${icon} ${title}</div>
        <p class="tooltip-text">${text}</p>
        <button type="button" class="login-btn" data-tour="next">${last ? "Finish" : "Next"}</button>
        ${last ? "" : `<button type="button" class="skip-link tour-skip" data-tour="skip">Skip</button>`}`;
      // Above the target when there's room, otherwise below it.
      const t = inFrame(target);
      const above = t.top - tip.offsetHeight - 16 > 54;
      tip.style.top = `${above ? t.top - tip.offsetHeight - 16 : t.bottom + 16}px`;
      tip.classList.toggle("arrow-up", !above);
      tip.style.setProperty("--tour-arrow-x", `${Math.min(Math.max(t.centerX - tip.offsetLeft - 10, 24), tip.offsetWidth - 44)}px`);
    }

    function finish() {
      localStorage.setItem("hearo_home_tutorial_done", "1");
      dimmable.forEach((el) => el.classList.remove("tour-dim", "tour-target"));
      blocker.remove();
      tip.remove();
      body.scrollTop = 0;
    }

    tip.addEventListener("click", (e) => {
      const action = e.target.closest("[data-tour]");
      if (!action) return;
      if (action.dataset.tour === "skip" || step === STEPS.length - 1) return finish();
      step += 1;
      show();
    });
    show();
  })();
</script>
