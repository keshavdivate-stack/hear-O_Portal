<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HearO - Medication History</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/Mobile%20app/style.css?v=31">
<script src="/Mobile%20app/font-scale.js?v=29"></script>
</head>
<body>

  <div class="phone-frame">
    <div class="status-bar">
      <span class="status-time">9:27</span>
      <div class="status-icons">
        <svg width="18" height="12" viewBox="0 0 18 12" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="8" width="3" height="4" rx="0.5" fill="black"/><rect x="4.5" y="6" width="3" height="6" rx="0.5" fill="black"/><rect x="9" y="3" width="3" height="9" rx="0.5" fill="black"/><rect x="13.5" y="0" width="3" height="12" rx="0.5" fill="black"/></svg>
        <svg width="16" height="12" viewBox="0 0 16 12" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M8 10.5C8.6 10.5 9.1 10 9.1 9.4C9.1 8.8 8.6 8.3 8 8.3C7.4 8.3 6.9 8.8 6.9 9.4C6.9 10 7.4 10.5 8 10.5Z" fill="black"/><path d="M8 6.5C9 6.5 9.9 6.9 10.6 7.6L11.6 6.6C10.6 5.6 9.4 5 8 5C6.6 5 5.4 5.6 4.4 6.6L5.4 7.6C6.1 6.9 7 6.5 8 6.5Z" fill="black"/><path d="M8 2.5C10.1 2.5 12 3.3 13.5 4.8L14.5 3.8C12.7 2 10.5 1 8 1C5.5 1 3.3 2 1.5 3.8L2.5 4.8C4 3.3 5.9 2.5 8 2.5Z" fill="black"/></svg>
        <svg width="25" height="12" viewBox="0 0 25 12" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="0.5" y="0.5" width="20" height="11" rx="2.5" stroke="black"/><rect x="2" y="2" width="17" height="8" rx="1.5" fill="black"/><rect x="22" y="4" width="2" height="4" rx="1" fill="black"/></svg>
      </div>
    </div>

    <div class="mx-header mx-header--left">
      <button type="button" class="back-btn" onclick="window.location.href='/Mobile%20app/medication.html'">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M12.5 4L6.5 10L12.5 16" stroke="#252424" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <h1 id="histTitle">Medication history</h1>
    </div>

    <div class="mx-body">
      <div class="mx-month-nav">
        <button type="button" class="mx-circle-btn" id="prevMonthBtn" aria-label="Previous month">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M15 4.5L7 12L15 19.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <span class="mx-month-label" id="monthLabel"></span>
        <button type="button" class="mx-circle-btn" id="nextMonthBtn" aria-label="Next month">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M9 4.5L17 12L9 19.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>

      <div class="mx-legend">
        <span class="mx-legend-item"><span class="mx-legend-dot mx-legend-dot--taken"></span>Taken</span>
        <span class="mx-legend-item"><span class="mx-legend-dot mx-legend-dot--skipped"></span>Skipped</span>
      </div>

      <div id="historyList"></div>
    </div>
  </div>

<script>
  // Each medication's dose times, plus the doses skipped on a given day.
  // skipped[year-month][day] = the dose times skipped that day (fixed demo
  // pattern, so the history reads the same on every visit).
  const MED_INFO = {
    spironolactone: { name: "Spironolactone", times: ["8:00 AM", "8:00 PM"], skipped: { "2026-8": { 18: ["8:00 PM"] }, "2026-7": { 11: ["8:00 AM", "8:00 PM"] } } },
    carvedilol: { name: "Carvedilol", times: ["8:00 AM", "8:00 PM"], skipped: { "2026-8": { 17: ["8:00 AM"] }, "2026-7": { 8: ["8:00 PM"], 20: ["8:00 AM"] } } },
    furosemide: { name: "Furosemide", times: ["8:00 AM"], skipped: { "2026-8": { 12: ["8:00 AM"] }, "2026-7": { 5: ["8:00 AM"], 14: ["8:00 AM"] } } },
    atorvastatin: { name: "Atorvastatin", times: ["9:00 PM"], skipped: { "2026-8": { 6: ["9:00 PM"] }, "2026-7": { 3: ["9:00 PM"], 17: ["9:00 PM"] } } },
  };

  const TODAY = { year: 2026, month: 8, day: 18 };
  const AVAILABLE_MONTHS = [{ year: 2026, month: 7 }, { year: 2026, month: 8 }];
  const MONTH_NAMES = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

  const medKey = new URLSearchParams(window.location.search).get("med");
  const med = MED_INFO[medKey] || MED_INFO.spironolactone;
  document.getElementById("histTitle").textContent = `${med.name} history`;

  let monthIndex = AVAILABLE_MONTHS.length - 1;
  const monthLabelEl = document.getElementById("monthLabel");
  const historyListEl = document.getElementById("historyList");
  const prevBtn = document.getElementById("prevMonthBtn");
  const nextBtn = document.getElementById("nextMonthBtn");

  function renderMonth() {
    const { year, month } = AVAILABLE_MONTHS[monthIndex];
    monthLabelEl.textContent = `${MONTH_NAMES[month - 1]} ${year}`;
    prevBtn.disabled = monthIndex === 0;
    nextBtn.disabled = monthIndex === AVAILABLE_MONTHS.length - 1;

    const skipped = med.skipped[`${year}-${month}`] || {};
    const lastDay = year === TODAY.year && month === TODAY.month ? TODAY.day : new Date(year, month, 0).getDate();

    historyListEl.innerHTML = "";
    for (let day = lastDay; day >= 1; day--) {
      const dateObj = new Date(year, month - 1, day);
      const weekday = dateObj.toLocaleDateString("en-US", { weekday: "short" });
      const monthShort = dateObj.toLocaleDateString("en-US", { month: "short" });
      const lines = med.times
        .map((time) => {
          const isSkipped = (skipped[day] || []).includes(time);
          return `<div class="mx-day-line"><span class="mx-day-time">${time}</span><span class="mx-pill ${isSkipped ? "mx-pill--skipped" : "mx-pill--taken"}">${isSkipped ? "Skipped" : "Taken"}</span></div>`;
        })
        .join("");
      const card = document.createElement("div");
      card.className = "mx-day-card";
      card.innerHTML = `<div class="mx-day-date">${weekday}, ${monthShort} ${day}</div>${lines}`;
      historyListEl.appendChild(card);
    }
  }

  prevBtn.addEventListener("click", () => { if (monthIndex > 0) { monthIndex--; renderMonth(); } });
  nextBtn.addEventListener("click", () => { if (monthIndex < AVAILABLE_MONTHS.length - 1) { monthIndex++; renderMonth(); } });
  renderMonth();
</script>
</body>
</html>
