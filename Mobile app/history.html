<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HearO - History</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/Mobile%20app/style.css?v=19">
<script src="/Mobile%20app/font-scale.js?v=19"></script>
</head>
<body>

  <div class="phone-frame">
    <div class="status-bar">
      <span class="status-time">9:27</span>
      <div class="status-icons">
        <svg width="18" height="12" viewBox="0 0 18 12" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="8" width="3" height="4" rx="0.5" fill="black"/><rect x="4.5" y="6" width="3" height="6" rx="0.5" fill="black"/><rect x="9" y="3" width="3" height="9" rx="0.5" fill="black"/><rect x="13.5" y="0" width="3" height="12" rx="0.5" fill="black"/></svg>
        <svg width="16" height="12" viewBox="0 0 16 12" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M8 10.5C8.6 10.5 9.1 10 9.1 9.4C9.1 8.8 8.6 8.3 8 8.3C7.4 8.3 6.9 8.8 6.9 9.4C6.9 10 7.4 10.5 8 10.5Z" fill="black"/><path d="M8 6.5C9 6.5 9.9 6.9 10.6 7.6L11.6 6.6C10.6 5.6 9.4 5 8 5C6.6 5 5.4 5.6 4.4 6.6L5.4 7.6C6.1 6.9 7 6.5 8 6.5Z" fill="black"/><path d="M8 2.5C10.1 2.5 12 3.3 13.5 4.8L14.5 3.8C12.7 2 10.5 1 8 1C5.5 1 3.3 2 1.5 3.8L2.5 4.8C4 3.3 5.9 2.5 8 2.5Z" fill="black"/></svg>
        <svg width="25" height="12" viewBox="0 0 25 12" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="0.5" y="0.5" width="20" height="11" rx="2.5" stroke="black"/><rect x="2" y="2" width="17" height="8" rx="1.5" fill="black"/><rect x="22" y="4" width="2" height="4" rx="1" fill="black"/></svg>
      </div>
    </div>

    <div class="bp-header">
      <button type="button" class="back-btn" onclick="window.location.href='/Mobile%20app/home.html'">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M12.5 4L6.5 10L12.5 16" stroke="#252424" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <h1>History</h1>
    </div>

    <div class="history-body" id="historyBody"></div>
  </div>

<script>
  const pillIcon = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><g transform="rotate(45 12 12)"><path d="M12 9 H6 A3 3 0 0 0 6 15 H12 Z" fill="#8857FF"/><path d="M12 9 H18 A3 3 0 0 1 18 15 H12 Z" fill="none" stroke="#8857FF" stroke-width="1.6"/></g></svg>`;

  const historyEvents = [
    {
      med: "Furosemide",
      action: "Dosage increased to 40 mg",
      by: "Dr. Sarah Mitchell",
      date: "Today, 8:15 AM",
      note: "Take 2 pills (40 mg) once daily as instructed.",
    },
    {
      med: "Carvedilol",
      action: "Dosage updated to 12.5 mg",
      by: "Amanda Lee, RN",
      date: "Yesterday, 3:40 PM",
      note: "Continue taking twice daily with food.",
    },
    {
      med: "Spironolactone",
      action: "New medication added",
      by: "Dr. Michael Reyes",
      date: "2 days ago, 10:00 AM",
      note: "Started at 25 mg once daily to help manage fluid retention.",
    },
    {
      med: "Atorvastatin",
      action: "Dosage decreased to 10 mg",
      by: "Dr. Sarah Mitchell",
      date: "5 days ago, 9:30 AM",
      note: "Reduced dose due to reported muscle soreness. Please report any new symptoms.",
    },
  ];

  const historyBody = document.getElementById("historyBody");

  if (!historyEvents.length) {
    historyBody.innerHTML = `<p class="history-empty">No medication updates yet</p>`;
  } else {
    historyBody.innerHTML = historyEvents
      .map(
        (h) => `
      <div class="history-card">
        <div class="history-card-head">
          <span class="history-icon">${pillIcon}</span>
          <div class="history-card-title-wrap">
            <div class="history-card-top-row">
              <span class="history-card-med">${h.med}</span>
              <span class="history-card-date">${h.date}</span>
            </div>
            <div class="history-card-action">${h.action}</div>
          </div>
        </div>
        <p class="history-card-meta">Updated by <strong>${h.by}</strong></p>
        <div class="history-card-note">
          <span class="history-card-note-label">Note</span>
          ${h.note}
        </div>
      </div>`
      )
      .join("");
  }
</script>
</body>
</html>
