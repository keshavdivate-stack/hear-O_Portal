<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HearO - Your Home Screen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="font-scale.js"></script>
</head>
<body>

  <div class="phone-frame">
    <div class="status-bar">
      <span class="status-time">9:27</span>
      <div class="status-icons">
        <svg width="18" height="12" viewBox="0 0 18 12" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="8" width="3" height="4" rx="0.5" fill="black"/><rect x="4.5" y="6" width="3" height="6" rx="0.5" fill="black"/><rect x="9" y="3" width="3" height="9" rx="0.5" fill="black"/><rect x="13.5" y="0" width="3" height="12" rx="0.5" fill="black"/></svg>
        <svg width="16" height="12" viewBox="0 0 16 12" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M8 10.5C8.6 10.5 9.1 10 9.1 9.4C9.1 8.8 8.6 8.3 8 8.3C7.4 8.3 6.9 8.8 6.9 9.4C6.9 10 7.4 10.5 8 10.5Z" fill="black"/><path d="M8 6.5C9 6.5 9.9 6.9 10.6 7.6L11.6 6.6C10.6 5.6 9.4 5 8 5C6.6 5 5.4 5.6 4.4 6.6L5.4 7.6C6.1 6.9 7 6.5 8 6.5Z" fill="black"/><path d="M8 2.5C10.1 2.5 12 3.3 13.5 4.8L14.5 3.8C12.7 2 10.5 1 8 1C5.5 1 3.3 2 1.5 3.8L2.5 4.8C4 3.3 5.9 2.5 8 2.5Z" fill="black"/></svg>

      </div>
    </div>

    <div class="tutorial-content">
      <div class="info-icon">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="7" r="1.6" fill="#2f6fed"/>
          <line x1="12" y1="11" x2="12" y2="18" stroke="#2f6fed" stroke-width="2.4" stroke-linecap="round"/>
        </svg>
      </div>
      <h1 class="tutorial-title">Your home screen</h1>
      <p class="tutorial-subtitle">From here you can:</p>

      <ul class="tutorial-checklist">
        <li>
          <span class="check-badge">
            <svg width="12" height="12" viewBox="0 0 16 16" fill="none"><path d="M3 8.5L6.2 11.5L13 4.5" stroke="#2f6fed" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
          Track measurements
        </li>
        <li>
          <span class="check-badge">
            <svg width="12" height="12" viewBox="0 0 16 16" fill="none"><path d="M3 8.5L6.2 11.5L13 4.5" stroke="#2f6fed" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
          View past recordings
        </li>
        <li>
          <span class="check-badge">
            <svg width="12" height="12" viewBox="0 0 16 16" fill="none"><path d="M3 8.5L6.2 11.5L13 4.5" stroke="#2f6fed" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
          Connect with your clinic
        </li>
      </ul>

      <div class="tutorial-footer">
        <button type="button" class="login-btn" onclick="window.location.href='measurements-tooltip.html'">Show me</button>
        <button type="button" class="skip-link" onclick="localStorage.setItem('hearo_onboarding_completed','1'); window.location.href='home.html'">Skip</button>
      </div>
    </div>
  </div>

</body>
</html>
