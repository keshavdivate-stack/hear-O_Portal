<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HearO - Hold the Phone</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="phone-frame">
    <div class="status-bar">
      <span class="status-time">1:47</span>
      <div class="status-icons">
        <svg width="18" height="12" viewBox="0 0 18 12" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="8" width="3" height="4" rx="0.5" fill="black"/><rect x="4.5" y="6" width="3" height="6" rx="0.5" fill="black"/><rect x="9" y="3" width="3" height="9" rx="0.5" fill="black"/><rect x="13.5" y="0" width="3" height="12" rx="0.5" fill="black"/></svg>
        <svg width="16" height="12" viewBox="0 0 16 12" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M8 10.5C8.6 10.5 9.1 10 9.1 9.4C9.1 8.8 8.6 8.3 8 8.3C7.4 8.3 6.9 8.8 6.9 9.4C6.9 10 7.4 10.5 8 10.5Z" fill="black"/><path d="M8 6.5C9 6.5 9.9 6.9 10.6 7.6L11.6 6.6C10.6 5.6 9.4 5 8 5C6.6 5 5.4 5.6 4.4 6.6L5.4 7.6C6.1 6.9 7 6.5 8 6.5Z" fill="black"/><path d="M8 2.5C10.1 2.5 12 3.3 13.5 4.8L14.5 3.8C12.7 2 10.5 1 8 1C5.5 1 3.3 2 1.5 3.8L2.5 4.8C4 3.3 5.9 2.5 8 2.5Z" fill="black"/></svg>
        <svg width="25" height="12" viewBox="0 0 25 12" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="0.5" y="0.5" width="20" height="11" rx="2.5" stroke="black"/><rect x="2" y="2" width="17" height="8" rx="1.5" fill="black"/><rect x="22" y="4" width="2" height="4" rx="1" fill="black"/></svg>
      </div>
    </div>

    <div class="onboarding-content">
      <div class="stepper">
        <div class="step-circle done">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M3 8.5L6.2 11.5L13 4.5" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div class="step-line done"></div>
        <div class="step-circle active">2</div>
        <div class="step-line"></div>
        <div class="step-circle">3</div>
        <div class="step-line"></div>
        <div class="step-circle">4</div>
        <div class="step-line"></div>
        <div class="step-circle">5</div>
        <div class="step-line"></div>
        <div class="step-circle">6</div>
      </div>

      <p class="onboarding-text">Hold the phone in a way that doesn't block the microphone</p>

      <div class="onboarding-illustration">
        <svg width="240" height="220" viewBox="0 0 240 220" fill="none" xmlns="http://www.w3.org/2000/svg">
          <ellipse cx="120" cy="115" rx="118" ry="100" fill="#eceef1"/>
          <g>
            <path d="M40 190 Q40 130 65 100 Q78 85 78 150 L78 195 Z" fill="#e8b382"/>
            <rect x="52" y="85" width="46" height="88" rx="10" fill="#2f6fed" stroke="#1c1c1c" stroke-width="2"/>
            <rect x="58" y="95" width="34" height="60" rx="2" fill="#dce8ff"/>
          </g>
          <g>
            <path d="M200 190 Q200 130 175 95 Q158 75 162 150 L165 195 Z" fill="#e8b382"/>
            <rect x="142" y="70" width="46" height="88" rx="10" fill="#2f6fed" stroke="#1c1c1c" stroke-width="2"/>
            <rect x="148" y="80" width="34" height="60" rx="2" fill="#dce8ff"/>
          </g>
          <circle cx="82" cy="188" r="14" fill="#c7cbd1"/>
          <path d="M76 188L81 193L89 183" stroke="#7a7f87" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="172" cy="188" r="14" fill="#1fb190"/>
          <path d="M166 188L171 193L179 183" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>

      <div class="onboarding-nav">
        <button type="button" class="nav-link" onclick="window.location.href='onboarding-1.html'">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M11 3L5 9L11 15" stroke="#2b2b2b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Back
        </button>
        <button type="button" class="nav-link" onclick="window.location.href='record-prompt.html?mode=training'">
          Next
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M7 3L13 9L7 15" stroke="#2b2b2b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>
  </div>

</body>
</html>
