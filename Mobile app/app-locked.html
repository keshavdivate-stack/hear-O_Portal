<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HearO - App Locked</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/Mobile%20app/style.css?v=9">
<script src="/Mobile%20app/font-scale.js?v=9"></script>
</head>
<body>

  <div class="phone-frame">
    <div class="status-bar">
      <span class="status-time">9:27</span>
      <div class="status-icons">
        <svg width="18" height="12" viewBox="0 0 18 12" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="8" width="3" height="4" rx="0.5" fill="black"/><rect x="4.5" y="6" width="3" height="6" rx="0.5" fill="black"/><rect x="9" y="3" width="3" height="9" rx="0.5" fill="black"/><rect x="13.5" y="0" width="3" height="12" rx="0.5" fill="black"/></svg>
        <svg width="16" height="12" viewBox="0 0 16 12" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M8 10.5C8.6 10.5 9.1 10 9.1 9.4C9.1 8.8 8.6 8.3 8 8.3C7.4 8.3 6.9 8.8 6.9 9.4C6.9 10 7.4 10.5 8 10.5Z" fill="black"/><path d="M8 6.5C9 6.5 9.9 6.9 10.6 7.6L11.6 6.6C10.6 5.6 9.4 5 8 5C6.6 5 5.4 5.6 4.4 6.6L5.4 7.6C6.1 6.9 7 6.5 8 6.5Z" fill="black"/><path d="M8 2.5C10.1 2.5 12 3.3 13.5 4.8L14.5 3.8C12.7 2 10.5 1 8 1C5.5 1 3.3 2 1.5 3.8L2.5 4.8C4 3.3 5.9 2.5 8 2.5Z" fill="black"/></svg>
        <svg width="25" height="12" viewBox="0 0 25 12" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="0.5" y="0.5" width="20" height="11" rx="2.5" stroke="black"/><rect x="2" y="2" width="17" height="8" rx="1.5" fill="black"/><rect x="22" y="4" width="2" height="4" rx="1" fill="black"/></svg>
      </div>
    </div>

    <div class="locked-content">
      <div class="locked-icon-outer">
        <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="10" y="18" width="20" height="16" rx="3" stroke="#186DCE" stroke-width="2.2"/>
          <path d="M14 18V13C14 9.68629 16.6863 7 20 7C23.3137 7 26 9.68629 26 13V18" stroke="#186DCE" stroke-width="2.2" stroke-linecap="round"/>
          <circle cx="20" cy="25" r="2.2" fill="#186DCE"/>
        </svg>
      </div>

      <h1 class="locked-title">App temporarily locked</h1>
      <p class="locked-desc">Too many incorrect codes were entered.<br>Please wait 30 minutes before trying again</p>

      <div class="locked-timer-box">
        <span class="locked-timer-label">Try again at</span>
        <span class="locked-timer-value" id="tryAgainTime">3:45 PM</span>
      </div>

      <div class="locked-footer">
        <p class="otp-help">Need help? <a href="/Mobile%20app/contact-us.html" class="otp-help-link">Contact us</a></p>
      </div>
    </div>
  </div>

<script>
  document.addEventListener("DOMContentLoaded", () => {
    const stored = localStorage.getItem("hearo_lock_until");
    const unlockAt = stored ? new Date(parseInt(stored, 10)) : new Date(Date.now() + 30 * 60 * 1000);
    let hours = unlockAt.getHours();
    const minutes = unlockAt.getMinutes().toString().padStart(2, "0");
    const ampm = hours >= 12 ? "PM" : "AM";
    hours = hours % 12 || 12;
    document.getElementById("tryAgainTime").textContent = `${hours}:${minutes} ${ampm}`;
  });
</script>
</body>
</html>
