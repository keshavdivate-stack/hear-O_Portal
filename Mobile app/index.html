<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HearO - Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="font-scale.js"></script>
</head>
<body>

  <div class="phone-frame">
    <div class="status-bar">
      <span class="status-time">9:27</span>
      <div class="status-icons">
        <svg width="18" height="12" viewBox="0 0 18 12" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="0" y="8" width="3" height="4" rx="0.5" fill="black"/>
          <rect x="4.5" y="6" width="3" height="6" rx="0.5" fill="black"/>
          <rect x="9" y="3" width="3" height="9" rx="0.5" fill="black"/>
          <rect x="13.5" y="0" width="3" height="12" rx="0.5" fill="black"/>
        </svg>
        <svg width="16" height="12" viewBox="0 0 16 12" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M8 10.5C8.6 10.5 9.1 10 9.1 9.4C9.1 8.8 8.6 8.3 8 8.3C7.4 8.3 6.9 8.8 6.9 9.4C6.9 10 7.4 10.5 8 10.5Z" fill="black"/>
          <path d="M8 6.5C9 6.5 9.9 6.9 10.6 7.6L11.6 6.6C10.6 5.6 9.4 5 8 5C6.6 5 5.4 5.6 4.4 6.6L5.4 7.6C6.1 6.9 7 6.5 8 6.5Z" fill="black"/>
          <path d="M8 2.5C10.1 2.5 12 3.3 13.5 4.8L14.5 3.8C12.7 2 10.5 1 8 1C5.5 1 3.3 2 1.5 3.8L2.5 4.8C4 3.3 5.9 2.5 8 2.5Z" fill="black"/>
        </svg>
        <svg width="25" height="12" viewBox="0 0 25 12" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="0.5" y="0.5" width="20" height="11" rx="2.5" stroke="black"/>
          <rect x="2" y="2" width="17" height="8" rx="1.5" fill="black"/>
          <rect x="22" y="4" width="2" height="4" rx="1" fill="black"/>
        </svg>
      </div>
    </div>

    <div class="screen-content">
      <div class="logo">
        <img class="logo-img" src="https://web.dev3.cordiomed.com/assets/icons/logo.svg" alt="HearO">
      </div>

      <h1 class="title">Login</h1>
      <p class="subtitle">Please fill the fields below</p>

      <form class="login-form" autocomplete="off">
        <div class="field-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" placeholder="Enter username">
        </div>

        <div class="field-group">
          <label for="password">Password</label>
          <div class="password-wrapper">
            <input type="password" id="password" name="password" placeholder="Enter password">
            <button type="button" class="toggle-password" id="togglePassword" aria-label="Toggle password visibility">
              <svg class="icon-eye" width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M1 12C1 12 5 4 12 4C19 4 23 12 23 12C23 12 19 20 12 20C5 20 1 12 1 12Z" stroke="#555" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                <circle cx="12" cy="12" r="3.2" stroke="#555" stroke-width="1.6"/>
              </svg>
              <svg class="icon-eye-off" width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="display:none">
                <path d="M1 12C1 12 5 4 12 4C19 4 23 12 23 12C23 12 19 20 12 20C5 20 1 12 1 12Z" stroke="#555" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                <circle cx="12" cy="12" r="3.2" stroke="#555" stroke-width="1.6"/>
                <line x1="2" y1="22" x2="22" y2="2" stroke="#555" stroke-width="1.6" stroke-linecap="round"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="field-group">
          <label for="language">Language</label>
          <div class="select-wrapper" id="languageSelect">
            <button type="button" class="select-trigger" id="selectTrigger">
              <span id="selectedLanguage">English</span>
              <svg class="chevron" width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M4 6L8 10L12 6" stroke="#333" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
            <ul class="select-options" id="selectOptions">
              <li data-value="English" class="selected">
                <svg class="check" width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M3 8.5L6.2 11.5L13 4.5" stroke="#2f6fed" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span>English</span>
              </li>
              <li data-value="Español"><span class="check-space"></span><span>Español</span></li>
              <li data-value="Русский"><span class="check-space"></span><span>Русский</span></li>
              <li data-value="עברית" class="rtl-text"><span class="check-space"></span><span>עברית</span></li>
              <li data-value="العربية" class="rtl-text"><span class="check-space"></span><span>العربية</span></li>
            </ul>
          </div>
        </div>

        <button type="submit" class="login-btn">Login</button>
      </form>
    </div>
  </div>

<script src="script.js"></script>
</body>
</html>
