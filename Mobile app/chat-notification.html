<body>

    <div class="chatnotify-content">
      <button type="button" class="skip-link chatnotify-skip" onclick="window.location.href='/Mobile%20app/home.html'">Skip</button>

      <div class="chatnotify-icon">
        <svg width="44" height="44" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 5.5C4 4.4 4.9 3.5 6 3.5H18C19.1 3.5 20 4.4 20 5.5V14C20 15.1 19.1 16 18 16H9L5 19.5V16H6C4.9 16 4 15.1 4 14V5.5Z" stroke="#186DCE" stroke-width="1.8" stroke-linejoin="round"/>

        </svg>
        <span class="chatnotify-badge">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 20.5C12 20.5 3.5 15.5 3.5 9.5C3.5 6.5 5.8 4.5 8.5 4.5C10 4.5 11.2 5.2 12 6.2C12.8 5.2 14 4.5 15.5 4.5C18.2 4.5 20.5 6.5 20.5 9.5C20.5 15.5 12 20.5 12 20.5Z" fill="#fff"/>
          </svg>
        </span>
      </div>

      <h1 class="chatnotify-title">You have a new message from your clinic</h1>
      <p class="chatnotify-desc">Tap the button below to read it</p>

      <div class="chatnotify-footer">
        <button type="button" class="login-btn" onclick="window.location.href='/Mobile%20app/chat.html'">View message</button>
      </div>
    </div>
  </div>

</body>
</html>
