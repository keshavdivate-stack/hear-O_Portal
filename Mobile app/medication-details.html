<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HearO - Medication Details</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/Mobile%20app/style.css?v=36">
<script src="/Mobile%20app/font-scale.js?v=29"></script>
<style>
  /* Medication details -- matches the client-approved My Medication screens:
     a white page, a bordered summary card of icon + label/value rows, a
     History/Updates switch, and a bordered card for the selected list. */
  .status-bar { background: #fff; }
  .mx-header { padding: 19px 20px; }
  .mx-header h1 { font-size: calc(28px * var(--font-scale, 1)); color: #434141; }
  .mx-body { background: #fff; padding: 19px 28px 28px; }

  .md-card { background: #fff; border: 1px solid #D5D8DE; border-radius: 16px; padding: 3px 12px 2px 15px; margin-bottom: 13px; }

  .md-info-row { display: flex; align-items: flex-start; gap: 8px; padding: 8px 0 11px; }
  .md-info-row + .md-info-row { border-top: 1px solid #E5E7EB; }
  .md-info-icon { flex-shrink: 0; width: 31px; height: 31px; margin-top: 2px; border-radius: 8px; display: flex; align-items: center; justify-content: center; }
  .md-info-icon--violet { background: #F2EDFD; color: #8857FF; }
  .md-info-icon--blue { background: #F0F7FF; color: #186DCE; }
  .md-info-icon--amber { background: #FEFCE8; color: #D99400; }
  .md-info-icon--green { background: #E6F8EE; color: #1F9D7A; }
  .md-info-icon--gray { background: #ECECEC; color: #6F6F6F; }
  .md-info-text { min-width: 0; flex: 1; }
  .md-info-label { display: block; font-size: calc(16px * var(--font-scale, 1)); line-height: 1.2; color: #8A8F97; }
  .md-info-value { display: block; margin-top: 3px; font-size: calc(20px * var(--font-scale, 1)); line-height: 1.2; font-weight: 400; color: #3D3D3D; }

  .mx-tabs { background: #F0F1F1; border-radius: 14px; padding: 5px; gap: 5px; margin-bottom: 13px; }
  .mx-tab { min-height: 48px; border-radius: 10px; font-size: calc(20px * var(--font-scale, 1)); font-weight: 400; color: #3D3B3B; }
  .mx-tab.active { background: #186DCE; color: #fff; }
  .md-section-label { margin: 2px 2px 10px; font-size: calc(18px * var(--font-scale, 1)); font-weight: 600; color: #565454; }

  /* History row: date/time on the left, status word on the right. */
  #listCard { padding: 0 15px; }
  .md-hist-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 0; }
  .md-hist-row + .md-hist-row { border-top: 1px solid #ECEDEE; }
  .md-hist-when { font-size: calc(18px * var(--font-scale, 1)); color: #3D3D3D; }
  .md-hist-status { flex-shrink: 0; font-size: calc(18px * var(--font-scale, 1)); font-weight: 400; }
  .md-hist-status--taken { color: #229A7E; }
  .md-hist-status--skipped { color: #F59E0B; }
  .md-hist-status--missed { color: #8A8F97; }

  /* Update: when it changed, what changed, and the new instruction in a
     gray note box. */
  .md-upd-row { padding: 15px 1px 16px; }
  .md-upd-row + .md-upd-row { border-top: 1px solid #ECEDEE; }
  .md-upd-date { font-size: calc(16px * var(--font-scale, 1)); line-height: 1.2; color: #302E2E; }
  .md-upd-change { margin-top: 9px; font-size: calc(18px * var(--font-scale, 1)); line-height: 1.2; color: #565454; }
  .md-upd-note { margin-top: 12px; padding: 7px 12px 9px; border-radius: 12px; background: #F0F1F1; font-size: calc(20px * var(--font-scale, 1)); line-height: 1.45; color: #3D3B3B; }

  .md-empty { text-align: center; color: #8A8F97; font-size: calc(17px * var(--font-scale, 1)); padding: 20px 0; }
</style>
</head>
<body>

  <div class="phone-frame">
    <div class="status-bar">
      <span class="status-time">9:27</span>
      <div class="status-icons">
        <svg width="18" height="12" viewBox="0 0 18 12" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="8" width="3" height="4" rx="0.5" fill="black"/><rect x="4.5" y="6" width="3" height="6" rx="0.5" fill="black"/><rect x="9" y="3" width="3" height="9" rx="0.5" fill="black"/><rect x="13.5" y="0" width="3" height="12" rx="0.5" fill="black"/></svg>
        <svg width="16" height="12" viewBox="0 0 16 12" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M8 10.5C8.6 10.5 9.1 10 9.1 9.4C9.1 8.8 8.6 8.3 8 8.3C7.4 8.3 6.9 8.8 6.9 9.4C6.9 10 7.4 10.5 8 10.5Z" fill="black"/><path d="M8 6.5C9 6.5 9.9 6.9 10.6 7.6L11.6 6.6C10.6 5.6 9.4 5 8 5C6.6 5 5.4 5.6 4.4 6.6L5.4 7.6C6.1 6.9 7 6.5 8 6.5Z" fill="black"/><path d="M8 2.5C10.1 2.5 12 3.3 13.5 4.8L14.5 3.8C12.7 2 10.5 1 8 1C5.5 1 3.3 2 1.5 3.8L2.5 4.8C4 3.3 5.9 2.5 8 2.5Z" fill="black"/></svg>
        <svg width="25" height="12" viewBox="0 0 25 12" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="0.5" y="0.5" width="20" height="11" rx="2.5" stroke="black"/><rect x="2" y="2" width="17" height="8" rx="1.5" fill="black"/><rect x="22" y="4" width="2" height="4" rx="1" fill="black"/></svg>
      </div>
    </div>

    <div class="mx-header">
      <button type="button" class="back-btn" id="backBtn">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M12.5 4L6.5 10L12.5 16" stroke="#252424" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <h1 id="medTitle">Medication</h1>
    </div>

    <div class="mx-body">
      <div class="md-card" id="summaryCard"></div>

      <div class="mx-tabs" id="detailTabs" hidden>
        <button type="button" class="mx-tab" data-sec="history">History</button>
        <button type="button" class="mx-tab" data-sec="updates">Updates</button>
      </div>
      <p class="md-section-label" id="historyOnlyLabel" hidden>History</p>

      <div class="md-card" id="listCard"></div>
    </div>
  </div>

<script>
  const STATUS_LABEL = { taken: "Taken", skipped: "Skipped", missed: "Not Taken" };

  const doseIcon = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 3.5 3.5 10.5a4.95 4.95 0 0 0 7 7l7-7a4.95 4.95 0 0 0-7-7z"/><path d="M7 7l7 7"/></svg>`;
  const routeIcon = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3s6 7 6 11a6 6 0 0 1-12 0c0-4 6-11 6-11z"/></svg>`;
  const freqIcon = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>`;
  const durationIcon = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="2"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg>`;
  const descIcon = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M8 13h8M8 17h5"/></svg>`;
  const formIcon = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="5"/></svg>`;
  const foodIcon = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 2v8a2 2 0 1 1-4 0V2"/><path d="M5 10v12"/><path d="M11 2c2 0 3 2.2 3 5s-1 5-3 5"/><path d="M14 12v10"/></svg>`;
  const FOOD_LABEL = { before: "Before food", after: "After food", with: "With food" };

  // Every medication's current state (what Skip/Take acts on today), keyed
  // by the same `med` slug used on the Medications list, so Detail is
  // always this one record's single source of truth.
  const MED_INFO = {
    spironolactone: {
      name: "Spironolactone", dosage: "40 mg", route: "Oral", frequency: "Twice daily", startDate: "Aug 1, 2026", endDate: null,
      description: "Used to reduce fluid buildup",
      source: "clinic", schedule: [{ time: "8:00 AM", food: "before" }, { time: "2:00 PM", food: "before" }],
    },
    carvedilol: {
      name: "Carvedilol", dosage: "40 mg", route: "Oral", frequency: "Twice daily", startDate: "Jul 15, 2026", endDate: null,
      description: "A beta-blocker used to lower heart rate and blood pressure.",
      source: "clinic", schedule: [{ time: "8:00 AM", food: "after" }, { time: "8:00 PM", food: "after" }],
    },
    furosemide: {
      name: "Furosemide", dosage: "40 mg", route: "Oral", frequency: "Twice daily", startDate: "Jul 15, 2026", endDate: null,
      description: "A diuretic (“water pill”) used to reduce fluid buildup.",
      source: "clinic", schedule: [{ time: "8:00 AM", food: "after" }, { time: "8:00 PM", food: "after" }],
    },
    atorvastatin: {
      name: "Atorvastatin", dosage: "40 mg", route: "Oral", frequency: "Once daily", startDate: "Jun 2, 2026", endDate: null,
      description: "Used to lower cholesterol and reduce cardiovascular risk.",
      source: "clinic", schedule: [{ time: "9:00 PM", food: "after" }],
    },
    hydrocortisone: {
      name: "Hydrocortisone", dosage: "1%", route: "Topical", frequency: "Once daily", startDate: "Aug 10, 2026", endDate: null,
      description: "A mild steroid cream used to reduce skin inflammation and itching.",
      source: "clinic", schedule: [{ time: "8:00 PM" }],
    },
    "vitamin-d3": {
      name: "Vitamin D3", form: "Tablet", whenToTake: "Morning", food: "after", startDate: "Jul 1, 2026", endDate: null,
      description: "Supplement to support bone health.",
      source: "mine", schedule: [{ time: "8:00 AM", food: "after" }],
    },
    calcium: {
      name: "Calcium", form: "Tablet", whenToTake: "Evening", food: "after", startDate: "Jul 1, 2026", endDate: null,
      description: "Supplement to support bone health.",
      source: "mine", schedule: [{ time: "9:00 PM", food: "after" }],
    },
    vitamin: {
      name: "Vitamin", form: "Tablet", whenToTake: "Evening", food: "after", startDate: "Jul 1, 2026", endDate: null,
      description: "Daily multivitamin.",
      source: "mine", schedule: [{ time: "9:00 PM", food: "after" }],
    },
  };

  // History = patient activity: Taken / Skipped / Not Taken, with date & time.
  const HISTORY = {
    spironolactone: [
      { date: "Mon, Aug 17", time: "8:00 AM", status: "taken" },
      { date: "Mon, Aug 17", time: "2:00 PM", status: "taken" },
      { date: "Sun, Aug 16", time: "8:00 AM", status: "skipped" },
      { date: "Sun, Aug 16", time: "2:00 PM", status: "taken" },
      { date: "Sat, Aug 15", time: "8:00 AM", status: "taken" },
      { date: "Sat, Aug 15", time: "2:00 PM", status: "taken" },
    ],
    carvedilol: [
      { date: "Mon, Aug 17", time: "8:00 AM", status: "taken" },
      { date: "Mon, Aug 17", time: "8:00 PM", status: "taken" },
      { date: "Sun, Aug 16", time: "8:00 AM", status: "taken" },
      { date: "Sun, Aug 16", time: "8:00 PM", status: "skipped" },
    ],
    furosemide: [
      { date: "Mon, Aug 17", time: "8:00 AM", status: "missed" },
      { date: "Mon, Aug 17", time: "8:00 PM", status: "taken" },
      { date: "Sun, Aug 16", time: "8:00 AM", status: "taken" },
      { date: "Sun, Aug 16", time: "8:00 PM", status: "taken" },
    ],
    atorvastatin: [
      { date: "Mon, Aug 17", time: "9:00 PM", status: "taken" },
      { date: "Sun, Aug 16", time: "9:00 PM", status: "missed" },
    ],
    hydrocortisone: [
      { date: "Mon, Aug 17", time: "8:00 PM", status: "taken" },
      { date: "Sun, Aug 16", time: "8:00 PM", status: "taken" },
    ],
    "vitamin-d3": [
      { date: "Mon, Aug 17", time: "8:00 AM", status: "taken" },
      { date: "Sun, Aug 16", time: "8:00 AM", status: "skipped" },
    ],
    calcium: [
      { date: "Mon, Aug 17", time: "9:00 PM", status: "taken" },
      { date: "Sun, Aug 16", time: "9:00 PM", status: "taken" },
    ],
    vitamin: [
      { date: "Mon, Aug 17", time: "9:00 PM", status: "taken" },
      { date: "Sun, Aug 16", time: "9:00 PM", status: "taken" },
    ],
  };

  // Updates = changes to the order itself: dose/frequency changes, new or
  // discontinued medication, instruction changes. Clinic-prescribed only --
  // there's no provider changing a self-tracked medication.
  const UPDATES = {
    spironolactone: [{ date: "Aug 18, 8:15 AM", change: "Dosage increased to 40 mg", note: "Take 2 pills (40 mg) once daily as instructed." }],
    carvedilol: [{ date: "Aug 18, 8:15 AM", change: "Dosage increased to 40 mg", note: "Take 2 pills (40 mg) once daily as instructed." }],
    furosemide: [{ date: "Aug 18, 8:15 AM", change: "Dosage increased to 40 mg", note: "Take 2 pills (40 mg) once daily as instructed." }],
    atorvastatin: [{ date: "Aug 18, 8:15 AM", change: "Dosage increased to 40 mg", note: "Take 2 pills (40 mg) once daily as instructed." }],
  };

  const params = new URLSearchParams(window.location.search);
  const medKey = params.get("med");
  const med = MED_INFO[medKey] || MED_INFO.spironolactone;
  const resolvedKey = MED_INFO[medKey] ? medKey : "spironolactone";

  document.getElementById("medTitle").textContent = med.name;
  document.getElementById("backBtn").onclick = () => {
    window.location.href = `/Mobile%20app/medications.html?tab=${med.source === "mine" ? "mine" : "clinic"}`;
  };

  const durationText = med.endDate ? `${med.startDate} &ndash; ${med.endDate}` : `Since ${med.startDate} &middot; Ongoing`;

  // My Medications is self-reported -- Detail shows exactly what Add
  // Medication collects: medication form, strength (dose), number of units,
  // when to take it, additional (food) instructions, reason and duration.
  // Clinic Prescribed keeps the full provider-order summary instead.
  const doseRow = `
    <div class="md-info-row">
      <span class="md-info-icon md-info-icon--violet">${doseIcon}</span>
      <span class="md-info-text"><span class="md-info-label">Dose</span><span class="md-info-value">${med.dosage ? `${med.dosage} &middot; ` : ""}Take 1 pill</span></span>
    </div>`;
  const durationRow = `
    <div class="md-info-row">
      <span class="md-info-icon md-info-icon--green">${durationIcon}</span>
      <span class="md-info-text"><span class="md-info-label">Duration</span><span class="md-info-value">${durationText}</span></span>
    </div>`;

  const summaryRows = med.source === "mine"
    ? `
    ${doseRow}
    <div class="md-info-row">
      <span class="md-info-icon md-info-icon--blue">${formIcon}</span>
      <span class="md-info-text"><span class="md-info-label">Medication form</span><span class="md-info-value">${med.form}</span></span>
    </div>
    <div class="md-info-row">
      <span class="md-info-icon md-info-icon--amber">${freqIcon}</span>
      <span class="md-info-text"><span class="md-info-label">When to take it</span><span class="md-info-value">${med.whenToTake}</span></span>
    </div>
    ${med.food ? `
    <div class="md-info-row">
      <span class="md-info-icon md-info-icon--gray">${foodIcon}</span>
      <span class="md-info-text"><span class="md-info-label">Additional instructions</span><span class="md-info-value">${FOOD_LABEL[med.food]}</span></span>
    </div>` : ""}
    <div class="md-info-row">
      <span class="md-info-icon md-info-icon--gray">${descIcon}</span>
      <span class="md-info-text"><span class="md-info-label">Reason</span><span class="md-info-value">${med.description}</span></span>
    </div>
    ${durationRow}`
    : `
    ${doseRow}
    <div class="md-info-row">
      <span class="md-info-icon md-info-icon--blue">${routeIcon}</span>
      <span class="md-info-text"><span class="md-info-label">Route</span><span class="md-info-value">${med.route}</span></span>
    </div>
    <div class="md-info-row">
      <span class="md-info-icon md-info-icon--amber">${freqIcon}</span>
      <span class="md-info-text"><span class="md-info-label">Frequency</span><span class="md-info-value">${med.frequency}</span></span>
    </div>
    ${durationRow}
    <div class="md-info-row">
      <span class="md-info-icon md-info-icon--gray">${descIcon}</span>
      <span class="md-info-text"><span class="md-info-label">Description</span><span class="md-info-value">${med.description}</span></span>
    </div>`;

  document.getElementById("summaryCard").innerHTML = summaryRows;

  function renderHistory() {
    const entries = HISTORY[resolvedKey] || [];
    document.getElementById("listCard").innerHTML = entries.length
      ? entries
          .map(
            (h) => `
          <div class="md-hist-row">
            <span class="md-hist-when">${h.date} &middot; ${h.time}</span>
            <span class="md-hist-status md-hist-status--${h.status}">${STATUS_LABEL[h.status]}</span>
          </div>`
          )
          .join("")
      : `<p class="md-empty">No activity recorded yet.</p>`;
  }

  function renderUpdates() {
    const entries = UPDATES[resolvedKey] || [];
    document.getElementById("listCard").innerHTML = entries.length
      ? entries
          .map(
            (u) => `
          <div class="md-upd-row">
            <div class="md-upd-date">${u.date}</div>
            <div class="md-upd-change">${u.change}</div>
            <div class="md-upd-note">${u.note}</div>
          </div>`
          )
          .join("")
      : `<p class="md-empty">No updates yet.</p>`;
  }

  if (med.source === "mine") {
    // Self-tracked medications have no provider updates -- show History
    // only, with a plain label instead of a tab nobody can switch to.
    document.getElementById("historyOnlyLabel").hidden = false;
    renderHistory();
  } else {
    document.getElementById("detailTabs").hidden = false;
    const tabsEl = document.getElementById("detailTabs");
    const setSection = (section) => {
      tabsEl.querySelectorAll(".mx-tab").forEach((b) => b.classList.toggle("active", b.dataset.sec === section));
      section === "updates" ? renderUpdates() : renderHistory();
    };
    tabsEl.addEventListener("click", (e) => {
      const btn = e.target.closest("[data-sec]");
      if (btn) setSection(btn.dataset.sec);
    });
    setSection(params.get("section") === "updates" ? "updates" : "history");
  }
</script>
</body>
</html>
