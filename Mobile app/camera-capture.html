<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HearO - Take a Photo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/Mobile%20app/style.css?v=20">
<script src="/Mobile%20app/font-scale.js?v=20"></script>
</head>
<body>

  <div class="phone-frame">
    <div class="camera-view">
      <div class="camera-preview"></div>

      <button type="button" class="camera-back-btn" onclick="window.location.href='/Mobile%20app/chat.html'">
        <svg width="18" height="18" viewBox="0 0 20 20" fill="none"><path d="M12.5 4L6.5 10L12.5 16" stroke="#252424" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>

      <div class="camera-controls">
        <button type="button" class="camera-shutter-btn" onclick="capture()"></button>
        <button type="button" class="camera-flip-btn" aria-label="Switch camera">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M4 8.5C5.2 5.8 8 4 11.2 4C15 4 18.2 6.6 19.2 10" stroke="#434141" stroke-width="1.8" stroke-linecap="round"/>
            <path d="M20 15.5C18.8 18.2 16 20 12.8 20C9 20 5.8 17.4 4.8 14" stroke="#434141" stroke-width="1.8" stroke-linecap="round"/>
            <path d="M19 6.5V10.5H15" stroke="#434141" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M5 17.5V13.5H9" stroke="#434141" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

<script>
  function capture() {
    window.location.href = "/Mobile%20app/chat.html?photo=1";
  }
</script>
</body>
</html>
