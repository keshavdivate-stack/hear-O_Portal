<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HearO - Profile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/Mobile%20app/style.css?v=18">
<script src="/Mobile%20app/font-scale.js?v=18"></script>
</head>
<body>

  <div class="phone-frame">
    <div class="status-bar">
      <span class="status-time">9:27</span>
      <div class="status-icons">
        <svg width="18" height="12" viewBox="0 0 18 12" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="8" width="3" height="4" rx="0.5" fill="black"/><rect x="4.5" y="6" width="3" height="6" rx="0.5" fill="black"/><rect x="9" y="3" width="3" height="9" rx="0.5" fill="black"/><rect x="13.5" y="0" width="3" height="12" rx="0.5" fill="black"/></svg>
        <svg width="16" height="12" viewBox="0 0 16 12" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M8 10.5C8.6 10.5 9.1 10 9.1 9.4C9.1 8.8 8.6 8.3 8 8.3C7.4 8.3 6.9 8.8 6.9 9.4C6.9 10 7.4 10.5 8 10.5Z" fill="black"/><path d="M8 6.5C9 6.5 9.9 6.9 10.6 7.6L11.6 6.6C10.6 5.6 9.4 5 8 5C6.6 5 5.4 5.6 4.4 6.6L5.4 7.6C6.1 6.9 7 6.5 8 6.5Z" fill="black"/><path d="M8 2.5C10.1 2.5 12 3.3 13.5 4.8L14.5 3.8C12.7 2 10.5 1 8 1C5.5 1 3.3 2 1.5 3.8L2.5 4.8C4 3.3 5.9 2.5 8 2.5Z" fill="black"/></svg>
        <svg width="25" height="12" viewBox="0 0 25 12" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="0.5" y="0.5" width="20" height="11" rx="2.5" stroke="black"/><rect x="2" y="2" width="17" height="8" rx="1.5" fill="black"/><rect x="22" y="4" width="2" height="4" rx="1" fill="black"/></svg>
      </div>
    </div>

    <div class="bp-header">
      <button type="button" class="back-btn" onclick="window.location.href='/Mobile%20app/menu.html'">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M12.5 4L6.5 10L12.5 16" stroke="#252424" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <h1>Profile</h1>
    </div>

    <div class="profile-body">
      <div class="profile-header-card">
        <div class="profile-avatar" id="avatarInitials">JD</div>
        <p class="profile-name" id="profileName">John Doe</p>
      </div>

      <div class="profile-info-list">
        <div class="profile-info-row">
          <div class="profile-info-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8.5" r="3.5" stroke="#252424" stroke-width="1.6"/><path d="M4.5 20C5.5 16.5 8.4 14.5 12 14.5C15.6 14.5 18.5 16.5 19.5 20" stroke="#252424" stroke-width="1.6" stroke-linecap="round"/></svg>
          </div>
          <div class="profile-info-text">
            <p class="profile-info-label">Full Name</p>
            <p class="profile-info-value">John Doe</p>
          </div>
        </div>

        <div class="profile-info-row">
          <div class="profile-info-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="4" y="3" width="16" height="18" rx="2" stroke="#252424" stroke-width="1.6"/><line x1="8" y1="7" x2="16" y2="7" stroke="#252424" stroke-width="1.6" stroke-linecap="round"/><line x1="8" y1="11" x2="16" y2="11" stroke="#252424" stroke-width="1.6" stroke-linecap="round"/></svg>
          </div>
          <div class="profile-info-text">
            <p class="profile-info-label">Date of Birth</p>
            <p class="profile-info-value">14 Mar 1958</p>
          </div>
        </div>

        <div class="profile-info-row">
          <div class="profile-info-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 5.5C4 4.4 4.9 3.5 6 3.5H8L10 8L7.5 9.5C8.5 11.7 10.3 13.5 12.5 14.5L14 12L18.5 14V16.5C18.5 17.6 17.6 18.5 16.5 18.5C10.7 18.5 4 11.8 4 5.5Z" stroke="#252424" stroke-width="1.6" stroke-linejoin="round"/></svg>
          </div>
          <div class="profile-info-text">
            <p class="profile-info-label">Phone Number</p>
            <p class="profile-info-value" id="profilePhone">+1 (555) 214-7788</p>
          </div>
        </div>

        <div class="profile-info-row">
          <div class="profile-info-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="3.5" y="5" width="17" height="14" rx="2" stroke="#252424" stroke-width="1.6"/><path d="M4 6.5L12 12.5L20 6.5" stroke="#252424" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
          <div class="profile-info-text">
            <p class="profile-info-label">Email Address</p>
            <p class="profile-info-value" id="profileEmail">john.doe@email.com</p>
          </div>
        </div>

      </div>

      <button type="button" class="btn-outline profile-edit-btn" onclick="window.location.href='/Mobile%20app/edit-profile.html'">Edit Contact Details</button>
    </div>
  </div>

<script>
  const initials = (name) => name.split(" ").map((p) => p[0]).join("").toUpperCase();

  const phone = localStorage.getItem("hearo_profile_phone");
  const email = localStorage.getItem("hearo_profile_email");

  if (phone) document.getElementById("profilePhone").textContent = phone;
  if (email) document.getElementById("profileEmail").textContent = email;

  document.getElementById("avatarInitials").textContent = initials(document.getElementById("profileName").textContent);
</script>
</body>
</html>
