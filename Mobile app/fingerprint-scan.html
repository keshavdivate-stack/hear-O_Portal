        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">

<script>
  setTimeout(() => { window.location.href = "/Mobile%20app/fingerprint-failed.html"; }, 2500);
</script>

</html>
