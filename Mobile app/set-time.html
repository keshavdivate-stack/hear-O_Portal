<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HearO - Set Time</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="font-scale.js"></script>
</head>
<body>

  <div class="phone-frame">
    <div class="status-bar">
      <span class="status-time">9:27</span>
      <div class="status-icons">
        <svg width="18" height="12" viewBox="0 0 18 12" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="8" width="3" height="4" rx="0.5" fill="black"/><rect x="4.5" y="6" width="3" height="6" rx="0.5" fill="black"/><rect x="9" y="3" width="3" height="9" rx="0.5" fill="black"/><rect x="13.5" y="0" width="3" height="12" rx="0.5" fill="black"/></svg>
        <svg width="16" height="12" viewBox="0 0 16 12" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M8 10.5C8.6 10.5 9.1 10 9.1 9.4C9.1 8.8 8.6 8.3 8 8.3C7.4 8.3 6.9 8.8 6.9 9.4C6.9 10 7.4 10.5 8 10.5Z" fill="black"/><path d="M8 6.5C9 6.5 9.9 6.9 10.6 7.6L11.6 6.6C10.6 5.6 9.4 5 8 5C6.6 5 5.4 5.6 4.4 6.6L5.4 7.6C6.1 6.9 7 6.5 8 6.5Z" fill="black"/><path d="M8 2.5C10.1 2.5 12 3.3 13.5 4.8L14.5 3.8C12.7 2 10.5 1 8 1C5.5 1 3.3 2 1.5 3.8L2.5 4.8C4 3.3 5.9 2.5 8 2.5Z" fill="black"/></svg>
        <svg width="25" height="12" viewBox="0 0 25 12" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="0.5" y="0.5" width="20" height="11" rx="2.5" stroke="black"/><rect x="2" y="2" width="17" height="8" rx="1.5" fill="black"/><rect x="22" y="4" width="2" height="4" rx="1" fill="black"/></svg>
      </div>
    </div>

    <div class="bp-header">
      <button type="button" class="back-btn" onclick="window.location.href='menu.html'">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M12.5 4L6.5 10L12.5 16" stroke="#2b2b2b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <h1>Set Time</h1>
    </div>

    <div class="settime-body">
      <div class="settime-input">
        <span id="hourValue"></span><span class="caret" id="hourCaret"></span>
        <span class="colon">:</span>
        <span id="minValue"></span><span class="caret" id="minCaret" style="display:none"></span>
      </div>

      <div class="ampm-group">
        <button type="button" class="ampm-pill selected" id="amBtn" onclick="setPeriod('AM')">AM</button>
        <button type="button" class="ampm-pill" id="pmBtn" onclick="setPeriod('PM')">PM</button>
      </div>

      <div class="settime-save-wrap">
        <button type="button" class="bp-save-btn" id="saveBtn" onclick="handleSave()">Save</button>
      </div>
    </div>

    <div class="bp-keypad">
      <button type="button" class="bp-key" onclick="pressKey('1')">1</button>
      <button type="button" class="bp-key" onclick="pressKey('2')">2</button>
      <button type="button" class="bp-key" onclick="pressKey('3')">3</button>
      <button type="button" class="bp-key" onclick="pressKey('4')">4</button>
      <button type="button" class="bp-key" onclick="pressKey('5')">5</button>
      <button type="button" class="bp-key" onclick="pressKey('6')">6</button>
      <button type="button" class="bp-key" onclick="pressKey('7')">7</button>
      <button type="button" class="bp-key" onclick="pressKey('8')">8</button>
      <button type="button" class="bp-key" onclick="pressKey('9')">9</button>
      <span class="bp-key empty"></span>
      <button type="button" class="bp-key" onclick="pressKey('0')">0</button>
      <button type="button" class="bp-key" onclick="pressKey('back')">
        <svg width="24" height="20" viewBox="0 0 24 20" fill="none"><path d="M8 1H21C22.1 1 23 1.9 23 3V17C23 18.1 22.1 19 21 19H8L1 10L8 1Z" stroke="#2b2b2b" stroke-width="1.6" stroke-linejoin="round"/><line x1="11" y1="7" x2="18" y2="13" stroke="#2b2b2b" stroke-width="1.6" stroke-linecap="round"/><line x1="18" y1="7" x2="11" y2="13" stroke="#2b2b2b" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
    </div>
  </div>

<script>
  let buffer = "";
  let period = "AM";

  function setPeriod(p) {
    period = p;
    document.getElementById("amBtn").classList.toggle("selected", p === "AM");
    document.getElementById("pmBtn").classList.toggle("selected", p === "PM");
  }

  function pressKey(key) {
    if (key === "back") {
      buffer = buffer.slice(0, -1);
    } else if (buffer.length < 4) {
      const next = buffer + key;
      if (next.length <= 2) {
        if (parseInt(next, 10) > 12) return;
      } else {
        const minPart = next.slice(2);
        if (parseInt(minPart, 10) > 59) return;
      }
      buffer = next;
    }
    render();
  }

  function render() {
    const hour = buffer.slice(0, 2);
    const min = buffer.slice(2, 4);
    document.getElementById("hourValue").textContent = hour;
    document.getElementById("minValue").textContent = min;

    const hourDone = hour.length === 2;
    document.getElementById("hourCaret").style.display = (!hourDone) ? "inline-block" : "none";
    document.getElementById("minCaret").style.display = (hourDone && min.length < 2) ? "inline-block" : "none";

    document.getElementById("saveBtn").classList.toggle("enabled", buffer.length > 0);
  }

  function handleSave() {
    if (buffer.length === 0) return;
    window.location.href = "menu.html";
  }

  render();
</script>
</body>
</html>
