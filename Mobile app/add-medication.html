<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HearO - Add Medication</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/Mobile%20app/style.css?v=36">
<script src="/Mobile%20app/font-scale.js?v=29"></script>
<style>
  /* Add-medication screen: built from the existing header, input, chip (mx-btn) and login-btn styles. */
  .am-body { flex: 1; overflow-y: auto; padding: 22px 28px 32px; }
  .am-section { margin-bottom: 24px; }
  .am-label { font-size: calc(22px * var(--font-scale, 1)); font-weight: 600; color: #252424; margin-bottom: 12px; }
  .am-label small { font-size: calc(16px * var(--font-scale, 1)); font-weight: 400; color: #6f6f6f; margin-left: 4px; }
  .am-name { position: relative; }
  .am-name input[type="text"] { padding-right: 52px; }
  .am-clear { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); width: 44px; height: 44px; border: none; background: none; display: flex; align-items: center; justify-content: center; color: #6f6f6f; cursor: pointer; }
  .am-chips { display: flex; flex-wrap: wrap; gap: 10px; }
  .am-chip { min-height: 48px; padding: 0 22px; border-radius: 26px; border: 2px solid #d5d5d5; background: #fff; color: #3d3d3d; font-family: inherit; font-size: calc(21px * var(--font-scale, 1)); font-weight: 500; cursor: pointer; }
  .am-chip[aria-pressed="true"] { border-color: #1a6fd4; background: #f4f8fd; color: #1a6fd4; }
  .am-body .login-btn { margin-top: 6px; }
  .am-date-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .am-date-field { min-width: 0; }
  .am-date-field label { display: block; font-size: calc(16px * var(--font-scale, 1)); font-weight: 500; color: #6f6f6f; margin-bottom: 6px; }
  .am-date-field input[type="date"] { min-width: 0; width: 100%; padding: 0 10px; font-size: calc(19px * var(--font-scale, 1)); }
  .am-select { height: 52px; width: 100%; padding: 0 16px; border-radius: 14px; border: 2px solid #d5d5d5; background: #fff; color: #3d3d3d; font-family: inherit; font-size: calc(20px * var(--font-scale, 1)); }
  .am-units-row { display: flex; align-items: center; gap: 12px; }
  .am-units-row input[type="number"] { width: 90px; flex-shrink: 0; text-align: center; }
  .am-units-unit { font-size: calc(19px * var(--font-scale, 1)); color: #6f6f6f; }
</style>
</head>
<body>

  <div class="phone-frame">
    <div class="status-bar">
      <span class="status-time">9:27</span>
      <div class="status-icons">
        <svg width="18" height="12" viewBox="0 0 18 12" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="8" width="3" height="4" rx="0.5" fill="black"/><rect x="4.5" y="6" width="3" height="6" rx="0.5" fill="black"/><rect x="9" y="3" width="3" height="9" rx="0.5" fill="black"/><rect x="13.5" y="0" width="3" height="12" rx="0.5" fill="black"/></svg>
        <svg width="16" height="12" viewBox="0 0 16 12" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M8 10.5C8.6 10.5 9.1 10 9.1 9.4C9.1 8.8 8.6 8.3 8 8.3C7.4 8.3 6.9 8.8 6.9 9.4C6.9 10 7.4 10.5 8 10.5Z" fill="black"/><path d="M8 6.5C9 6.5 9.9 6.9 10.6 7.6L11.6 6.6C10.6 5.6 9.4 5 8 5C6.6 5 5.4 5.6 4.4 6.6L5.4 7.6C6.1 6.9 7 6.5 8 6.5Z" fill="black"/><path d="M8 2.5C10.1 2.5 12 3.3 13.5 4.8L14.5 3.8C12.7 2 10.5 1 8 1C5.5 1 3.3 2 1.5 3.8L2.5 4.8C4 3.3 5.9 2.5 8 2.5Z" fill="black"/></svg>
        <svg width="25" height="12" viewBox="0 0 25 12" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="0.5" y="0.5" width="20" height="11" rx="2.5" stroke="black"/><rect x="2" y="2" width="17" height="8" rx="1.5" fill="black"/><rect x="22" y="4" width="2" height="4" rx="1" fill="black"/></svg>
      </div>
    </div>

    <div class="mx-header">
      <button type="button" class="back-btn" aria-label="Back" onclick="window.location.href='/Mobile%20app/medications.html?tab=mine'">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M12.5 4L6.5 10L12.5 16" stroke="#252424" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <h1>Add medication</h1>
    </div>

    <div class="am-body">

      <div class="am-section">
        <p class="am-label">1. Medication name</p>
        <div class="am-name">
          <input type="text" id="medName" value="Metoprolol" placeholder="Medication name" autocomplete="off" />
          <button type="button" class="am-clear" id="clearName" aria-label="Clear name">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6L18 18M6 18L18 6"/></svg>
          </button>
        </div>
      </div>

      <div class="am-section">
        <p class="am-label">2. Medication form <small>(required)</small></p>
        <div class="am-chips" id="formChips">
          <button type="button" class="am-chip" data-form="Tablet" aria-pressed="true">Tablet</button>
          <button type="button" class="am-chip" data-form="Capsule" aria-pressed="false">Capsule</button>
          <button type="button" class="am-chip" data-form="Drops" aria-pressed="false">Drops</button>
          <button type="button" class="am-chip" data-form="Cream" aria-pressed="false">Cream</button>
          <button type="button" class="am-chip" data-form="Liquid" aria-pressed="false">Liquid</button>
          <button type="button" class="am-chip" data-form="Inhaler" aria-pressed="false">Inhaler</button>
          <button type="button" class="am-chip" data-form="Injection" aria-pressed="false">Injection</button>
          <button type="button" class="am-chip" data-form="Patch" aria-pressed="false">Patch</button>
        </div>
      </div>

      <div class="am-section">
        <p class="am-label">3. Strength <small>(required)</small></p>
        <select class="am-select" id="strengthSelect">
          <option value="">Select strength</option>
          <option>12.5 mg</option>
          <option>25 mg</option>
          <option>50 mg</option>
          <option>100 mg</option>
          <option value="__custom">Custom&hellip;</option>
        </select>
        <div class="am-name" id="strengthCustomWrap" style="margin-top:10px;" hidden>
          <input type="text" id="strengthCustom" placeholder="e.g. 40 mg, 0.5%, 10 mg/mL" autocomplete="off" />
        </div>
      </div>

      <div class="am-section">
        <p class="am-label">4. Number of units <small id="unitsHint">(tablets)</small></p>
        <div class="am-units-row">
          <input type="number" id="medUnits" min="1" value="1" inputmode="numeric" />
          <span class="am-units-unit" id="unitsLabel">tablet(s) per dose</span>
        </div>
      </div>

      <div class="am-section">
        <p class="am-label">5. When to take it <small>(required)</small></p>
        <div class="am-chips" id="whenChips">
          <button type="button" class="am-chip" data-when="morning" aria-pressed="false">Morning</button>
          <button type="button" class="am-chip" data-when="afternoon" aria-pressed="false">Afternoon</button>
          <button type="button" class="am-chip" data-when="evening" aria-pressed="false">Evening</button>
          <button type="button" class="am-chip" data-when="bedtime" aria-pressed="false">Bedtime</button>
        </div>
      </div>

      <div class="am-section">
        <p class="am-label">6. Additional instructions <small>(optional)</small></p>
        <div class="am-chips" id="foodChips">
          <button type="button" class="am-chip" data-food="" aria-pressed="true">No restriction</button>
          <button type="button" class="am-chip" data-food="before" aria-pressed="false">Before food</button>
          <button type="button" class="am-chip" data-food="after" aria-pressed="false">After food</button>
          <button type="button" class="am-chip" data-food="with" aria-pressed="false">With food</button>
        </div>
      </div>

      <div class="am-section">
        <p class="am-label">7. Reason <small>(optional)</small></p>
        <div class="am-name">
          <input type="text" id="medReason" placeholder="e.g. Blood pressure" autocomplete="off" />
        </div>
      </div>

      <div class="am-section">
        <p class="am-label">8. Duration <small>(optional)</small></p>
        <div class="am-date-row">
          <div class="am-date-field">
            <label for="startDate">Start date</label>
            <input type="date" id="startDate" />
          </div>
          <div class="am-date-field">
            <label for="endDate">End date</label>
            <input type="date" id="endDate" />
          </div>
        </div>
      </div>

      <button type="button" class="login-btn" id="nextBtn">Add Medication</button>
    </div>
  </div>

<script>
  // Unit label shown next to "Number of units" changes with the chosen
  // medication form, so a cream reads "application(s)" rather than "tablets".
  const UNIT_LABELS = {
    Tablet: "tablet(s) per dose",
    Capsule: "capsule(s) per dose",
    Drops: "drop(s) per dose",
    Cream: "application(s) per dose",
    Liquid: "mL per dose",
    Inhaler: "puff(s) per dose",
    Injection: "dose(s)",
    Patch: "patch(es)",
  };

  const nameInput = document.getElementById("medName");
  const nextBtn = document.getElementById("nextBtn");
  const strengthSelect = document.getElementById("strengthSelect");
  const strengthCustomWrap = document.getElementById("strengthCustomWrap");
  const strengthCustom = document.getElementById("strengthCustom");
  const unitsHint = document.getElementById("unitsHint");
  const unitsLabel = document.getElementById("unitsLabel");

  function strengthValue() {
    if (strengthSelect.value === "__custom") return strengthCustom.value.trim();
    return strengthSelect.value;
  }

  function check() {
    const hasForm = !!document.querySelector("#formChips [aria-pressed='true']");
    const hasWhen = !!document.querySelector("#whenChips [aria-pressed='true']");
    nextBtn.disabled = !(nameInput.value.trim() && hasForm && strengthValue() && hasWhen);
  }

  nameInput.addEventListener("input", check);
  document.getElementById("clearName").addEventListener("click", () => { nameInput.value = ""; nameInput.focus(); check(); });

  document.querySelectorAll("#formChips .am-chip").forEach((b) => b.addEventListener("click", () => {
    document.querySelectorAll("#formChips .am-chip").forEach((x) => x.setAttribute("aria-pressed", "false"));
    b.setAttribute("aria-pressed", "true");
    unitsHint.textContent = `(${b.dataset.form.toLowerCase()})`;
    unitsLabel.textContent = UNIT_LABELS[b.dataset.form] || "unit(s) per dose";
    check();
  }));

  strengthSelect.addEventListener("change", () => {
    strengthCustomWrap.hidden = strengthSelect.value !== "__custom";
    if (!strengthCustomWrap.hidden) strengthCustom.focus();
    check();
  });
  strengthCustom.addEventListener("input", check);

  // "When to take it" allows more than one time of day (e.g. twice daily).
  document.querySelectorAll("#whenChips .am-chip").forEach((b) => b.addEventListener("click", () => {
    b.setAttribute("aria-pressed", b.getAttribute("aria-pressed") === "true" ? "false" : "true");
    check();
  }));

  // Food instructions are mutually exclusive, with "No restriction" as the default.
  document.querySelectorAll("#foodChips .am-chip").forEach((b) => b.addEventListener("click", () => {
    document.querySelectorAll("#foodChips .am-chip").forEach((x) => x.setAttribute("aria-pressed", "false"));
    b.setAttribute("aria-pressed", "true");
  }));

  nextBtn.addEventListener("click", () => {
    if (nextBtn.disabled) return;
    const outcome = new URLSearchParams(window.location.search).get("outcome");
    window.location.href = outcome === "fail"
      ? "/Mobile%20app/medication-add-failed.html"
      : "/Mobile%20app/medication-add-success.html";
  });

  check();
</script>
</body>
</html>
