<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HearO - Add Medication</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/Mobile%20app/style.css?v=31">
<script src="/Mobile%20app/font-scale.js?v=29"></script>
<style>
  /* Add-medication screen: built from the existing header, input, chip (mx-btn) and login-btn styles. */
  .am-body { flex: 1; overflow-y: auto; padding: 22px 28px 32px; }
  .am-section { margin-bottom: 24px; }
  .am-label { font-size: calc(22px * var(--font-scale, 1)); font-weight: 600; color: #252424; margin-bottom: 12px; }
  .am-label small { font-size: calc(16px * var(--font-scale, 1)); font-weight: 400; color: #6f6f6f; margin-left: 4px; }
  .am-name { position: relative; }
  .am-name input[type="text"] { padding-right: 52px; }
  .am-clear { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); width: 44px; height: 44px; border: none; background: none; display: flex; align-items: center; justify-content: center; color: #6f6f6f; cursor: pointer; }
  .am-chips { display: flex; flex-wrap: wrap; gap: 10px; }
  .am-chip { min-height: 48px; padding: 0 22px; border-radius: 26px; border: 2px solid #d5d5d5; background: #fff; color: #3d3d3d; font-family: inherit; font-size: calc(21px * var(--font-scale, 1)); font-weight: 500; cursor: pointer; }
  .am-chip[aria-pressed="true"] { border-color: #1a6fd4; background: #f4f8fd; color: #1a6fd4; }
  .am-body .login-btn { margin-top: 6px; }
  .am-date-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .am-date-field { min-width: 0; }
  .am-date-field label { display: block; font-size: calc(16px * var(--font-scale, 1)); font-weight: 500; color: #6f6f6f; margin-bottom: 6px; }
  .am-date-field input[type="date"] { min-width: 0; width: 100%; padding: 0 10px; font-size: calc(19px * var(--font-scale, 1)); }
</style>
</head>
<body>

  <div class="phone-frame">
    <div class="status-bar">
      <span class="status-time">9:27</span>
      <div class="status-icons">
        <svg width="18" height="12" viewBox="0 0 18 12" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="8" width="3" height="4" rx="0.5" fill="black"/><rect x="4.5" y="6" width="3" height="6" rx="0.5" fill="black"/><rect x="9" y="3" width="3" height="9" rx="0.5" fill="black"/><rect x="13.5" y="0" width="3" height="12" rx="0.5" fill="black"/></svg>
        <svg width="16" height="12" viewBox="0 0 16 12" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M8 10.5C8.6 10.5 9.1 10 9.1 9.4C9.1 8.8 8.6 8.3 8 8.3C7.4 8.3 6.9 8.8 6.9 9.4C6.9 10 7.4 10.5 8 10.5Z" fill="black"/><path d="M8 6.5C9 6.5 9.9 6.9 10.6 7.6L11.6 6.6C10.6 5.6 9.4 5 8 5C6.6 5 5.4 5.6 4.4 6.6L5.4 7.6C6.1 6.9 7 6.5 8 6.5Z" fill="black"/><path d="M8 2.5C10.1 2.5 12 3.3 13.5 4.8L14.5 3.8C12.7 2 10.5 1 8 1C5.5 1 3.3 2 1.5 3.8L2.5 4.8C4 3.3 5.9 2.5 8 2.5Z" fill="black"/></svg>
        <svg width="25" height="12" viewBox="0 0 25 12" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="0.5" y="0.5" width="20" height="11" rx="2.5" stroke="black"/><rect x="2" y="2" width="17" height="8" rx="1.5" fill="black"/><rect x="22" y="4" width="2" height="4" rx="1" fill="black"/></svg>
      </div>
    </div>

    <div class="mx-header">
      <button type="button" class="back-btn" aria-label="Back" onclick="window.location.href='/Mobile%20app/medication.html'">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M12.5 4L6.5 10L12.5 16" stroke="#252424" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <h1>Add medication</h1>
    </div>

    <div class="am-body">

      <div class="am-section">
        <p class="am-label">1. Medication name</p>
        <div class="am-name">
          <input type="text" id="medName" value="Metoprolol" placeholder="Medication name" autocomplete="off" />
          <button type="button" class="am-clear" id="clearName" aria-label="Clear name">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6L18 18M6 18L18 6"/></svg>
          </button>
        </div>
      </div>

      <div class="am-section">
        <p class="am-label">2. Dose <small>(required)</small></p>
        <div class="am-chips" id="doseChips">
          <button type="button" class="am-chip" aria-pressed="false">12.5 mg</button>
          <button type="button" class="am-chip" aria-pressed="true">25 mg</button>
          <button type="button" class="am-chip" aria-pressed="false">50 mg</button>
          <button type="button" class="am-chip" aria-pressed="false">100 mg</button>
          <button type="button" class="am-chip" aria-pressed="false">Custom</button>
        </div>
      </div>

      <div class="am-section">
        <p class="am-label">3. Reason <small>(optional)</small></p>
        <div class="am-name">
          <input type="text" id="medReason" placeholder="e.g. Blood pressure" autocomplete="off" />
        </div>
      </div>

      <div class="am-section">
        <p class="am-label">4. Duration <small>(optional)</small></p>
        <div class="am-date-row">
          <div class="am-date-field">
            <label for="startDate">Start date</label>
            <input type="date" id="startDate" />
          </div>
          <div class="am-date-field">
            <label for="endDate">End date</label>
            <input type="date" id="endDate" />
          </div>
        </div>
      </div>

      <button type="button" class="login-btn" id="nextBtn">Add Medication</button>
    </div>
  </div>

<script>
  const nameInput = document.getElementById("medName");
  const nextBtn = document.getElementById("nextBtn");
  function check() {
    nextBtn.disabled = !(nameInput.value.trim() && document.querySelector("#doseChips [aria-pressed='true']"));
  }
  nameInput.addEventListener("input", check);
  document.getElementById("clearName").addEventListener("click", () => { nameInput.value = ""; nameInput.focus(); check(); });
  document.querySelectorAll("#doseChips .am-chip").forEach((b) => b.addEventListener("click", () => {
    document.querySelectorAll("#doseChips .am-chip").forEach((x) => x.setAttribute("aria-pressed", "false"));
    b.setAttribute("aria-pressed", "true"); check();
  }));

  nextBtn.addEventListener("click", () => {
    if (nextBtn.disabled) return;
    const outcome = new URLSearchParams(window.location.search).get("outcome");
    window.location.href = outcome === "fail"
      ? "/Mobile%20app/medication-add-failed.html"
      : "/Mobile%20app/medication-add-success.html";
  });

  check();
</script>
</body>
</html>
