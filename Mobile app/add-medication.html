<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HearO - Add Medication</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/Mobile%20app/style.css?v=36">
<script src="/Mobile%20app/font-scale.js?v=29"></script>
<script src="/Mobile%20app/my-meds-store.js?v=2"></script>
<script src="/Mobile%20app/proto-controls.js?v=3" defer></script>
<style>
  /* Add / Edit Medication -- one question per screen (client flow):
     name (typed) -> form -> strength (typed) -> amount -> how often [-> days]
     -> times a day [-> how many] -> all dose times on one screen -> start & end date (one screen)
     -> food, then Save to the separate success screen
     (medication-add-success.html), whose Done returns to My Meds. Steps that don't apply are skipped and single-choice answers
     move on by themselves. Styling uses the app's own fields, chips
     and buttons. */
  .mx-header { padding: 19px 20px; }
  .mx-header h1 { font-size: calc(28px * var(--font-scale, 1)); color: #434141; }

  .st-progress { flex-shrink: 0; padding: 4px 28px 0; }
  .st-progress-text { display: flex; justify-content: flex-end; margin-bottom: 8px; font-size: calc(16px * var(--font-scale, 1)); color: #6F6F6F; }
  .st-track { height: 6px; border-radius: 3px; background: #E3E6EA; overflow: hidden; }
  .st-fill { display: block; height: 100%; border-radius: 3px; background: #186DCE; transition: width 0.25s ease; }

  .am-body { flex: 1; overflow-y: auto; padding: 22px 28px 8px; }
  .am-q { margin: 0 0 18px; font-size: calc(26px * var(--font-scale, 1)); line-height: 1.25; font-weight: 600; color: #252424; }
  .am-hint { margin: -8px 0 16px; font-size: calc(17px * var(--font-scale, 1)); line-height: 1.4; color: #6F6F6F; }

  /* Single-choice answers: big tappable cards with a check when chosen. */
  .am-opt { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; min-height: 64px; margin-bottom: 12px; padding: 12px 18px; border: 1px solid #818080; border-radius: 16px; background: #fff; color: #434141; font-family: inherit; font-size: calc(21px * var(--font-scale, 1)); text-align: left; cursor: pointer; }
  .am-opt-main { display: inline-flex; align-items: center; gap: 12px; }
  .am-opt-check { flex-shrink: 0; width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid #c9cdd3; display: flex; align-items: center; justify-content: center; color: transparent; }
  .am-opt[aria-pressed="true"] { border-color: #186DCE; background: #F0F7FF; color: #186DCE; }
  .am-opt[aria-pressed="true"] .am-opt-check { border-color: #186DCE; background: #186DCE; color: #fff; }

  /* Chips (days of the week, strength units) */
  .am-chips { display: flex; flex-wrap: wrap; gap: 12px; }
  .am-chip { min-width: 64px; height: 48px; padding: 0 18px; border-radius: 24px; border: 1.5px solid #c9cdd3; background: #fff; color: #3D3B3B; font-family: inherit; font-size: calc(19px * var(--font-scale, 1)); cursor: pointer; }
  .am-chip[aria-pressed="true"] { border-color: #1A6FD4; background: #F0F7FF; color: #1A6FD4; font-weight: 600; }

  /* Numeric entry */
  .am-num-row { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .am-num-unit { flex-shrink: 0; min-width: 48px; font-size: calc(23px * var(--font-scale, 1)); font-weight: 600; color: #434141; }
  .am-num-row input { flex: 1; min-width: 0; height: 64px; padding: 0 16px; border: 1px solid #818080; border-radius: 16px; font-family: inherit; font-size: calc(25px * var(--font-scale, 1)); color: #434141; outline: none; -moz-appearance: textfield; }
  .am-num-row input::-webkit-outer-spin-button, .am-num-row input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .am-num-row input:focus { border-color: #4a9fd8; }

  /* +/- counter for amount and number of doses */
  .am-counter { display: flex; align-items: center; justify-content: center; gap: 22px; margin: 26px 0 12px; }
  .am-counter-btn { width: 64px; height: 64px; border-radius: 50%; border: 1.5px solid #186DCE; background: #fff; color: #186DCE; font-family: inherit; font-size: 32px; line-height: 1; cursor: pointer; }
  .am-counter-btn:disabled { border-color: #c9cdd3; color: #A9A8A8; cursor: not-allowed; }
  .am-counter-value { min-width: 130px; text-align: center; font-size: calc(46px * var(--font-scale, 1)); font-weight: 700; color: #252424; line-height: 1.1; }
  .am-counter-value small { display: block; margin-top: 4px; font-size: calc(18px * var(--font-scale, 1)); font-weight: 500; color: #6F6F6F; }
  .am-preview { text-align: center; font-size: calc(18px * var(--font-scale, 1)); color: #6F6F6F; }

  /* Time picker: hour / minute with up/down, AM-PM toggle */
  /* Dose times: every dose on one screen, a row each with its own time. */
  .am-dose-list { display: flex; flex-direction: column; gap: 12px; }
  .am-dose-row { display: flex; align-items: center; gap: 12px; padding: 12px 12px 12px 14px; border: 1px solid #D5D8DE; border-radius: 16px; background: #fff; }
  .am-dose-icon { flex-shrink: 0; width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; }
  .am-dose-icon--day { background: #FEFCE8; color: #D99400; }
  .am-dose-icon--night { background: #F2EDFD; color: #8857FF; }
  .am-dose-text { flex: 1; min-width: 0; }
  .am-dose-label { display: block; font-size: calc(19px * var(--font-scale, 1)); font-weight: 600; color: #434141; }
  .am-dose-part { display: block; margin-top: 2px; font-size: calc(15px * var(--font-scale, 1)); color: #6F6F6F; }
  .am-dose-row input[type="time"] { flex-shrink: 0; width: 148px; height: 52px; padding: 0 10px; border: 1px solid #818080; border-radius: 14px; background: #fff; font-family: inherit; font-size: calc(20px * var(--font-scale, 1)); color: #252424; outline: none; }
  .am-dose-row input[type="time"]:focus { border-color: #4a9fd8; }

  .am-body input[type="date"] { border: 1px solid #818080; font-family: inherit; font-size: calc(21px * var(--font-scale, 1)); }
  .am-body input[type="text"] { border: 1px solid #818080; }
  /* Step 1: search the medication catalog by brand (commercial) or generic (common) name */
  .am-search { position: relative; }
  .am-search svg { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: #818080; pointer-events: none; }
  .am-search input[type="text"] { padding-left: 48px; }
  .am-results { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
  .am-result { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; padding: 12px 16px; border: 1px solid #D5D8DE; border-radius: 16px; background: #fff; font-family: inherit; text-align: left; cursor: pointer; }
  .am-result[aria-pressed="true"] { border-color: #186DCE; background: #F0F7FF; }
  .am-result[aria-pressed="true"] .am-opt-check { border-color: #186DCE; background: #186DCE; color: #fff; }
  .am-result-text { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .am-result-name { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; font-size: calc(20px * var(--font-scale, 1)); font-weight: 600; color: #252424; }
  .am-result-tag { padding: 2px 8px; border-radius: 999px; font-size: calc(13px * var(--font-scale, 1)); font-weight: 600; }
  .am-result-tag--brand { background: #F2EDFD; color: #6B3FD6; }
  .am-result-tag--generic { background: #E8F5EE; color: #1E7A4C; }
  .am-result-sub { font-size: calc(16px * var(--font-scale, 1)); color: #6F6F6F; line-height: 1.35; }
  .am-result-sub b { color: #434141; font-weight: 600; }
  .am-result { padding: 14px 16px; }
  .am-result-name { font-size: calc(19px * var(--font-scale, 1)); }
  .am-result-alt { font-weight: 400; color: #6F6F6F; }
  .am-result--custom .am-result-name { font-weight: 500; color: #186DCE; }
  .am-results-note { margin: 4px 2px 0; font-size: calc(15px * var(--font-scale, 1)); color: #6F6F6F; }
  .am-end-choice .am-chip { flex: 1 1 0; }
  .am-field-error { margin: 8px 0 0; font-size: calc(16px * var(--font-scale, 1)); color: #9F1C3B; }
  .am-field-error[hidden] { display: none; }
  .am-date-label { display: block; margin: 6px 0 8px; font-size: calc(17px * var(--font-scale, 1)); color: #6F6F6F; }

  .am-food-icon { flex-shrink: 0; width: 32px; height: 32px; border-radius: 10px; background: #F0F7FF; color: #186DCE; display: flex; align-items: center; justify-content: center; }

  /* One screen per dose time: big time box, AM / PM, number keypad */
  .am-time-box { width: 190px; height: 80px; margin: 22px auto 18px; display: flex; align-items: center; justify-content: center; border: 2px solid #186DCE; border-radius: 18px; font-size: calc(40px * var(--font-scale, 1)); font-weight: 500; color: #252424; letter-spacing: 1px; font-variant-numeric: tabular-nums; }
  .am-time-box.is-empty { color: #A9A8A8; }
  .am-ampm { display: flex; justify-content: center; gap: 20px; margin-bottom: 24px; }
  .am-ampm button { width: 88px; height: 52px; border: 2px solid transparent; border-radius: 26px; background: #EFF0F2; color: #434141; font-family: inherit; font-size: calc(20px * var(--font-scale, 1)); font-weight: 500; cursor: pointer; }
  .am-ampm button[aria-pressed="true"] { border-color: #186DCE; background: #fff; color: #186DCE; font-weight: 600; }
  .am-keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .am-key { height: 64px; border: none; border-radius: 14px; background: #E8EAED; color: #252424; font-family: inherit; font-size: calc(30px * var(--font-scale, 1)); font-weight: 500; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .am-key:active { background: #D5D8DE; }
  .am-key--blank { visibility: hidden; }
  .am-ampm button:focus-visible, .am-key:focus-visible { outline: 3px solid #0B3E78; outline-offset: 2px; }
  .am-time-error { margin: -6px 0 14px; text-align: center; font-size: calc(16px * var(--font-scale, 1)); color: #9F1C3B; }
  .am-footer { flex-shrink: 0; display: flex; gap: 12px; padding: 14px 28px 32px; background: #fff; }
  .am-footer .login-btn { margin-top: 0; flex: 1 1 0; min-width: 0; height: 56px; font-size: calc(22px * var(--font-scale, 1)); }
  .st-back-btn { flex: 1 1 0; min-width: 0; height: 56px; border: 1.5px solid #186DCE; border-radius: 28px; background: #fff; color: #186DCE; font-family: inherit; font-size: calc(22px * var(--font-scale, 1)); font-weight: 500; cursor: pointer; }
  .st-back-btn[hidden] { display: none; }
  /* Back and Next share the row equally (same padding so widths match). */
  .am-footer > button { flex: 1 1 0; box-sizing: border-box; padding: 0 12px; }
</style>
</head>
<body>

  <div class="phone-frame">
    <div class="status-bar">
      <span class="status-time">9:27</span>
      <div class="status-icons">
        <svg width="18" height="12" viewBox="0 0 18 12" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="8" width="3" height="4" rx="0.5" fill="black"/><rect x="4.5" y="6" width="3" height="6" rx="0.5" fill="black"/><rect x="9" y="3" width="3" height="9" rx="0.5" fill="black"/><rect x="13.5" y="0" width="3" height="12" rx="0.5" fill="black"/></svg>
        <svg width="16" height="12" viewBox="0 0 16 12" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M8 10.5C8.6 10.5 9.1 10 9.1 9.4C9.1 8.8 8.6 8.3 8 8.3C7.4 8.3 6.9 8.8 6.9 9.4C6.9 10 7.4 10.5 8 10.5Z" fill="black"/><path d="M8 6.5C9 6.5 9.9 6.9 10.6 7.6L11.6 6.6C10.6 5.6 9.4 5 8 5C6.6 5 5.4 5.6 4.4 6.6L5.4 7.6C6.1 6.9 7 6.5 8 6.5Z" fill="black"/><path d="M8 2.5C10.1 2.5 12 3.3 13.5 4.8L14.5 3.8C12.7 2 10.5 1 8 1C5.5 1 3.3 2 1.5 3.8L2.5 4.8C4 3.3 5.9 2.5 8 2.5Z" fill="black"/></svg>
        <svg width="25" height="12" viewBox="0 0 25 12" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="0.5" y="0.5" width="20" height="11" rx="2.5" stroke="black"/><rect x="2" y="2" width="17" height="8" rx="1.5" fill="black"/><rect x="22" y="4" width="2" height="4" rx="1" fill="black"/></svg>
      </div>
    </div>

    <div class="mx-header">
      <button type="button" class="back-btn" aria-label="Back" id="headerBack">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M12.5 4L6.5 10L12.5 16" stroke="#252424" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <h1 id="pageTitle">Add Medication</h1>
    </div>

    <div class="st-progress">
      <div class="st-progress-text"><span id="stepCount">Step 1</span></div>
      <div class="st-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="stepTrack"><span class="st-fill" id="stepFill"></span></div>
    </div>

    <div class="am-body" id="stepBody"></div>

    <div class="am-footer">
      <button type="button" class="st-back-btn" id="prevBtn">Back</button>
      <button type="button" class="login-btn" id="nextBtn">Next</button>
    </div>
  </div>

<script>
  /* ---------- answer options ---------- */
  const FORMS = [["pill", "Tablet / Capsule"], ["liquid", "Liquid"], ["injection", "Injection"], ["other", "Other"]];
  const UNITS = { pill: ["tablet", "tablets"], liquid: ["mL", "mL"], drops: ["drop", "drops"], inhaler: ["puff", "puffs"], injection: ["injection", "injections"], cream: ["application", "applications"], patch: ["patch", "patches"], other: ["unit", "units"] };
  /* The strength unit follows the form: tablet -> mg, liquid -> mL, ... (no unit to pick). */
  const STRENGTH_UNIT = { pill: "mg", liquid: "mL", drops: "mL", inhaler: "mcg", injection: "mg", cream: "%", patch: "mg", other: "mg" };
  const strengthUnit = (w) => STRENGTH_UNIT[w.form] || "mg";
  const FREQ = [["daily", "Every day"], ["other", "Every other day"], ["days", "On specific days of the week"]];
  const COUNTS = [[1, "Once a day"], [2, "Twice a day"], [3, "Three times a day"], ["more", "More than 3 times a day"]];
  const DEFAULT_TIMES = { 1: ["08:00"], 2: ["08:00", "20:00"], 3: ["08:00", "14:00", "20:00"], 4: ["08:00", "12:00", "16:00", "20:00"] };
  const FOODS = [["before", "Before food"], ["with", "With food"], ["after", "After food"], ["", "Doesn't matter"]];
  const DAYS = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
  const TODAY_ISO = "2026-08-18"; // the prototype's fixed "today"

  /* Medication catalog: each generic (common) name with its brand (commercial)
     names. Patients search by whichever is on their box; both are saved. */
  const CATALOG = [
    ["Metoprolol", ["Lopressor", "Toprol-XL"]],
    ["Furosemide", ["Lasix"]],
    ["Carvedilol", ["Coreg"]],
    ["Spironolactone", ["Aldactone"]],
    ["Sacubitril / Valsartan", ["Entresto"]],
    ["Lisinopril", ["Zestril", "Prinivil"]],
    ["Losartan", ["Cozaar"]],
    ["Torsemide", ["Demadex", "Soaanz"]],
    ["Bumetanide", ["Bumex"]],
    ["Eplerenone", ["Inspra"]],
    ["Dapagliflozin", ["Farxiga"]],
    ["Empagliflozin", ["Jardiance"]],
    ["Digoxin", ["Lanoxin"]],
    ["Ivabradine", ["Corlanor"]],
    ["Hydrochlorothiazide", ["Microzide"]],
    ["Amlodipine", ["Norvasc"]],
    ["Atorvastatin", ["Lipitor"]],
    ["Rosuvastatin", ["Crestor"]],
    ["Apixaban", ["Eliquis"]],
    ["Rivaroxaban", ["Xarelto"]],
    ["Warfarin", ["Coumadin", "Jantoven"]],
    ["Aspirin", ["Bayer", "Ecotrin"]],
    ["Clopidogrel", ["Plavix"]],
    ["Metformin", ["Glucophage"]],
    ["Ibuprofen", ["Advil", "Motrin"]],
    ["Acetaminophen", ["Tylenol"]],
  ].map(([generic, brands]) => ({ generic, brands }));

  /* Matches for what the patient typed: a brand match shows that brand first
     (with its generic name under it); a generic match lists its brands. */
  function searchCatalog(q) {
    q = q.trim().toLowerCase();
    if (!q) return [];
    const out = [];
    CATALOG.forEach((m) => {
      const brand = m.brands.find((b) => b.toLowerCase().includes(q));
      if (brand) out.push({ generic: m.generic, brand, brands: m.brands, by: "brand", rank: brand.toLowerCase().startsWith(q) ? 0 : 1 });
      else if (m.generic.toLowerCase().includes(q)) out.push({ generic: m.generic, brand: "", brands: m.brands, by: "generic", rank: m.generic.toLowerCase().startsWith(q) ? 0 : 1 });
    });
    return out.sort((a, b) => a.rank - b.rank).slice(0, 6);
  }
  /* How the medication reads everywhere else in the app: "Brand (Generic)" or just the generic name. */
  const medLabel = (generic, brand) => (brand ? `${brand} (${generic})` : generic);

  const ICONS = {
    pill: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 3.5 3.5 10.5a4.95 4.95 0 0 0 7 7l7-7a4.95 4.95 0 0 0-7-7z"/><path d="M7 7l7 7"/></svg>`,
    check: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>`,
    sun: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>`,
    moon: `<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>`,
    food: `<svg width="22" height="19" viewBox="0 0 24 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4.5h11.5"/><ellipse cx="18.6" cy="4.5" rx="2.6" ry="1.7"/><path d="M2.5 9.5h19"/><path d="M3.4 9.5c.5 4.4 3.1 7.6 6.6 8h4c3.5-.4 6.1-3.6 6.6-8"/><path d="M9.5 17.9h5"/></svg>`,
    calendar: `<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="2"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg>`,
    repeat: `<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a3 3 0 0 1 3-3h15"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/></svg>`,
    up: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg>`,
    down: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>`,
    chevron: `<svg width="11" height="19" viewBox="0 0 11 19" fill="none"><path d="M1.5 1.5L9 9.5L1.5 17.5" stroke="#A9A8A8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  };

  /* Patient-added medications that can be edited (?edit=<slug>): the shared
     My Meds store (my-meds-store.js), keyed by the same slug as the list and details. */
  const MY_MEDS = MyMeds.all();

  /* ---------- helpers ---------- */
  const params = new URLSearchParams(window.location.search);
  const editKey = MY_MEDS[params.get("edit")] ? params.get("edit") : null;
  const esc = (v) => String(v).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const pad = (n) => String(n).padStart(2, "0");
  const fmtTime = (hhmm) => { const [h, m] = hhmm.split(":").map(Number); return `${h % 12 || 12}:${pad(m)} ${h < 12 ? "AM" : "PM"}`; };
  const fmtDate = (iso) => new Date(`${iso}T00:00`).toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric", year: "numeric" });
  const isNight = (hhmm) => { const h = Number(hhmm.split(":")[0]); return h < 6 || h >= 18; };
  const partOfDay = (hhmm) => { const h = Number(hhmm.split(":")[0]); return h < 5 ? "Night" : h < 12 ? "Morning" : h < 17 ? "Afternoon" : h < 21 ? "Evening" : "Bedtime"; };
  const ordinal = (i) => ["1st", "2nd", "3rd", "4th", "5th", "6th", "7th", "8th"][i];
  const unitWord = (w) => { const u = UNITS[w.form || "pill"] || UNITS.other; return w.amt === 1 ? u[0] : u[1]; };
  function defaultTimes(n) {
    if (DEFAULT_TIMES[n]) return DEFAULT_TIMES[n].slice();
    const step = Math.round(720 / (n - 1) / 5) * 5; // spread 8 AM - 8 PM
    return Array.from({ length: n }, (_, i) => { const t = 480 + i * step; return `${pad(Math.floor(t / 60))}:${pad(t % 60)}`; });
  }
  const formOptions = () => FORMS;

  /* ---------- wizard state ---------- */
  const w = editKey
    ? Object.assign({ durMode: MY_MEDS[editKey].end ? "until" : "none", edit: true }, JSON.parse(JSON.stringify(MY_MEDS[editKey])))
    : { name: "", query: "", generic: "", brand: "", picked: false, form: "", strength: "", amt: 1, freq: "", days: [], start: TODAY_ISO, count: 0, more: false, times: [], durMode: "none", end: "", food: null, edit: false };
  // Strength is kept as a number + unit ("1000 IU").
  w.strNum = w.strength ? String(parseFloat(w.strength) || "") : "";
  let stepKey = w.edit ? "form" : "name";

  /* The steps that apply right now, in order. */
  function steps() {
    const a = w.edit ? [] : ["name"];
    if (formOptions(w).length > 1) a.push("form");
    a.push("strength", "dose", "freq");
    if (w.freq === "days") a.push("days");
    a.push("count");
    if (w.more) a.push("many");
    for (let i = 0; i < w.count; i++) a.push(`time${i}`);
    a.push("dur", "food");
    return a;
  }

  /* Whether the current step has an answer (enables Next). */
  function stepDone(k) {
    if (k === "name") return w.picked && !!w.name.trim();
    if (k === "form") return !!w.form && (w.form !== "other" || !!(w.formOther || "").trim());
    if (k === "strength") return parseFloat(w.strNum) > 0;
    if (k === "freq") return !!w.freq;
    if (k === "days") return w.days.length > 0;
    if (k === "count") return w.count > 0;
    if (/^time\d+$/.test(k)) return timeValid(timeState(Number(k.slice(4))));
    if (k === "dur") return !!w.start && (w.durMode === "none" || (w.durMode === "until" && !!w.end && w.end >= w.start));
    return true;
  }

  const opt = (attr, value, label, on, icon = "") => `
    <button type="button" class="am-opt" ${attr}="${esc(value)}" aria-pressed="${on}">
      <span class="am-opt-main">${icon}<span>${label}</span></span>
      <span class="am-opt-check">${ICONS.check}</span>
    </button>`;

  /* ---------- Step 1: catalog results ---------- */
  function resultsHtml() {
    const q = (w.query || "").trim();
    if (!q) return `<p class="am-results-note">Start typing to search the medication list.</p>`;
    const rows = searchCatalog(q).map((r) => {
      const on = w.picked && w.generic === r.generic && w.brand === r.brand;
      // One line: the name the patient searched, the other name in grey
      const name = r.by === "brand"
        ? `${esc(r.brand)} <span class="am-result-alt">${esc(r.generic)}</span>`
        : `${esc(r.generic)} <span class="am-result-alt">${esc(r.brands[0])}</span>`;
      return `
        <button type="button" class="am-result" role="option" data-generic="${esc(r.generic)}" data-brand="${esc(r.brand)}" aria-pressed="${on}">
          <span class="am-result-text"><span class="am-result-name">${name}</span></span>
          <span class="am-opt-check">${ICONS.check}</span>
        </button>`;
    });
    const customOn = w.picked && !w.generic && w.name === q;
    rows.push(`
        <button type="button" class="am-result am-result--custom" role="option" data-custom="1" aria-pressed="${customOn}">
          <span class="am-result-text"><span class="am-result-name">Use "${esc(q)}"</span></span>
          <span class="am-opt-check">${ICONS.check}</span>
        </button>`);
    return rows.join("");
  }
  function refreshResults() {
    const box = document.getElementById("medResults");
    if (box) box.innerHTML = resultsHtml();
    document.getElementById("nextBtn").disabled = !stepDone("name");
  }

  /* ---------- Dose time keypad ----------
     Digits fill hh:mm (12-hour); AM / PM picks the half of the day. The
     dose's preset time shows first, and the first key typed replaces it. */
  const pad2 = (n) => String(n).padStart(2, "0");
  w.tk = w.tk || {};
  function timeState(i) {
    if (!w.tk[i]) {
      const [h, m] = (w.times[i] || "08:00").split(":").map(Number);
      w.tk[i] = { buf: pad2(h % 12 || 12) + pad2(m), pm: h >= 12, fresh: true };
    }
    return w.tk[i];
  }
  const timeText = (buf) => { const d = (buf + "____").slice(0, 4); return `${d.slice(0, 2)}:${d.slice(2)}`.replace(/_/g, " "); };
  function timeValid(st) {
    if (st.buf.length !== 4) return false;
    const h = Number(st.buf.slice(0, 2)), m = Number(st.buf.slice(2));
    return h >= 1 && h <= 12 && m <= 59;
  }
  function commitTime(i) {
    const st = timeState(i);
    if (!timeValid(st)) return;
    let h = Number(st.buf.slice(0, 2)) % 12;
    if (st.pm) h += 12;
    w.times[i] = `${pad2(h)}:${st.buf.slice(2)}`;
  }
  function refreshTime(i) {
    const st = timeState(i);
    const box = document.getElementById("timeBox");
    box.textContent = st.buf ? timeText(st.buf) : " : ";
    box.classList.toggle("is-empty", !st.buf);
    document.querySelectorAll("[data-ampm]").forEach((b) => b.setAttribute("aria-pressed", String((b.dataset.ampm === "pm") === st.pm)));
    const err = document.getElementById("timeError");
    const bad = st.buf.length === 4 && !timeValid(st);
    err.hidden = !bad;
    commitTime(i);
    document.getElementById("nextBtn").disabled = !timeValid(st);
  }
  function timeKey(i, key) {
    const st = timeState(i);
    if (key === "back") { st.fresh = false; st.buf = st.buf.slice(0, -1); }
    else if (key === "am" || key === "pm") st.pm = key === "pm";
    else {
      if (st.fresh || st.buf.length >= 4) st.buf = "";
      st.fresh = false;
      // A first digit above 1 can only be a one-digit hour: 7 -> 07
      if (st.buf.length === 0 && Number(key) > 1) st.buf = "0" + key;
      else st.buf += key;
    }
    refreshTime(i);
  }

  /* ---------- render one step ---------- */
  function render() {
    const list = steps();
    if (!list.includes(stepKey)) stepKey = list[Math.min(list.length - 1, 0)];
    const idx = list.indexOf(stepKey);
    const k = stepKey;
    let h = "";

    if (k === "name") {
      h = `<h2 class="am-q">Which medication do you want to add?</h2>
        <p class="am-hint">Search by the name on the box, brand or generic.</p>
        <div class="am-search">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.5-4.5"/></svg>
          <input type="text" id="nameInput" placeholder="e.g. Metoprolol or Toprol-XL" autocomplete="off" value="${esc(w.query || w.name)}" aria-label="Search medication" aria-controls="medResults" />
        </div>
        <div class="am-results" id="medResults" role="listbox" aria-label="Medication catalog">${resultsHtml()}</div>`;
    } else if (k === "form") {
      h = `<h2 class="am-q">What form is ${esc(w.name)}?</h2>` + formOptions(w).map(([v, l]) => opt("data-form", v, l, w.form === v)).join("") +
        (w.form === "other" ? `<label class="am-date-label" for="formOtherInput">Type the form</label><input type="text" id="formOtherInput" placeholder="e.g. Inhaler, Cream, Drops" autocomplete="off" value="${esc(w.formOther || "")}" />` : "");
    } else if (k === "strength") {
      h = `<h2 class="am-q">What is the strength?</h2>
        <p class="am-hint">It's written on the box or label, for example 40 ${strengthUnit(w)}.</p>
        <div class="am-num-row"><input type="number" id="strengthInput" min="0" step="any" inputmode="decimal" placeholder="e.g. 40" value="${esc(w.strNum || "")}" aria-label="Strength in ${strengthUnit(w)}" /><span class="am-num-unit">${strengthUnit(w)}</span></div>`;
    } else if (k === "dose") {
      const minAmt = w.form === "pill" ? 0.5 : 1;
      h = `<h2 class="am-q">How much do you take each time?</h2>
        <div class="am-counter">
          <button type="button" class="am-counter-btn" data-amt="-1" aria-label="Less" ${w.amt <= minAmt ? "disabled" : ""}>&minus;</button>
          <div class="am-counter-value" aria-live="polite">${w.amt}<small>${unitWord(w)}</small></div>
          <button type="button" class="am-counter-btn" data-amt="1" aria-label="More" ${w.amt >= 20 ? "disabled" : ""}>+</button>
        </div>
`;
    } else if (k === "freq") {
      h = `<h2 class="am-q">How often do you take it?</h2>` + FREQ.map(([v, l]) => opt("data-freq", v, l, w.freq === v)).join("");
    } else if (k === "days") {
      h = `<h2 class="am-q">On which days?</h2><p class="am-hint">Choose all that apply.</p>
        <div class="am-chips">${DAYS.map((d) => `<button type="button" class="am-chip" data-day="${d}" aria-pressed="${w.days.includes(d)}">${d}</button>`).join("")}</div>`;
    } else if (k === "count") {
      h = `<h2 class="am-q">How many times a day?</h2>` + COUNTS.map(([v, l]) => opt("data-count", v, l, v === "more" ? w.more : !w.more && w.count === v)).join("");
    } else if (k === "many") {
      h = `<h2 class="am-q">How many times a day?</h2>
        <div class="am-counter">
          <button type="button" class="am-counter-btn" data-many="-1" aria-label="Fewer" ${w.count <= 4 ? "disabled" : ""}>&minus;</button>
          <div class="am-counter-value" aria-live="polite">${w.count}<small>times a day</small></div>
          <button type="button" class="am-counter-btn" data-many="1" aria-label="More" ${w.count >= 8 ? "disabled" : ""}>+</button>
        </div>`;
    } else if (/^time\d+$/.test(k)) {
      const i = Number(k.slice(4));
      const st = timeState(i);
      const keys = ["1", "2", "3", "4", "5", "6", "7", "8", "9", "", "0", "back"];
      h = `<h2 class="am-q">${w.count > 1 ? `What time do you take the ${ordinal(i)} dose?` : "What time do you take it?"}</h2>
        <div class="am-time-box${st.buf ? "" : " is-empty"}" id="timeBox" role="textbox" aria-live="polite" aria-label="${w.count > 1 ? `${ordinal(i)} dose` : "Dose"} time">${st.buf ? timeText(st.buf) : " : "}</div>
        <p class="am-time-error" id="timeError" hidden>Enter a time like 08:30</p>
        <div class="am-ampm" role="radiogroup" aria-label="AM or PM">
          <button type="button" data-ampm="am" role="radio" aria-pressed="${!st.pm}">AM</button>
          <button type="button" data-ampm="pm" role="radio" aria-pressed="${st.pm}">PM</button>
        </div>
        <div class="am-keypad">${keys.map((kk) => kk === ""
          ? `<span class="am-key am-key--blank" aria-hidden="true"></span>`
          : kk === "back"
            ? `<button type="button" class="am-key" data-tkey="back" aria-label="Delete"><svg width="30" height="22" viewBox="0 0 30 22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M9 1h18a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H9L1 11z"/><path d="M14 7l8 8M22 7l-8 8"/></svg></button>`
            : `<button type="button" class="am-key" data-tkey="${kk}">${kk}</button>`).join("")}</div>`;
    } else if (k === "times") {
      h = `<h2 class="am-q">${w.count > 1 ? "What time do you take each dose?" : "What time do you take it?"}</h2>
        <p class="am-hint">You'll get a reminder at ${w.count > 1 ? "each of these times" : "this time"}. Tap a time to change it.</p>
        <div class="am-dose-list">${w.times.map((t, i) => {
          const night = isNight(t);
          return `
          <label class="am-dose-row">
            <span class="am-dose-icon ${night ? "am-dose-icon--night" : "am-dose-icon--day"}">${night ? ICONS.moon : ICONS.sun}</span>
            <span class="am-dose-text">
              <span class="am-dose-label">${w.count > 1 ? `${ordinal(i)} dose` : "Dose"}</span>
              <span class="am-dose-part" data-part-for="${i}">${partOfDay(t)}</span>
            </span>
            <input type="time" data-time-index="${i}" value="${t}" step="300" aria-label="${w.count > 1 ? `${ordinal(i)} dose` : "Dose"} time" />
          </label>`;
        }).join("")}</div>`;
    } else if (k === "dur") {
      h = `<h2 class="am-q">How long will you take it?</h2>
        <p class="am-hint">${w.freq === "other" ? "You'll take it on the start date, then every other day." : "Choose the day you start, and when you stop."}</p>
        <label class="am-date-label" for="startInput">Start date</label>
        <input type="date" id="startInput" value="${w.start}" aria-label="Start date" />
        <p class="am-date-label" style="margin-top:22px;">End date</p>
        <div class="am-chips am-end-choice" role="radiogroup" aria-label="End date">
          <button type="button" class="am-chip" data-dur="none" role="radio" aria-pressed="${w.durMode === "none"}">No end date</button>
          <button type="button" class="am-chip" data-dur="until" role="radio" aria-pressed="${w.durMode === "until"}">Pick a date</button>
        </div>
        ${w.durMode === "until" ? `<input type="date" id="endInput" value="${w.end}" min="${w.start}" aria-label="End date" style="margin-top:14px;" />
          <p class="am-field-error" id="endError" ${w.end && w.end < w.start ? "" : "hidden"}>End date can't be before the start date.</p>` : ""}`;
    } else if (k === "food") {
      h = `<h2 class="am-q">Should it be taken with food?</h2><p class="am-hint">Optional, follow what's on the label.</p>` +
        FOODS.map(([v, l]) => opt("data-food", v, l, w.food === v, v ? `<span class="am-food-icon">${ICONS.food}</span>` : "")).join("");
    }

    document.getElementById("stepBody").innerHTML = h;
    document.getElementById("stepBody").scrollTop = 0;

    // progress + footer
    const pct = Math.round(((idx + 1) / list.length) * 100);
    document.getElementById("stepFill").style.width = `${pct}%`;
    document.getElementById("stepTrack").setAttribute("aria-valuenow", pct);
    // No "of N": the total changes as answers add or remove questions.
    document.getElementById("stepCount").textContent = `Step ${idx + 1}`;
    document.getElementById("prevBtn").hidden = idx === 0;
    const next = document.getElementById("nextBtn");
    // Food is the last question and optional, so its button saves.
    next.textContent = k === "food" ? (w.edit ? "Save changes" : "Save") : "Next";
    next.disabled = !stepDone(k);

    const field = document.getElementById(k === "name" ? "nameInput" : k === "strength" ? "strengthInput" : "");
    if (field) field.focus();
  }

  /* ---------- navigation ---------- */
  function go(delta) {
    const list = steps();
    const i = list.indexOf(stepKey);
    stepKey = list[Math.max(0, Math.min(list.length - 1, i + delta))];
    render();
  }
  const advance = () => go(1);
  let advancing = false;
  const autoAdvance = () => {
    if (advancing) return;
    advancing = true;
    render();
    setTimeout(() => { advancing = false; advance(); }, 220);
  };

  function exit() {
    window.location.href = w.edit ? `/Mobile%20app/medication-details.html?med=${editKey}` : "/Mobile%20app/medications.html?tab=mine";
  }

  function save() {
    w.name = w.name.trim();
    if (params.get("outcome") === "fail") { window.location.href = "/Mobile%20app/medication-add-failed.html"; return; }
    const rec = {
      name: w.name, generic: w.generic || "", brand: w.brand || "", form: w.form, formOther: w.form === "other" ? (w.formOther || "").trim() : "", strength: w.strength, amt: w.amt, freq: w.freq, days: w.freq === "days" ? w.days.slice() : [],
      start: w.start, count: w.count, more: w.more, times: w.times.slice(), end: w.durMode === "until" ? w.end : "", food: w.food,
    };
    if (w.edit) {
      MyMeds.update(editKey, rec);
      window.location.href = `/Mobile%20app/medication-details.html?med=${editKey}&saved=1`;
      return;
    }
    const slug = MyMeds.add(rec);
    window.location.href = `/Mobile%20app/medication-add-success.html?${new URLSearchParams({ name: w.name, med: slug })}`;
  }

  // Start / end date edits update Next and the end-date check without re-rendering
  // (so the date picker keeps focus).
  function syncDates() {
    const err = document.getElementById("endError");
    if (err) err.hidden = !(w.durMode === "until" && w.end && w.end < w.start);
    document.getElementById("nextBtn").disabled = !stepDone("dur");
  }

  /* ---------- events ---------- */
  document.getElementById("stepBody").addEventListener("input", (e) => {
    if (e.target.id === "nameInput") {
      // Typing again clears the earlier pick until a result is chosen.
      w.query = e.target.value; w.name = ""; w.generic = ""; w.brand = ""; w.picked = false;
      refreshResults();
    }
    if (e.target.id === "formOtherInput") { w.formOther = e.target.value; document.getElementById("nextBtn").disabled = !stepDone("form"); }
    if (e.target.id === "strengthInput") {
      w.strNum = e.target.value;
      w.strength = parseFloat(w.strNum) > 0 ? `${w.strNum} ${strengthUnit(w)}` : "";
      document.getElementById("nextBtn").disabled = !stepDone("strength");
    }
    if (e.target.id === "startInput") {
      w.start = e.target.value;
      const end = document.getElementById("endInput");
      if (end) end.min = w.start;
      syncDates();
    }
    if (e.target.dataset.timeIndex !== undefined && e.target.value) {
      const i = Number(e.target.dataset.timeIndex);
      w.times[i] = e.target.value;
      const row = e.target.closest(".am-dose-row");
      const night = isNight(e.target.value);
      const icon = row.querySelector(".am-dose-icon");
      icon.className = `am-dose-icon ${night ? "am-dose-icon--night" : "am-dose-icon--day"}`;
      icon.innerHTML = night ? ICONS.moon : ICONS.sun;
      row.querySelector(".am-dose-part").textContent = partOfDay(e.target.value);
    }
    if (e.target.id === "endInput") { w.end = e.target.value; syncDates(); }
  });

  document.getElementById("stepBody").addEventListener("click", (e) => {
    const t = e.target.closest("button");
    if (!t) return;
    const d = t.dataset;
    if ((d.tkey || d.ampm) && /^time\d+$/.test(stepKey)) { timeKey(Number(stepKey.slice(4)), d.tkey || d.ampm); return; }
    if (d.generic !== undefined || d.custom) {
      if (d.custom) { w.generic = ""; w.brand = ""; w.name = (w.query || "").trim(); }
      else { w.generic = d.generic; w.brand = d.brand; w.name = medLabel(d.generic, d.brand); }
      w.picked = true;
      refreshResults();
      return;
    }
    if (d.form) {
      w.form = d.form; w.amt = 1;
      if (parseFloat(w.strNum) > 0) w.strength = `${w.strNum} ${strengthUnit(w)}`;
      // Other: stay here and type the form
      if (d.form === "other") { render(); document.getElementById("formOtherInput")?.focus(); return; }
      w.formOther = "";
      return autoAdvance();
    }
    if (d.sunit) {
      w.strUnit = d.sunit;
      w.strength = parseFloat(w.strNum) > 0 ? `${w.strNum} ${w.strUnit}` : "";
      document.querySelectorAll("[data-sunit]").forEach((b) => b.setAttribute("aria-pressed", String(b === t)));
      return;
    }
    if (d.amt) {
      const step = w.form === "pill" ? 0.5 : 1;
      w.amt = Math.max(step, Math.min(20, +(w.amt + Number(d.amt) * step).toFixed(1)));
      return render();
    }
    if (d.freq) { w.freq = d.freq; return autoAdvance(); }
    if (d.day) { const i = w.days.indexOf(d.day); i >= 0 ? w.days.splice(i, 1) : w.days.push(d.day); w.days.sort((a, b) => DAYS.indexOf(a) - DAYS.indexOf(b)); return render(); }
    if (d.count) {
      const prev = w.count;
      w.more = d.count === "more";
      w.count = w.more ? Math.max(4, w.count) : Number(d.count);
      if (w.count !== prev || w.times.length !== w.count) { w.times = defaultTimes(w.count); w.tk = {}; }
      return autoAdvance();
    }
    if (d.many) { w.count = Math.max(4, Math.min(8, w.count + Number(d.many))); w.times = defaultTimes(w.count); w.tk = {}; return render(); }
    if (d.dur) {
      w.durMode = d.dur;
      if (d.dur === "none") { w.end = ""; return render(); }
      if (!w.end) { const e2 = new Date(`${w.start < TODAY_ISO ? TODAY_ISO : w.start}T00:00`); e2.setDate(e2.getDate() + 30); w.end = `${e2.getFullYear()}-${pad(e2.getMonth() + 1)}-${pad(e2.getDate())}`; }
      return render();
    }
    if (d.food !== undefined) { w.food = d.food; return render(); }
  });

  document.getElementById("stepBody").addEventListener("keydown", (e) => {
    if (e.key === "Enter" && e.target.matches("input")) { e.preventDefault(); document.getElementById("nextBtn").click(); }
  });

  document.addEventListener("keydown", (e) => {
    if (!/^time\d+$/.test(stepKey)) return;
    const i = Number(stepKey.slice(4));
    if (/^\d$/.test(e.key)) { e.preventDefault(); timeKey(i, e.key); }
    else if (e.key === "Backspace") { e.preventDefault(); timeKey(i, "back"); }
    else if (e.key === "a" || e.key === "A") timeKey(i, "am");
    else if (e.key === "p" || e.key === "P") timeKey(i, "pm");
    else if (e.key === "Enter") document.getElementById("nextBtn").click();
  });

  document.getElementById("nextBtn").addEventListener("click", () => {
    if (!stepDone(stepKey)) return;
    if (stepKey === "food") return save();
    advance();
  });
  document.getElementById("prevBtn").addEventListener("click", () => go(-1));
  document.getElementById("headerBack").addEventListener("click", () => {
    if (steps().indexOf(stepKey) === 0) return exit();
    go(-1);
  });

  if (w.edit) {
    document.title = "HearO - Edit Medication";
    document.getElementById("pageTitle").textContent = `Edit ${w.name}`;
  }
  if (!steps().includes(stepKey)) stepKey = steps()[0];
  render();
</script>
</body>
</html>
