<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HearO - Menu</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="phone-frame">
    <div class="status-bar">
      <span class="status-time">9:27</span>
      <div class="status-icons">
        <svg width="18" height="12" viewBox="0 0 18 12" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="8" width="3" height="4" rx="0.5" fill="black"/><rect x="4.5" y="6" width="3" height="6" rx="0.5" fill="black"/><rect x="9" y="3" width="3" height="9" rx="0.5" fill="black"/><rect x="13.5" y="0" width="3" height="12" rx="0.5" fill="black"/></svg>
        <svg width="16" height="12" viewBox="0 0 16 12" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M8 10.5C8.6 10.5 9.1 10 9.1 9.4C9.1 8.8 8.6 8.3 8 8.3C7.4 8.3 6.9 8.8 6.9 9.4C6.9 10 7.4 10.5 8 10.5Z" fill="black"/><path d="M8 6.5C9 6.5 9.9 6.9 10.6 7.6L11.6 6.6C10.6 5.6 9.4 5 8 5C6.6 5 5.4 5.6 4.4 6.6L5.4 7.6C6.1 6.9 7 6.5 8 6.5Z" fill="black"/><path d="M8 2.5C10.1 2.5 12 3.3 13.5 4.8L14.5 3.8C12.7 2 10.5 1 8 1C5.5 1 3.3 2 1.5 3.8L2.5 4.8C4 3.3 5.9 2.5 8 2.5Z" fill="black"/></svg>
        <svg width="25" height="12" viewBox="0 0 25 12" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="0.5" y="0.5" width="20" height="11" rx="2.5" stroke="black"/><rect x="2" y="2" width="17" height="8" rx="1.5" fill="black"/><rect x="22" y="4" width="2" height="4" rx="1" fill="black"/></svg>
      </div>
    </div>

    <div class="bp-header">
      <button type="button" class="back-btn" onclick="window.location.href='home.html'">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M12.5 4L6.5 10L12.5 16" stroke="#2b2b2b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <h1>Menu</h1>
    </div>

    <div class="menu-body">
      <p class="menu-section-label">SETTINGS</p>

      <div class="menu-row">
        <div class="menu-row-left">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M3 9V15H7L12 19V5L7 9H3Z" stroke="#2b2b2b" stroke-width="1.6" stroke-linejoin="round"/><path d="M16 9C17 10 17 14 16 15" stroke="#2b2b2b" stroke-width="1.6" stroke-linecap="round"/></svg>
          Sentence Playback
        </div>
        <button type="button" class="toggle-switch" id="playbackToggle" onclick="this.classList.toggle('on')"></button>
      </div>

      <div class="menu-row" style="cursor:pointer;" onclick="window.location.href='set-time.html'">
        <div class="menu-row-left">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 3C9 3 7 5.5 7 9V13L5 16H19L17 13V9C17 5.5 15 3 12 3Z" stroke="#2b2b2b" stroke-width="1.6" stroke-linejoin="round"/><path d="M10 19C10 20 11 21 12 21C13 21 14 20 14 19" stroke="#2b2b2b" stroke-width="1.6" stroke-linecap="round"/></svg>
          Reminder
        </div>
        <svg class="chevron-icon" width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M6 3L11 8L6 13" stroke="#9a9fa8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>

      <div class="menu-row" id="healthRow">
        <div class="menu-row-left">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 20C12 20 4 14.5 4 9C4 6.2 6.2 4 9 4C10.5 4 11.5 4.7 12 5.5C12.5 4.7 13.5 4 15 4C17.8 4 20 6.2 20 9C20 14.5 12 20 12 20Z" stroke="#2b2b2b" stroke-width="1.6"/></svg>
          Health Data
        </div>
        <button type="button" class="toggle-switch" id="healthToggle" onclick="toggleHealth()"></button>
      </div>

      <div class="info-card" id="healthCard" style="display:none;"></div>

      <p class="menu-section-label">INFO &amp; SUPPORT</p>

      <div class="menu-row" style="cursor:pointer;" onclick="window.location.href='about.html'">
        <div class="menu-row-left">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="#2b2b2b" stroke-width="1.6"/><circle cx="12" cy="8" r="1" fill="#2b2b2b"/><line x1="12" y1="11" x2="12" y2="16" stroke="#2b2b2b" stroke-width="1.6" stroke-linecap="round"/></svg>
          About HearO
        </div>
        <svg class="chevron-icon" width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M6 3L11 8L6 13" stroke="#9a9fa8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>

      <div class="menu-row" style="cursor:pointer;" onclick="window.location.href='help.html'">
        <div class="menu-row-left">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="#2b2b2b" stroke-width="1.6"/><path d="M9.5 9C9.5 7.5 10.6 6.5 12 6.5C13.4 6.5 14.5 7.5 14.5 9C14.5 10.5 12 10.7 12 13" stroke="#2b2b2b" stroke-width="1.6" stroke-linecap="round"/><circle cx="12" cy="16" r="1" fill="#2b2b2b"/></svg>
          Help &amp; Support
        </div>
        <svg class="chevron-icon" width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M6 3L11 8L6 13" stroke="#9a9fa8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>

      <div class="menu-row" style="cursor:pointer;" onclick="window.location.href='contact-us.html'">
        <div class="menu-row-left">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M5 4C5 4 8 4 9 6L10 9C10 9 8.5 10 8.5 11C8.5 13 11 15.5 13 15.5C14 15.5 15 14 15 14L18 15C20 16 20 19 20 19C19 20 17 20 15 19C10 17 4 11 5 4Z" stroke="#2b2b2b" stroke-width="1.6" stroke-linejoin="round"/></svg>
          Contact Us
        </div>
        <svg class="chevron-icon" width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M6 3L11 8L6 13" stroke="#9a9fa8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
    </div>
  </div>

<script>
  let healthState = "off";

  function toggleHealth() {
    const toggle = document.getElementById("healthToggle");
    const card = document.getElementById("healthCard");

    if (healthState === "off") {
      healthState = "install";
      toggle.classList.add("on");
      card.style.display = "block";
      card.innerHTML = `
        <p><strong>Health Connect Required.</strong> Please install the Health Connect app to enable access to your health measurements</p>
        <button type="button" class="info-card-btn" onclick="showPermissions()">Install Health Connect</button>
      `;
    } else {
      healthState = "off";
      toggle.classList.remove("on");
      card.style.display = "none";
    }
  }

  function showPermissions() {
    healthState = "permissions";
    const card = document.getElementById("healthCard");
    card.innerHTML = `
      <p style="margin-bottom:8px;"><strong>Remaining permissions:</strong></p>
      <ul class="permission-list">
        <li>Steps</li>
        <li>Distance</li>
      </ul>
      <button type="button" class="info-card-btn">Allow access</button>
    `;
  }
</script>
</body>
</html>
