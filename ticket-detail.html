        </a>
        <a href="ctm.html" class="nav-item">

    <!-- MAIN -->
    <div class="main" id="main">

      <!-- TOPBAR -->
      <header class="topbar">
        <h1 class="page-title">Support</h1>
        <div class="topbar-actions">
          <div class="topbar-item">
            <button class="icon-btn" aria-label="Add" id="orgSwitchBtn">
              <svg width="19" height="19" viewBox="0 0 24 24" fill="none"><path d="M10 3H14C14.55 3 15 3.45 15 4V9H20C20.55 9 21 9.45 21 10V14C21 14.55 20.55 15 20 15H15V20C15 20.55 14.55 21 14 21H10C9.45 21 9 20.55 9 20V15H4C3.45 15 3 14.55 3 14V10C3 9.45 3.45 9 4 9H9V4C9 3.45 9.45 3 10 3Z" stroke="#6B7684" stroke-width="1.6" stroke-linejoin="round"/></svg>
            </button>
            <div class="topbar-popover org-popover" id="orgPopover">
              <label class="org-radio-item">
                <input type="radio" name="org" value="b01" checked />
                <span class="radio-dot"></span>
                B01
              </label>
              <label class="org-radio-item">
                <input type="radio" name="org" value="101" />
                <span class="radio-dot"></span>
                101
              </label>
              <label class="org-radio-item">
                <input type="radio" name="org" value="104" />
                <span class="radio-dot"></span>
                104
              </label>
              <label class="org-radio-item">
                <input type="radio" name="org" value="b03" />
                <span class="radio-dot"></span>
                B03
              </label>
              <label class="org-radio-item">
                <input type="radio" name="org" value="105" />
                <span class="radio-dot"></span>
                105
              </label>
            </div>
          </div>
          <div class="topbar-item">
            <button class="icon-btn" aria-label="Language" id="langBtn">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="#6B7684" stroke-width="1.8"/><path d="M3 12H21" stroke="#6B7684" stroke-width="1.8"/><path d="M12 3C14.5 5.7 15.8 8.8 15.8 12C15.8 15.2 14.5 18.3 12 21C9.5 18.3 8.2 15.2 8.2 12C8.2 8.8 9.5 5.7 12 3Z" stroke="#6B7684" stroke-width="1.8"/></svg>
            </button>
            <div class="topbar-popover org-popover" id="langPopover">
              <label class="org-radio-item">
                <input type="radio" name="lang" value="en" checked />
                <span class="radio-dot"></span>
                English
              </label>
              <label class="org-radio-item">
                <input type="radio" name="lang" value="es" />
                <span class="radio-dot"></span>
                Español
              </label>
            </div>
          </div>
          <div class="topbar-item">
            <button class="icon-btn badge" aria-label="Notifications" data-count="2" id="notifBtn">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M18 9.5C18 7.7 17.3 6 16 4.8C14.7 3.6 13 3 11.3 3.1C8.1 3.3 5.6 6.1 5.6 9.4V12.5C5.6 13.1 5.4 13.7 5 14.2L4 15.5C3.4 16.3 4 17.5 5 17.5H19C20 17.5 20.6 16.3 20 15.5L19 14.2C18.6 13.7 18.4 13.1 18.4 12.5" stroke="#6B7684" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.5 20.5C10 21.3 10.9 21.8 12 21.8C13.1 21.8 14 21.3 14.5 20.5" stroke="#6B7684" stroke-width="1.6" stroke-linecap="round"/></svg>
            </button>
            <div class="topbar-popover notif-popover" id="notifPopover">
              <h3 class="notif-title">Notifications</h3>
              <div class="notif-tabs" id="notifTabs">
                <button class="notif-tab" data-tab="team">Team</button>
                <button class="notif-tab active" data-tab="foryou">For you</button>
              </div>
              <div class="notif-list" id="notifList"></div>
              <a href="#" class="notif-view-more">View more</a>
            </div>
          </div>
          <button class="icon-btn badge" aria-label="Messages" data-count="1">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 5.5C4 4.4 4.9 3.5 6 3.5H18C19.1 3.5 20 4.4 20 5.5V14.5C20 15.6 19.1 16.5 18 16.5H9L5 20V16.5H6C4.9 16.5 4 15.6 4 14.5V5.5Z" stroke="#6B7684" stroke-width="1.6" stroke-linejoin="round"/></svg>
          </button>
          <div class="topbar-item">
            <button class="avatar avatar-btn" aria-label="Profile" id="profileBtn">EC</button>
            <div class="topbar-popover more-popover" id="profilePopover">
              <a href="study-material.html" class="more-menu-item">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6C2 4.9 2.9 4 4 4H10C11.1 4 12 4.9 12 6V20C12 19.4 11.1 19 10 19H4C2.9 19 2 18.4 2 17.8V6Z"/><path d="M22 6C22 4.9 21.1 4 20 4H14C12.9 4 12 4.9 12 6V20C12 19.4 12.9 19 14 19H20C21.1 19 22 18.4 22 17.8V6Z"/></svg>
                Patient Onboarding Guide
              </a>
            </div>
          </div>
          <div class="topbar-item">
            <button class="icon-btn" aria-label="More" id="moreBtn">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="5" r="1.6" fill="#6B7684"/><circle cx="12" cy="12" r="1.6" fill="#6B7684"/><circle cx="12" cy="19" r="1.6" fill="#6B7684"/></svg>
            </button>
            <div class="topbar-popover more-popover" id="morePopover">
              <a href="backoffice1/index.html" class="more-menu-item">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="7" height="7" rx="1.5" stroke="#6B7684" stroke-width="1.6"/><rect x="14" y="3" width="7" height="7" rx="1.5" stroke="#6B7684" stroke-width="1.6"/><rect x="3" y="14" width="7" height="7" rx="1.5" stroke="#6B7684" stroke-width="1.6"/><rect x="14" y="14" width="7" height="7" rx="1.5" stroke="#6B7684" stroke-width="1.6"/></svg>
                Backoffice Designs
              </a>
            </div>
          </div>
        </div>
      </header>

      <!-- CONTENT -->
      <div class="list-content">

        <div class="ticket-detail-topbar-row">
          <div class="ticket-detail-title-group">
            <a href="support.html" class="ticket-detail-back" aria-label="Back to Support">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6L9 12L15 18"/></svg>
            </a>
            <h1 class="ticket-detail-title" id="ticketDetailTitle"></h1>
            <div id="ticketDetailPills" style="display:flex; gap:8px;"></div>
          </div>
          <div class="ticket-detail-actions" id="ticketDetailActions" hidden>
            <button type="submit" form="ticketDetailForm" class="btn-save" id="saveTicketDetailBtn" disabled>Save Changes</button>
          </div>
        </div>

        <div id="ticketDetailBody"></div>

      </div>
    </div>
  </div>

  <!-- Chat with Patient (patient-sourced tickets only) -- lives outside
       #ticketDetailBody (which gets rebuilt wholesale on every Save Changes /
       Resolve) so the open/closed panel state and message thread survive a
       re-render. Same chat-panel/chat-tab markup pattern as the clinic
       portal's own patient-data.html. -->
  <button class="chat-tab" id="chatOpenBtn" hidden><span class="dot-live"></span>Chat</button>

  <aside class="chat-panel" id="chatPanel">
    <div class="chat-panel-header">
      Chat with Patient
      <button class="chat-close" id="chatCloseBtn" aria-label="Close chat">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M6 6L18 18M18 6L6 18" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="chat-messages" id="chatMessages"></div>
    <div class="chat-empty-state" id="chatEmptyState" hidden>
      <p class="chat-empty-title">No messages yet</p>
      <p class="chat-empty-sub">Start a conversation by sending a message below</p>
    </div>
    <div class="chat-input-row">
      <div class="chat-input-wrap">
        <input type="text" id="chatInputField" placeholder="Type a message..." />
      </div>
      <button class="chat-send" id="chatSendBtn" aria-label="Send">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M5 12H19M19 12L13 6M19 12L13 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="chat-plus-wrap">
        <button type="button" class="chat-plus" id="chatPlusBtn" aria-label="Add attachment">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M12 5V19M5 12H19" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
        <div class="chat-plus-menu" id="chatPlusMenu">
          <button type="button" class="chat-plus-menu-item" data-request="image">Request an image</button>
          <button type="button" class="chat-plus-menu-item" data-request="video">Request a video</button>
        </div>
      </div>
    </div>
  </aside>

<script src="js/topbar.js"></script>
<script src="js/support-data.js"></script>
<script src="js/support-tickets-common.js"></script>
<script src="js/custom-select.js"></script>
<script src="js/ticket-detail.js"></script>
</body>
</html>
