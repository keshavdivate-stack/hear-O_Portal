<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HearO | Log In</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div class="auth-page" style="flex-direction:column;">
    <div class="auth-card">
      <img src="https://web.dev3.cordiomed.com/assets/icons/logo.svg" alt="HearO" class="auth-logo" />

      <div id="linkedBanner" class="auth-field" style="display:none; margin-bottom:22px;">
        <div style="display:flex; align-items:center; gap:8px; background:#E7F8EF; border-radius:9px; padding:10px 14px; font-size:12.5px; font-weight:700; color:var(--green);">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M4 12L9 17L20 6" stroke="var(--green)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Health record linked successfully
        </div>
      </div>

      <div class="auth-field">
        <label>Username</label>
        <input type="text" placeholder="Username" autocomplete="username" />
      </div>
      <div class="auth-field">
        <label>Password</label>
        <input type="password" placeholder="Password" autocomplete="current-password" />
      </div>

      <button type="button" class="auth-btn" id="loginBtn">Log in</button>
      <a href="#" class="auth-link">Forgot Password?</a>
    </div>

    <div class="auth-footer">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#57626D" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M3 12H21"/><path d="M12 3C14.5 5.7 15.8 8.8 15.8 12C15.8 15.2 14.5 18.3 12 21C9.5 18.3 8.2 15.2 8.2 12C8.2 8.8 9.5 5.7 12 3Z"/></svg>
      <select class="auth-lang-select">
        <option>English</option>
        <option>Español</option>
        <option>हिन्दी</option>
      </select>
    </div>

    <p class="auth-disclaimer">This software is provided for demonstration, evaluation, and training purposes only. Do Not Use for Clinical Decisions.</p>
  </div>

<script>
  if (new URLSearchParams(window.location.search).get("linked") === "1") {
    document.getElementById("linkedBanner").style.display = "block";
  }

  document.getElementById("loginBtn").addEventListener("click", () => {
    window.location.href = "index.html";
  });
</script>

</body>
</html>
