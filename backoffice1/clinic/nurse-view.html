<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HearO | Nurse View (Backoffice)</title>
<!--
  Backoffice consolidation decision (not a missing feature): root's
  nurse-view.html is a near-duplicate of root's patient-data.html -- same
  chart, same tabs and modals, and the same redaction policy applies to both.
  Re-forking it here would recreate the "two copies of the same screen drift
  apart" problem. Since every patient in this backoffice copy is shown only by
  user number, there is nothing nurse-view.html would show differently from
  the already-redacted patient-data.html. The patient list links chartView:
  "nurse" patients here (same as the root app), so this page forwards straight
  to patient-data.html, keeping the query string (?discontinued=..., ?patient=,
  ?openTab=..., etc.) intact.
-->
<script>window.location.replace("patient-data.html" + window.location.search + window.location.hash);</script>
<noscript><meta http-equiv="refresh" content="0; url=patient-data.html" /></noscript>
</head>
<body>
<p style="font-family:'Segoe UI',sans-serif; padding:24px;">
  Redirecting to <a href="patient-data.html" id="patientDataLink">Patient Data</a>&hellip;
</p>
<script>document.getElementById("patientDataLink").href = "patient-data.html" + window.location.search + window.location.hash;</script>
</body>
</html>
