<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HearO Backoffice | Change Password</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css?v=4" />
</head>
<body>

  <div class="bo-auth-page">
    <div class="bo-auth-card">
      <img src="https://web.dev3.cordiomed.com/assets/icons/logo.svg" alt="HearO" class="bo-auth-logo" />
      <h1 class="bo-auth-title">Change Password</h1>
      <p class="bo-auth-subtitle">Choose a new password for your Backoffice account.</p>

      <div id="changePwSuccess" class="bo-auth-success" style="display:none;">
        Password updated successfully.
      </div>

      <div class="bo-modal-field">
        <label for="currentPassword">Current Password</label>
        <input type="password" id="currentPassword" placeholder="Enter current password" autocomplete="current-password" />
      </div>
      <div class="bo-modal-field">
        <label for="newPassword">New Password</label>
        <input type="password" id="newPassword" placeholder="Enter new password" autocomplete="new-password" />
      </div>
      <div class="bo-modal-field">
        <label for="confirmPassword">Confirm New Password</label>
        <input type="password" id="confirmPassword" placeholder="Re-enter new password" autocomplete="new-password" />
      </div>
      <p id="changePwError" class="bo-field-error" style="display:none;">New password and confirmation don't match.</p>

      <div class="bo-auth-actions">
        <button type="button" class="bo-btn-primary" id="savePasswordBtn">Save Changes</button>
        <button type="button" class="bo-btn-secondary" id="cancelPasswordBtn">Cancel</button>
      </div>
    </div>
  </div>

<script>
  document.getElementById("cancelPasswordBtn").addEventListener("click", () => {
    window.location.href = "overview-dashboard.html";
  });

  document.getElementById("savePasswordBtn").addEventListener("click", () => {
    const newPassword = document.getElementById("newPassword").value;
    const confirmPassword = document.getElementById("confirmPassword").value;
    const errorEl = document.getElementById("changePwError");

    if (!newPassword || newPassword !== confirmPassword) {
      errorEl.style.display = "block";
      return;
    }

    errorEl.style.display = "none";
    document.getElementById("changePwSuccess").style.display = "flex";
    setTimeout(() => {
      window.location.href = "overview-dashboard.html";
    }, 1200);
  });
</script>

</body>
</html>
